<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJA</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  color:#111;
}

button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:white;
}

.loginBox{
  width:100%;
  max-width:400px;
}

.logo{
  text-align:center;
  font-size:48px;
  font-weight:900;
  margin-bottom:5px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

input,textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  outline:none;
  background:white;
  margin-bottom:10px;
}

textarea{
  min-height:100px;
  resize:none;
}

.primary{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  background:#111;
  color:white;
  font-weight:bold;
}

.switch{
  width:100%;
  border:0;
  background:white;
  padding:14px;
  font-weight:bold;
}

.message{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:10px;
}

.app{
  display:none;
  max-width:680px;
  min-height:100vh;
  margin:auto;
  background:white;
}

.topbar{
  height:60px;
  position:sticky;
  top:0;
  z-index:10;
  background:white;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:center;
}

.topbar b{font-size:27px}

.page{
  display:none;
  padding-bottom:80px;
}

.page.active{display:block}

.composer{
  padding:15px;
  border-bottom:1px solid #eee;
}

.postTools{
  display:flex;
  gap:8px;
  align-items:center;
}

.tool{
  border:0;
  background:#eee;
  border-radius:10px;
  padding:10px 13px;
}

.postButton{
  width:auto;
  margin-left:auto;
  padding:10px 20px;
}

.preview{

  margin-bottom:10px;
}

.preview img{
  width:100%;
  max-height:420px;
  object-fit:cover;
  border-radius:14px;
}

.removeImage{
  position:absolute;
  right:8px;
  top:8px;
  width:32px;
  height:32px;

}

.thread{

.avatar,.avatarText{

}

.avatarText{

  justify-content:center;

.username{font-weight:bold}
.handle{color:#888;font-size:12px}

.threadText{
  margin:12px 0;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.threadImage{
  width:100%;
  max-height:550px;
  object-fit:cover;
  border-radius:14px;
}

.actions{
  display:flex;
  gap:18px;
  margin-top:12px;
  flex-wrap:wrap;
}

.action{
  border:0;
  background:none;
  color:#666;
}

.action:hover{color:#111}

.comments{
  display:none;
  margin-top:12px;
}

.comment{
  border-top:1px solid #eee;
  padding:10px 0;
  font-size:14px;
}

.commentBox{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.commentBox input{
  flex:1;
  margin:0;
}

.commentBox button{
  border:0;
  background:#111;
  color:white;

  padding:0 15px;
}

.profileBanner{

}

.profileBody{

}

.profileAvatar{

  border-radius:50%;
  object-fit:cover;
  border:4px solid white;
  position:absolute;

  left:20px;

}

.profileAvatarText{
  width:105px;

  border-radius:50%;

  top:-52px;
  left:20px;
  background:#111;

  justify-content:center;

.profileTop{
  display:flex;

}

.profileInfo h2{

}

.profileEmail{
  color:#777;
  font-size:13px;
}

.profileBio{
  margin-top:12px;
  color:#555;
}

.settingsButton{
  border:0;
  background:#eee;
  border-radius:10px;
  padding:10px 13px;
}

.profileStats{
  display:flex;
  gap:40px;
  padding:20px 0;
  border-bottom:1px solid #eee;
}

.stat b{
  display:block;
  text-align:center;
}

.stat span{

  font-size:12px;
}

.profileTabs{
  display:flex;
  border-bottom:1px solid #eee;

.profileTab{
  flex:1;
  padding:14px;

  background:white;

  border-bottom:2px solid #111;
}

.settings{
  display:none;
  padding-top:20px;
}

.settings.open{display:block}

.label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

.fileButton{
  display:inline-block;
  padding:11px 14px;
  background:#eee;
  border-radius:10px;
  font-weight:bold;
  margin-bottom:15px;
}

.logout{
  border:0;
  background:#eee;
  border-radius:10px;
  padding:12px 20px;
}

.chatUser{
  display:flex;
  align-items:center;
  gap:11px;
  padding:15px;
  border-bottom:1px solid #eee;
}

.chatInfo{flex:1}
.small{font-size:12px;color:#888}

.chatWindow{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  max-width:680px;
  margin:auto;
  background:white;
}

.chatHeader{
  height:60px;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
}

.back{
  border:0;
  background:none;
  font-size:30px;
}

.messages{
  height:calc(100vh - 120px);
  overflow:auto;
  padding:15px;
}

.bubble{
  max-width:78%;
  background:#eee;
  border-radius:15px;
  padding:10px 13px;
  margin:7px 0;
  white-space:pre-wrap;
  word-break:break-word;
}

.mine{
  margin-left:auto;
  background:#111;
  color:white;
}

.sendBox{
  height:60px;
  border-top:1px solid #ddd;
  display:flex;
  gap:7px;
  padding:8px;
}

.sendBox input{
  flex:1;
  margin:0;
}

.sendBox button{
  border:0;
  background:#111;
  color:white;
  border-radius:10px;
  padding:0 17px;
}

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:680px;
  height:70px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  z-index:20;
}

.nav button{
  border:0;
  background:none;
  color:#777;
}

.nav button.active{
  color:#111;
  font-weight:bold;
}

.nav span{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.empty{
  padding:50px 20px;
  text-align:center;
  color:#888;
}
</style>
</head>

<body>

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp,
  increment
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyCAThpmkzHUaEgxafLjedZBoDdjfhaHjA4",

  authDomain:
  "maja-46a91.firebaseapp.com",

  projectId:
  "maja-46a91",

  storageBucket:
  "maja-46a91.firebasestorage.app",

  messagingSenderId:
  "1076643705312",

  appId:
  "1:1076643705312:web:1c10e9b5cfb0987a3ebb85"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


let currentUser = null;
let createMode = false;
let selectedPostImage = "";
let currentChatUser = null;
let unsubscribeMessages = null;
let unsubscribeProfilePosts = null;


const $ = id =>
document.getElementById(id);


function validUsername(name){

  return /^[A-Za-z0-9_]{3,20}$/.test(name);

}


function escapeHtml(text){

  return String(text || "")
  .replace(
    /[&<>"']/g,
    function(c){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[c];

    }
  );

}


function compressImage(
  file,
  maxWidth,
  quality
){

  return new Promise(
    function(resolve,reject){

      const reader =
      new FileReader();

      reader.onload =
      function(){

        const image =
        new Image();

        image.onload =
        function(){

          const scale =
          Math.min(
            1,
            maxWidth / image.width
          );

          const canvas =
          document.createElement(
            "canvas"
          );

          canvas.width =
          Math.round(
            image.width * scale
          );

          canvas.height =
          Math.round(
            image.height * scale
          );

          const ctx =
          canvas.getContext("2d");

          ctx.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
          );

          resolve(
            canvas.toDataURL(
              "image/jpeg",
              quality
            )
          );

        };

        image.onerror = reject;
        image.src = reader.result;

      };

      reader.onerror = reject;
      reader.readAsDataURL(file);

    }
  );

}


/* LOGIN MODE */

$("switchButton")
.addEventListener(
  "click",
  function(){

    createMode = !createMode;

    $("createFields")
    .classList
    .toggle(
      "hidden",
      !createMode
    );

    $("authButton")
    .textContent =
    createMode
    ? "Create Account"
    : "Sign In";

    $("switchButton")
    .textContent =
    createMode
    ? "Already have an account? Sign In"
    : "Create a new account";

    $("authMessage").textContent = "";

  }
);


/* LOGIN */

$("authButton")
.addEventListener(
  "click",
  async function(){

    const email =
    $("email").value.trim();

    const password =
    $("password").value;

    const username =
    $("username").value.trim();


    if(!email){

      $("authMessage").textContent =
      "Please enter your email.";

      return;

    }


    if(!password){

      $("authMessage").textContent =
      "Please enter your password.";

      return;

    }


    if(password.length < 6){

      $("authMessage").textContent =
      "Password must be at least 6 characters.";

      return;

    }


    if(
      createMode &&
      !validUsername(username)
    ){

      $("authMessage").textContent =
      "Username: 3-20 letters, numbers or underscore.";

      return;

    }


    $("authButton").disabled = true;

    $("authButton").textContent =
    createMode
    ? "Creating..."
    : "Signing in...";


    try{

      if(createMode){

        const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


        await setDoc(
          doc(
            db,
            "users",
            result.user.uid
          ),
          {
            username:username,
            email:email,
            photo:"",
            banner:"",
            createdAt:serverTimestamp()
          }
        );

      }else{

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      }

    }catch(error){

      console.error(
        "AUTH ERROR:",
        error
      );

      $("authMessage").textContent =
      error.code
      ? error.code + " — " + error.message
      : error.message;

    }


    $("authButton").disabled = false;

    $("authButton").textContent =
    createMode
    ? "Create Account"
    : "Sign In";

  }
);


/* AUTH */

onAuthStateChanged(
  auth,
  async function(user){

    currentUser = user;

    if(!user){

      $("login").style.display = "flex";
      $("app").style.display = "none";

      return;

    }


    $("login").style.display = "none";
    $("app").style.display = "block";

    await loadProfile();

    loadThreads();
    loadUsers();
    loadProfilePosts();

  }
);


/* PROFILE DATA */

async function getMyProfile(){

  const snap =
  await getDoc(
    doc(
      db,
      "users",
      currentUser.uid
    )
  );

  return snap.exists()
    ? snap.data()
    : {};

}


/* PROFILE */

async function loadProfile(){

  try{

    const data =
    await getMyProfile();

    const username =
    data.username || "user";


    $("profileName")
    .textContent =
    "@" + username;


    $("profileEmail")
    .textContent =
    data.email ||
    currentUser.email ||
    "";


    $("editUsername")
    .value =
    username;


    if(data.banner){

      $("profileBanner")
      .style.backgroundImage =
      'url("' + data.banner + '")';

    }else{

      $("profileBanner")
      .style.backgroundImage =
      "none";

    }


    if(data.photo){

      $("profileAvatarArea")
      .innerHTML =
      '<img class="profileAvatar" src="' +
      data.photo +
      '" alt="Profile">';

    }else{

      $("profileAvatarArea")
      .innerHTML =
      '<div class="profileAvatarText">' +
      escapeHtml(
        username.charAt(0).toUpperCase()
      ) +
      '</div>';

    }

  }catch(error){

    console.error(
      "PROFILE ERROR:",
      error
    );

  }

}


/* SETTINGS */

$("settingsButton")
.addEventListener(
  "click",
  function(){

    $("settingsPanel")
    .classList
    .toggle("open");

  }
);


/* SAVE USERNAME */

$("saveUsername")
.addEventListener(
  "click",
  async function(){

    const username =
    $("editUsername")
    .value
    .trim();


    if(!validUsername(username)){

      $("profileMessage").textContent =
      "Username must be 3-20 characters.";

      return;

    }


    $("saveUsername").disabled = true;

    $("profileMessage").textContent =
    "Saving...";


    try{

      await setDoc(
        doc(
          db,
          "users",
          currentUser.uid
        ),
        {
          username:username
        },
        {
          merge:true
        }
      );


      await loadProfile();

      $("profileMessage").textContent =
      "Username saved ✓";


    }catch(error){

      console.error(error);

      $("profileMessage").textContent =
      error.code +
      " — " +
      error.message;

    }


    $("saveUsername").disabled = false;

  }
);


/* PROFILE PHOTO */

$("profileImage")
.addEventListener(
  "change",
  async function(event){

    const file =
    event.target.files[0];

    if(!file)return;


    $("profileMessage").textContent =
    "Uploading picture...";


    try{

      const image =
      await compressImage(
        file,
        500,
        0.65
      );


      await setDoc(
        doc(
          db,
          "users",
          currentUser.uid
        ),
        {
          photo:image
        },
        {
          merge:true
        }
      );


      await loadProfile();

      $("profileMessage").textContent =
      "Profile picture updated ✓";


    }catch(error){

      console.error(error);

      $("profileMessage").textContent =
      error.code +
      " — " +
      error.message;

    }

  }
);


/* BANNER */

$("bannerImage")
.
