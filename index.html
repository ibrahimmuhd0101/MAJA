<style>

button,input,textarea{font:inherit}

<script type="module">

/* =========================
 FIREBASE
========================= */

import {
 initializeApp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 doc,
 setDoc,
 getDoc,
 addDoc,
 updateDoc,
 deleteDoc,
 query,
 orderBy,
 onSnapshot,
 serverTimestamp,
 increment
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyCAThpmkzHUaEgxafLjedZBoDdjfhaHjA4",

authDomain:"maja-46a91.firebaseapp.com",

projectId:"maja-46a91",

storageBucket:"maja-46a91.firebasestorage.app",

messagingSenderId:"1076643705312",

appId:"1:1076643705312:web:1c10e9b5cfb0987a3ebb85"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


let user=null;

let createMode=false;

let postImage="";

let chatUser=null;

let stopMessages=null;


/* =========================
 HELPER
========================= */

const $=id=>
document.getElementById(id);


function escapeText(value){

return String(value||"")
.replace(/[&<>"']/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c]));

}


function validUsername(name){

return /^[A-Za-z0-9_]{3,20}$/.test(name);

}


async function getMe(){

const snap=
await getDoc(
doc(db,"users",user.uid)
);

return snap.data()||{};

}


/* =========================
 IMAGE COMPRESS
========================= */

function imageToBase64(file,maxWidth=1000){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=()=>{

const img=new Image();

img.onload=()=>{

const scale=
Math.min(1,maxWidth/img.width);

const canvas=
document.createElement("canvas");

canvas.width=
img.width*scale;

canvas.height=
img.height*scale;

const ctx=
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);

resolve(
canvas.toDataURL(
"image/jpeg",
0.65
)
);

};

img.onerror=reject;

img.src=reader.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}


/* =========================
 LOGIN
========================= */

$("switchBtn").onclick=()=>{

createMode=!createMode;

$("usernameArea")
.classList.toggle(
"hidden",
!createMode
);

$("authBtn").textContent=
createMode
?"Create Account"
:"Sign In";

$("switchBtn").textContent=
createMode
?"Already have an account? Sign In"
:"Create a new account";

$("authMsg").textContent="";

};


$("authBtn").onclick=async()=>{

const email=
$("email").value.trim();

const password=
$("password").value;

const username=
$("username").value.trim();


if(!email||!password){

$("authMsg").textContent=
"Please fill all fields.";

return;

}


if(password.length<6){

$("authMsg").textContent=
"Password must be at least 6 characters.";

return;

}


if(
createMode &&
!validUsername(username)
){

$("authMsg").textContent=
"Username must contain 3-20 letters, numbers or _.";

return;

}


$("authBtn").disabled=true;


try{

if(createMode){

const result=
await createUserWithEmailAndPassword(
auth,
email,
password
);


await setDoc(
doc(db,"users",result.user.uid),
{
username,
email,
photo:"",
banner:"",
createdAt:serverTimestamp()
}
);


}else{

await signInWithEmailAndPassword(
auth,
email,
password
);

}


}catch(error){

$("authMsg").textContent=
error.code+
" — "+
error.message;

}


$("authBtn").disabled=false;

};


/* =========================
 AUTH STATE
========================= */

onAuthStateChanged(
auth,
async current=>{

user=current;


if(!current){

$("login").style.display="flex";

$("app").style.display="none";

return;

}


$("login").style.display="none";

$("app").style.display="block";


await ensureUser();

await loadProfile();

loadThreads();

loadUsers();

loadNotifications();

}
);


async function ensureUser(){

const ref=
doc(db,"users",user.uid);

const snap=
await getDoc(ref);


if(!snap.exists()){

await setDoc(
ref,
{
username:
"Maja_"+Math.floor(
Math.random()*9000+1000
),

email:user.email||"",

photo:"",

banner:"",

createdAt:serverTimestamp()
}
);

}

}


/* =========================
 NOTIFICATIONS
========================= */

async function createNotification(
targetUserId,
type,
text,
threadId=""
){

if(
!targetUserId ||
targetUserId===user.uid
)return;


await addDoc(
collection(db,"notifications"),
{
userId:targetUserId,
fromId:user.uid,
type,
text,
threadId,
read:false,
createdAt:serverTimestamp()
}
);

}


function loadNotifications(){

const q=
query(
collection(db,"notifications"),
orderBy(
"createdAt",
"desc"
)
);


onSnapshot(q,snap=>{

const list=[];


snap.forEach(item=>{

const d=item.data();

if(
d.userId===user.uid
){

list.push({
id:item.id,
...d
});

}

});


const unread=
list.filter(
n=>n.read===false
).length;


$("badge").textContent=
unread;


$("badge")
.classList.toggle(
"hidden",
unread===0
);


$("notifications").innerHTML="";


if(!list.length){

$("notifications").innerHTML=
`<div class="noticeEmpty">
No notifications
</div>`;

return;

}


list.forEach(n=>{

const div=
document.createElement("div");

div.className=
"notification "+
(!n.read?"unread":"");


div.innerHTML=
`
<b>🔔 MAJA</b>
${escapeText(n.text)}
`;


div.onclick=async()=>{

if(!n.read){

await updateDoc(
doc(
db,
"notifications",
n.id
),
{
read:true
}
);

}

};


$("notifications")
.appendChild(div);

});

});

}


$("bell").onclick=async()=>{

$("notificationPanel")
.classList.toggle("open");


/* mark visible notifications as read */

if(
$("notificationPanel").classList.contains("open")
){

const q=
query(
collection(db,"notifications"),
orderBy(
"createdAt",
"desc"
)
);

const snap=await new Promise(
resolve=>{

const stop=
onSnapshot(q,s=>{
stop();
resolve(s);
});

}
);


for(
const item of snap.docs
){

const d=item.data();

if(
d.userId===user.uid &&
d.read===false
){

await updateDoc(
item.ref,
{read:true}
);

}

}

}

};


/* =========================
 THREAD POST
========================= */

$("photoBtn").onclick=()=>{
$("postFile").click();
};


$("postFile").onchange=
async e=>{

const file=
e.target.files[0];

if(!file)return;


try{

postImage=
await imageToBase64(
file,
1000
);


$("postPreview")
.classList.remove("hidden");


$("postPreview").innerHTML=
`
<img
class="threadImg"
src="${postImage}">
`;

}catch(error){

$("postMsg").textContent=
"Image error.";

}

};


$("postBtn").onclick=
async()=>{

const text=
$("postText").value.trim();


if(!text&&!postImage){

$("postMsg").textContent=
"Write something or add a photo.";

return;

}


$("postBtn").disabled=true;

$("postMsg").textContent=
"Posting...";


try{

const m=await getMe();


await addDoc(
collection(db,"threads"),
{
text,
image:postImage,
username:m.username||"user",
userId:user.uid,
likes:0,
reposts:0,
createdAt:serverTimestamp()
}
);


$("postText").value="";

$("postFile").value="";

postImage="";

$("postPreview").innerHTML="";

$("postPreview")
.classList.add("hidden");


$("postMsg").textContent=
"Posted ✓";


}catch(error){

$("postMsg").textContent=
error.code+
" — "+
error.message;

}


$("postBtn").disabled=false;

};


/* =========================
 THREADS
========================= */

function loadThreads(){

const q=
query(
collection(db,"threads"),
orderBy(
"createdAt",
"desc"
)
);


onSnapshot(
q,
snap=>{

$("threads").innerHTML="";


snap.forEach(
item=>{

renderThread(
item,
$("threads")
);

}
);


if(snap.empty){

$("threads").innerHTML=
`
<div class="empty">
No threads yet.
</div>
`;

}

},
error=>{

$("threads").innerHTML=
`
<div class="empty">
${escapeText(error.message)}
</div>
`;

}
);

}


/* =========================
 RENDER THREAD
========================= */

function renderThread(
snap,
container
){

const d=snap.data();

const article=
document.createElement("article");

article.className="thread";


const initial=
(d.username||"U")
.charAt(0)
.toUpperCase();


article.innerHTML=
`

<div class="user">

<div class="avatarText">
${escapeText(initial)}
</div>

<div>

<div class="username">
@${escapeText(
d.username||"user"
)}
</div>

<div class="handle">
MAJA
</div>

</div>

</div>


${
d.text
?
`
<div class="threadText">
${escapeText(d.text)}
</div>
`
:""
}


${
d.image
?
`
<img
class="threadImg"
src="${d.image}">
`
:""
}


<div class="actions">

<button class="action like">
♡ Like (${d.likes||0})
</button>

<button class="action commentBtn">
💬 Comment
</button>

<button class="action repost">
🔁 Repost (${d.reposts||0})
</button>

${
d.userId===user.uid
?
`
<button class="action delete">
🗑 Delete
</button>
`
:""
}

</div>


<div class="comments">

<div class="commentList">
</div>

<div class="commentBox">

<input
placeholder="Write a comment...">

<button>
Send
</button>

</div>

</div>

`;


/* LIKE */

const likeButton=
article.querySelector(".like");


likeButton.onclick=
async()=>{

await updateDoc(
doc(
db,
"threads",
snap.id
),
{
likes:increment(1)
}
);


const m=
await getMe();


await createNotification(
d.userId,
"like",
"@"+
(m.username||"user")+
" liked your thread.",
snap.id
);

};


/* COMMENT */

const commentButton=
article.querySelector(
".commentBtn"
);


commentButton.onclick=()=>{

const box=
article.querySelector(
".comments"
);


box.style.display=
box.style.display==="block"
?"none"
:"block";


if(
box.style.display==="block"
){

loadComments(
snap.id,
article.querySelector(
".commentList"
)
);

}

};


const commentInput=
article.querySelector(
".commentBox input"
);


const commentSend=
article.querySelector(
".commentBox button"
);


commentSend.onclick=
async()=>{

const text=
commentInput.value.trim();


if(!text)return;


commentSend.disabled=true;


try{

const m=await getMe();


await addDoc(
collection(
db,
"threads",
snap.id,
"comments"
),
{
text,
username:m.username||"user",
userId:user.uid,
createdAt:serverTimestamp()
}
);


await createNotification(
d.userId,
"comment",
"@"+
(m.username||"user")+
" commented on your thread.",
snap.id
);


commentInput.value="";


}catch(error){

console.error(error);

}


commentSend.disabled=false;

};


/* REPOST */

const repostButton=
article.querySelector(
".repost"
);


async function checkRepost(){

const repostId=
user.uid+
"_"+snap.id;


const repostSnap=
await getDoc(
doc(
db,
"reposts",
repostId
)
);


if(repostSnap.exists()){

repostButton.classList.add(
"reposted"
);

repostButton.textContent=
"🔁 Reposted ("+
(d.reposts||0)+
")";

}

}


checkRepost();


repostButton.onclick=
async()=>{

repostButton.disabled=true;


try{

const repostId=
user.uid+
"_"+snap.id;


const repostRef=
doc(
db,
"reposts",
repostId
);


const repostSnap=
await getDoc(repostRef);


const m=await getMe();


if(repostSnap.exists()){

await deleteDoc(
repostRef
);


await updateDoc(
doc(
db,
"threads",
snap.id
),
{
reposts:increment(-1)
}
);


repostButton.classList.remove(
"reposted"
);


repostButton.textContent=
"🔁 Repost ("+
Math.max(
0,
(d.reposts||1)-1
)+
")";


}else{

await setDoc(
repostRef,
{
userId:user.uid,
threadId:snap.id,
createdAt:serverTimestamp()
}
);


await updateDoc(
doc(
db,
"threads",
snap.id
),
{
reposts:increment(1)
}
);


repostButton.classList.add(
"reposted"
);


repostButton.textContent=
"🔁 Reposted ("+
((d.reposts||0)+1)+
")";


await createNotification(
d.userId,
"repost",
"@"+
(m.username||"user")+
" reposted your thread.",
snap.id
);

}

}catch(error){

alert(
"Repost error: "+
error.message
);

}


repostButton.disabled=false;

};


/* DELETE */

const deleteButton=
article.querySelector(".delete");


if(deleteButton){

deleteButton.onclick=
async()=>{

if(
!confirm(
"Delete this thread?"
)
)return;


await deleteDoc(
doc(
db,
"threads",
snap.id
)
);

};

}


container.appendChild(article);

}


/* =========================
 COMMENTS
========================= */

function loadComments(
threadId,
list
){

db,

threadId,

),

/* =========================
 USERS
========================= */

function loadUsers(){

onSnapshot(
collection(db,"users"),
snap=>{

$("users").innerHTML="";


snap.forEach(item=>{

if(item.id===user.uid)return;


const d=item.data();

const name=
d.username||"user";


const div=
document.createElement("div");

div.className="chatUser";


div.innerHTML=
`

${
d.photo
?
`
<img
class="avatar"
src="${d.photo}">
`
:
`
<div class="avatarText">
${escapeText(
name.charAt(0)
.toUpperCase()
)}
</div>

}


<div class="chatInfo">

<b>
@${escapeText(name)}
</b>

<div class="small">
Tap to chat
</div>

);

});

/* =========================
 CHAT ID
========================= */

function chatId(a,b){

return [a,b]
.sort()
.join("_");

}


/* =========================
 OPEN CHAT
========================= */

function openChat(
uid,
name,
photo
){

chatUser=uid;


$("chatName").textContent=
"@"+name;


$("chatAvatar").innerHTML=
photo
?
`
<img
class="avatar"
src="${photo}">
`
:
`
<div class="avatarText">
${escapeText(
name.charAt(0)
.toUpperCase()
)}
</div>
`;


$("chatWindow")
.classList.add("open");


loadMessages();

}


/* =========================
 LIVE MESSAGES
========================= */

function loadMessages(){

if(stopMessages)
stopMessages();


const id=
chatId(
user.uid,
chatUser
);


const q=
query(
collection(
db,
"chats",
id,
"messages"
),
orderBy(
"createdAt",
"asc"
)
);


stopMessages=
onSnapshot(
q,
snap=>{

$("messages").innerHTML="";


snap.forEach(item=>{

const d=item.data();


const div=
document.createElement("div");


div.className=
"bubble "+
(
d.senderId===user.uid
?"mine"
:""
);


if(d.type==="image"){

div.innerHTML=
`
<img
class="messageImage"
src="${d.content}">
`;

}else if(
d.type==="sticker"
){

div.innerHTML=
`
<div class="sticker">
${escapeText(
d.content
)}
</div>
`;

}else{

div.textContent=
d.text||"";

}


$("messages")
.appendChild(div);

});


requestAnimationFrame(
()=>{

$("messages")
.scrollTop=
$("messages").scrollHeight;

}
);

}
);

}


/* =========================
 SEND TEXT
========================= */

async function sendText(){

if(!chatUser)return;


const input=
$("messageInput");


const text=
input.value.trim();


if(!text)return;


const id=
chatId(
user.uid,
chatUser
);


const m=
await getMe();


await addDoc(
collection(
db,
"chats",
id,
"messages"
),
{
type:"text",
text,
senderId:user.uid,
receiverId:chatUser,
senderUsername:
m.username||"user",
createdAt:
serverTimestamp()
}
);


await createNotification(
chatUser,
"message",
"@"+
(m.username||"user")+
" sent you a message."
);


input.value="";

input.focus();

}


$("sendBtn").onclick=
sendText;


$("messageInput")
.addEventListener(
"keydown",
e=>{

if(e.key==="Enter"){

e.preventDefault();

sendText();

}

}
);

 PHOTO MESSAGE

$("attachBtn").onclick=()=>{
$("chatFile").click();
};

);

collection(
db,

id,
"messages"
),
{

}

(m.username||"user")+

);

);

/* =========================
 STICKERS
========================= */

$("stickerBtn").onclick=()=>{

$("stickerPanel")
.classList.toggle("open");

};


document
.querySelectorAll(".stickerBtn")
.forEach(button=>{

button.onclick=
async()=>{

button.textContent;

chatId(

);

id,
"messages"
),
{
type:"sticker",
content:sticker,
senderId:user.uid,
receiverId:chatUser,
senderUsername:

createdAt:
serverTimestamp()
}
);

chatUser,
"message",
"@"+
(m.username||"user")+
" sent you a sticker."
);

.classList.remove("open");

/* =========================
 BACK CHAT
========================= */

$("backChat").onclick=()=>{

$("chatWindow")
.classList.remove("open");


if(stopMessages){

stopMessages();

stopMessages=null;

}


chatUser=null;

};


/* =========================
 PROFILE
========================= */

async function loadProfile(){

const d=
await getMe();


const username=
d.username||"user";


$("profileName")
.textContent=
"@"+username;


$("profileEmail")
.textContent=
d.email||user.email||"";


$("editUsername")
.value=username;


if(d.banner){

$("banner")
.style.backgroundImage=
`url("${d.banner}")`;

}else{

$("banner")
.style.backgroundImage="";

}


if(d.photo){

$("profilePicture")
.innerHTML=
`
<img
class="profilePic"
src="${d.photo}">
`;

}else{

$("profilePicture")
.innerHTML=
`
<div class="profilePicText">
${escapeText(
username.charAt(0)
.toUpperCase()
)}
</div>
`;

}


loadProfileStats();

}


async function loadProfileStats(){

const q=
query(
collection(db,"threads"),
orderBy(
"createdAt",
"desc"
)
);


onSnapshot(q,snap=>{

let posts=0;
let likes=0;


snap.forEach(item=>{

const d=item.data();


if(
d.userId===user.uid
){

posts++;

likes+=
Number(d.likes||0);

}

});


$("postCount")
.textContent=posts;


$("likeCount")
.textContent=likes;

});

}

 SETTINGS

 LOGOUT

/* =========================
 NAVIGATION
========================= */

function showPage(
page,
nav
){

document
.querySelectorAll(".page")
.forEach(x=>
x.classList.remove("active")
);


$(page)
.classList.add("active");


document
.querySelectorAll(".nav button")
.forEach(x=>
x.classList.remove("active")
);


$(nav)
.classList.add("active");

}


$("threadsNav").onclick=()=>{

showPage(
"threadsPage",
"threadsNav"
);

};


$("chatNav").onclick=()=>{

showPage(
"chatPage",
"chatNav"
);

};

async()=>{

"profileNav"
);

};
