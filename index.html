<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MAJA</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#fff;
 color:#111;
}

button,input,textarea,select{
 font:inherit;
}

button{cursor:pointer}

.hidden{display:none!important}

/* LOGIN */

#login{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.loginBox{
 width:100%;
 max-width:390px;
}

.logo{
 text-align:center;
 font-size:58px;
 font-weight:900;
 letter-spacing:-5px;
}

.tag{
 text-align:center;
 color:#777;
 margin:4px 0 28px;
}

.input{
 width:100%;
 padding:14px;
 border:1px solid #ddd;
 border-radius:14px;
 margin-bottom:10px;
 outline:none;
}

.primary{
 width:100%;
 padding:14px;
 border:0;
 border-radius:14px;
 background:#111;
 color:#fff;
 font-weight:bold;
}

.switch{
 width:100%;
 padding:14px;
 border:0;
 background:#fff;
 font-weight:bold;
}

.error{
 color:#d00;
 text-align:center;
 font-size:13px;
 margin-top:10px;
}

/* APP */

#app{
 display:none;
 max-width:680px;
 min-height:100vh;
 margin:auto;
}

.top{
 height:60px;
 position:sticky;
 top:0;
 z-index:50;
 display:flex;
 justify-content:center;
 align-items:center;
 background:#fff;
 border-bottom:1px solid #eee;
}

.top strong{
 font-size:24px;
}

/* PAGES */

.page{
 display:none;
 padding-bottom:85px;
}

.page.active{
 display:block;
}

/* COMPOSER */

.composer{
 padding:15px;
 border-bottom:1px solid #eee;
}

textarea{
 width:100%;
 min-height:90px;
 padding:13px;
 border:1px solid #ddd;
 border-radius:15px;
 resize:none;
 outline:none;
}

.row{
 display:flex;
 align-items:center;
 margin-top:8px;
}

.attach{
 border:0;
 background:none;
 font-size:23px;
}

.post{
 margin-left:auto;
 border:0;
 background:#111;
 color:#fff;
 padding:10px 18px;
 border-radius:20px;
 font-weight:bold;
}

/* THREAD */

.thread{
 padding:15px;
 border-bottom:1px solid #eee;
}

.head{
 display:flex;
 gap:10px;
 align-items:center;
}

.avatar{
 width:45px;
 height:45px;
 border-radius:50%;
 background:#111;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 overflow:hidden;
 flex-shrink:0;
}

.avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.username{
 font-weight:bold;
}

.small{
 font-size:12px;
 color:#777;
}

.threadText{
 margin:12px 0;
 line-height:1.5;
 white-space:pre-wrap;
}

.threadImg{
 width:100%;
 max-height:520px;
 object-fit:cover;
 border-radius:15px;
}

.actions{
 display:flex;
 justify-content:space-between;
 max-width:520px;
 margin-top:10px;
}

.action{
 border:0;
 background:none;
 color:#666;
}

/* MOMENT */

.moment{
 padding:15px;
 border-bottom:1px solid #eee;
}

.momentImg{
 width:100%;
 max-height:500px;
 object-fit:cover;
 border-radius:15px;
}

/* NAV */

.nav{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:100%;
 max-width:680px;
 height:70px;
 background:#fff;
 border-top:1px solid #ddd;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:100;
}

.nav button{
 border:0;
 background:none;
 color:#777;
 font-size:12px;
}

.nav button.active{
 color:#111;
 font-weight:bold;
}

.nav i{
 display:block;
 font-style:normal;
 font-size:22px;
 margin-bottom:3px;
}

/* PROFILE */

.profileHeader{
 height:60px;
 border-bottom:1px solid #eee;
 display:flex;
 align-items:center;
 padding:0 12px;
}

.back{
 border:0;
 background:none;
 font-size:28px;
}

.banner{
 height:210px;
 background:#ddd center/cover no-repeat;
 position:relative;
}

.camera{
 position:absolute;
 right:15px;
 bottom:15px;
 width:42px;
 height:42px;
 border-radius:50%;
 background:#000b;
 color:#fff;
 display:flex;
 justify-content:center;
 align-items:center;
}

.profileBody{
 position:relative;
 padding:65px 16px 100px;
}

.profileAvatar{
 position:absolute;
 top:-55px;
 left:16px;
}

.bigAvatar{
 width:108px;
 height:108px;
 border-radius:50%;
 object-fit:cover;
 background:#111;
 border:4px solid #fff;
}

.edit{
 float:right;
 border:1px solid #aaa;
 background:#fff;
 border-radius:20px;
 padding:9px 16px;
 font-weight:bold;
}

.status{
 clear:both;
 padding-top:15px;
 font-weight:bold;
}

.online{
 color:#159447;
}

.offline{
 color:#d00;
}

.profileName{
 font-size:23px;
 font-weight:800;
 margin-top:7px;
}

.stats{
 display:flex;
 gap:40px;
 margin-top:22px;
}

.stat strong{
 font-size:19px;
}

.stat span{
 display:block;
 color:#777;
 font-size:13px;
}

.gender{
 margin-top:20px;
 padding-bottom:15px;
 border-bottom:1px solid #eee;
}

.option{
 width:100%;
 text-align:left;
 padding:18px 0;
 background:#fff;
 border:0;
 border-bottom:1px solid #eee;
 font-weight:bold;
}

/* USERS */

.user{
 padding:15px;
 border-bottom:1px solid #eee;
}

.userRow{
 display:flex;
 align-items:center;
 gap:10px;
}

/* CHAT */

.chatWindow{
 position:fixed;
 inset:0;
 max-width:680px;
 margin:auto;
 background:#fff;
 z-index:300;
 display:none;
}

.chatWindow.open{
 display:block;
}

.chatHeader{
 height:60px;
 border-bottom:1px solid #eee;
 display:flex;
 align-items:center;
 padding:0 12px;
}

.chatHeader button{
 border:0;
 background:none;
 font-size:28px;
}

.chatHeader strong{
 margin-left:10px;
}

.messages{
 height:calc(100vh - 120px);
 overflow:auto;
 padding:15px;
}

.message{
 max-width:80%;
 padding:10px 13px;
 background:#eee;
 border-radius:17px;
 margin:7px 0;
}

.message.mine{
 margin-left:auto;
 background:#111;
 color:#fff;
}

.chatInput{
 position:absolute;
 bottom:0;
 width:100%;
 display:flex;
 gap:7px;
 padding:10px;
 border-top:1px solid #eee;
 background:#fff;
}

.chatInput input{
 flex:1;
 padding:11px 14px;
 border:1px solid #ddd;
 border-radius:22px;
 outline:none;
}

.send{
 width:44px;
 border:0;
 border-radius:50%;
 background:#111;
 color:#fff;
}

/* MODAL */

.modal{
 position:fixed;
 inset:0;
 background:#0008;
 z-index:500;
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
}

.modal.open{
 display:flex;
}

.modalBox{
 width:100%;
 max-width:400px;
 background:#fff;
 border-radius:18px;
 padding:18px;
}

.modalTop{
 display:flex;
 align-items:center;
 margin-bottom:15px;
}

.modalTop strong{
 flex:1;
}

.close{
 border:0;
 background:none;
 font-size:22px;
}

.save{
 border:0;
 background:#111;
 color:#fff;
 padding:8px 15px;
 border-radius:18px;
}
</style>
</head>

<script type="module">

/* FIREBASE WITHOUT STORAGE */

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 doc,
 getDoc,
 setDoc,
 addDoc,
 updateDoc,
 increment,
 serverTimestamp,
 query,
 orderBy,
 onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig={

apiKey:
"AIzaSyAUQm-3ullzFDRwn5Iu0Hg_7u0Mfiz688o",

authDomain:
"maja-1fa6a.firebaseapp.com",

projectId:
"maja-1fa6a",

messagingSenderId:
"877281790124",

appId:
"1:877281790124:web:14f693dfd580451e3bb709"

};


const firebaseApp=
initializeApp(firebaseConfig);

const auth=
getAuth(firebaseApp);

const db=
getFirestore(firebaseApp);


let currentUser=null;
let activeChat=null;
let signUpMode=false;


/* LOCAL IMAGE STORAGE */

function imageKey(type){

return "maja_"+type+"_"+currentUser.uid;

}


function saveLocalImage(type,data){

localStorage.setItem(
imageKey(type),
data
);

}


function getLocalImage(type){

return localStorage.getItem(
imageKey(type)
);

}


function removeLocalImage(type){

localStorage.removeItem(
imageKey(type)
);

}


/* HELPER */

const $=id=>
document.getElementById(id);


function safe(value){

return String(value||"")
.replace(/[&<>"']/g,x=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[x]));

}


/* FILE TO DATA URL */

function fileToDataURL(file){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();

reader.onload=()=>
resolve(reader.result);

reader.onerror=
reject;

reader.readAsDataURL(file);

}
);


/* GET USER */

}

async function getMe(){

const snap=
await getDoc(
doc(
db,
"users",
currentUser.uid
)
);

return snap.exists()
?snap.data()
:{};

}


/* AUTH MODE */

$("switchBtn").onclick=()=>{

signUpMode=!signUpMode;

$("signupFields")
.classList
.toggle(
"hidden",
!signUpMode
);

$("authBtn").textContent=
signUpMode
?"Create Account"
:"Sign In";

$("switchBtn").textContent=
signUpMode
?"Already have an account? Sign In"
:"Create a new account";

$("authError").textContent="";

};


/* AUTH */

$("authBtn").onclick=
async()=>{

const email=
$("email").value.trim();

const password=
$("password").value;

if(!email||!password){

$("authError").textContent=
"Enter email and password.";

return;

}

try{

if(signUpMode){

const username=
$("username").value.trim();

const gender=
$("gender").value;

if(username.length<3){

$("authError").textContent=
"Username must be at least 3 characters.";

return;

}

if(!gender){

$("authError").textContent=
"Select your gender.";

return;

}

const result=
await createUserWithEmailAndPassword(
auth,
email,
password
);

await setDoc(
doc(
db,
"users",
result.user.uid
),
{

username,
gender,
email,

photo:"",
banner:"",

online:true,

followersCount:0,
followingCount:0,

createdAt:
serverTimestamp(),

lastSeen:
serverTimestamp()

}
);

}else{

await signInWithEmailAndPassword(
auth,
email,
password
);

}

}catch(error){

console.error(error);

$("authError").textContent=
error.message;

}

};


/* AUTH STATE */

onAuthStateChanged(
auth,
async user=>{

if(!user){

$("login").style.display="flex";
$("app").style.display="none";

return;

}

currentUser=user;

$("login").style.display="none";
$("app").style.display="block";

await createUserDocument();

await setOnline(true);

loadThreads();

loadMoments();

loadUsers();

await loadProfile();

}
);


/* USER DOCUMENT */

async function createUserDocument(){

const ref=
doc(
db,
"users",
currentUser.uid
);

const snap=
await getDoc(ref);

if(!snap.exists()){

await setDoc(
ref,
{

username:"MajaUser",

email:
currentUser.email||"",

gender:"",

photo:"",
banner:"",

online:true,

followersCount:0,
followingCount:0,

createdAt:
serverTimestamp(),

lastSeen:
serverTimestamp()

}
);

}

}


/* ONLINE */

async function setOnline(value){

if(!currentUser)return;

await setDoc(
doc(
db,
"users",
currentUser.uid
),
{

online:value,
lastSeen:
serverTimestamp()

},
{
merge:true
}
);


/* NAVIGATION */

}

function showPage(
pageId,
buttonId
){

document
.querySelectorAll(".page")
.forEach(
page=>
page.classList.remove("active")
);

$(pageId)
.classList.add("active");

document
.querySelectorAll(".nav button")
.forEach(
button=>
button.classList.remove("active")
);

$(buttonId)
.classList.add("active");

}


$("navThreads").onclick=()=>
showPage(
"threads",
"navThreads"
);


$("navMoments").onclick=()=>
showPage(
"moments",
"navMoments"
);


$("navChat").onclick=()=>
showPage(
"chat",
"navChat"
);


$("navProfile").onclick=
async()=>{

showPage(
"profile",
"navProfile"
);

await loadProfile();

};


$("backProfile").onclick=()=>
showPage(
"threads",
"navThreads"
);


/* THREAD PHOTO */

$("threadPhotoBtn").onclick=()=>
$("threadPhoto").click();


$("postBtn").onclick=
async()=>{

const text=
$("threadText")
.value.trim();

const file=
$("threadPhoto")
.files[0];

if(!text&&!file)return;

try{

const user=
await getMe();

let image="";

if(file){

image=
await fileToDataURL(file);

}

await addDoc(
collection(
db,
"threads"
),
{

userId:
currentUser.uid,

username:
user.username||"user",

text,
image,

likes:0,
reposts:0,

createdAt:
serverTimestamp()

}
);

$("threadText").value="";
$("threadPhoto").value="";

}catch(error){

alert(error.message);

}

};


/* LOAD THREADS */

function loadThreads(){

const q=
query(
collection(db,"threads"),
orderBy(
"createdAt",
"desc"
)
);

onSnapshot(
q,
snap=>{

$("threadList").innerHTML="";

snap.forEach(
item=>{

const d=
item.data();

const el=
document.createElement("div");

el.className="thread";

el.innerHTML=`

<div class="head">

<div class="avatar">

${safe(
(d.username||"U")
.charAt(0)
.toUpperCase()
)}

</div>

<div>

<div class="username">
@${safe(
d.username||"user"
)}
</div>

<div class="small">
MAJA
</div>

</div>

</div>

<div class="threadText">
${safe(d.text||"")}
</div>

${
d.image
?
`<img
class="threadImg"
src="${d.image}">`
:
""
}

<div class="actions">

<button
class="action likeBtn">

❤️ ${d.likes||0}

</button>

<button
class="action">

💬

</button>

<button
class="action repostBtn">

🔁 ${d.reposts||0}

</button>

</div>
`;

el.querySelector(
".likeBtn"
).onclick=
async()=>{

await updateDoc(
doc(
db,
"threads",
item.id
),
{
likes:
increment(1)
}
);

};

el.querySelector(
".repostBtn"
).onclick=
async()=>{

await updateDoc(
doc(
db,
"threads",
item.id
),
{
reposts:
increment(1)
}
);

};

$("threadList")
.appendChild(el);

});

});

}


/* MOMENT PHOTO */

$("momentPhotoBtn").onclick=()=>
$("momentPhoto").click();


$("momentBtn").onclick=
async()=>{

const text=
$("momentText")
.value.trim();

const file=
$("momentPhoto")
.files[0];

if(!text&&!file)return;

try{

const user=
await getMe();

let image="";

if(file){

image=
await fileToDataURL(file);

}

await addDoc(
collection(
db,
"moments"
),
{

userId:
currentUser.uid,

username:
user.username||"user",

text,
image,

createdAt:
serverTimestamp()

}
);

$("momentText").value="";
$("momentPhoto").value="";

}catch(error){

alert(error.message);

}

};


/* MOMENTS */

function loadMoments(){

const q=
query(
collection(db,"moments"),
orderBy(
"createdAt",
"desc"
)
);

onSnapshot(
q,
snap=>{

$("momentList").innerHTML="";

snap.forEach(
item=>{

const d=
item.data();

const el=
document.createElement("div");

el.className="moment";

el.innerHTML=`

<div class="username">
✨ @${safe(
d.username||"user"
)}
</div>

<div class="threadText">
${safe(d.text||"")}
</div>

${
d.image
?
`<img
class="momentImg"
src="${d.image}">`
:
""
}

`;

$("momentList")
.appendChild(el);

});

});

}


/* PROFILE */

async function loadProfile(){

const user=
await getMe();

$("profileName")
.textContent=
"@"+
(user.username||"user");

$("profileGender")
.textContent=
user.gender||
"Not selected";

$("followersCount")
.textContent=
user.followersCount||0;

$("followingCount")
.textContent=
user.followingCount||0;

$("status").innerHTML=
user.online
?
'<span class="online">💚 Online</span>'
:
'<span class="offline">♥️ Offline</span>';


/* LOCAL PROFILE IMAGE */

const localPhoto=
getLocalImage("profile");

if(localPhoto){

$("avatarContainer")
.innerHTML=
`
<img
class="bigAvatar"
src="${localPhoto}">
`;

}else if(user.photo){

$("avatarContainer")
.innerHTML=
`
<img
class="bigAvatar"
src="${user.photo}">
`;

}else{

$("avatarContainer")
.innerHTML=
`
<div
class="bigAvatar"
style="
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:35px;
font-weight:bold">

${safe(
(user.username||"U")
.charAt(0)
.toUpperCase()
)}

</div>
`;

}


/* LOCAL BANNER */

const localBanner=
getLocalImage("banner");

if(localBanner){

$("banner")
.style
.backgroundImage=
`url("${localBanner}")`;

}else if(user.banner){

$("banner")
.style
.backgroundImage=
`url("${user.banner}")`;

}

}


/* PROFILE PICTURE */

$("avatarInput").onchange=
async event=>{

const file=
event.target.files[0];

if(!file)return;

try{

const image=
await fileToDataURL(file);

saveLocalImage(
"profile",
image
);

await setDoc(
doc(
db,
"users",
currentUser.uid
),
{
photo:"local"
},
{
merge:true
}
);

await loadProfile();

}catch(error){

alert(error.message);

}

};


/* BANNER */

$("bannerInput").onchange=

/* EDIT */

$("editBtn").onclick=
async()=>{

const user=
await getMe();

$("editUsername").value=
user.username||"";

$("editGender").value=
user.gender||"";

$("editModal")
.classList
.add("open");

};


$("closeEdit").onclick=()=>
$("editModal")
.classList
.remove("open");


$("saveEdit").onclick=
async()=>{

const username=
$("editUsername")
.value
.trim();

const gender=
$("editGender")
.value;

if(username.length<3){

alert(
"Username must be at least 3 characters."
);

return;

}

await setDoc(
doc(
db,
"users",
currentUser.uid
),
{

username,
gender

},
{
merge:true
}
);

$("editModal")
.classList
.remove("open");

await loadProfile();

};


/* USERS */

function loadUsers(){

onSnapshot(
collection(db,"users"),
snap=>{

$("usersList").innerHTML="";

let found=false;

snap.forEach(
item=>{

if(item.id===
currentUser.uid)return;

found=true;

const d=
item.data();

const el=
document.createElement("div");

el.className="user";

el.innerHTML=`

<div class="userRow">

<div class="avatar">

${
d.photo==="local"
?"👤"
:
safe(
(d.username||"U")
.charAt(0)
.toUpperCase()
)
}

</div>

<div>

<div class="username">
@${safe(
d.username||"user"
)}
</div>

<div class="${
d.online
?"online"
:"offline"
}">

${
d.online
?"💚 Online"
:"♥️ Offline"
}

</div>

</div>

</div>

`;

el.onclick=()=>{

openChat(
item.id,
d.username||"user"
);

};

$("usersList")
.appendChild(el);

});

if(!found){

$("usersList").innerHTML=
`
<div class="thread">
No other MAJA users yet.
</div>
`;

}

});

}


/* CHAT ID */

function chatId(){

return[
currentUser.uid,
activeChat
]
.sort()
.join("_");

}


/* OPEN CHAT */

function openChat(
uid,
name
){

activeChat=uid;

$("chatTitle")
.textContent="@"+name;

$("chatWindow")
.classList
.add("open");

loadMessages();

}


/* MESSAGES */

function loadMessages(){

if(!activeChat)return;

const q=
query(
collection(
db,
"chats",
chatId(),
"messages"
),
orderBy(
"createdAt",
"asc"
)
);

onSnapshot(
q,
snap=>{

$("messages").innerHTML="";

snap.forEach(
item=>{

const d=
item.data();

const el=
document.createElement("div");

el.className=
"message "+
(
d.userId===
currentUser.uid
?"mine"
:""
);

el.textContent=
d.text||"";

$("messages")
.appendChild(el);

});

$("messages")
.scrollTop=
$("messages")
.scrollHeight;

});

}


/* SEND MESSAGE */

$("sendBtn").onclick=
sendMessage;


$("messageInput")
.addEventListener(
"keydown",
event=>{

if(event.key==="Enter"){

event.preventDefault();

sendMessage();

}

}
);


async function sendMessage(){

if(!activeChat)return;

const input=
$("messageInput");

const text=
input.value.trim();

if(!text)return;

await addDoc(
collection(
db,
"chats",
chatId(),
"messages"
),
{

userId:
currentUser.uid,

text,

createdAt:
serverTimestamp()

}
);

input.value="";

}


/* CLOSE CHAT */

$("closeChat").onclick=()=>{

$("chatWindow")
.classList
.remove("open");

activeChat=null;

};


/* PROFILE OPTIONS */

$("threadsBtn").onclick=()=>
showPage(
"threads",
"navThreads"
);


$("likesBtn").onclick=()=>{

alert(
"Your liked Threads will appear here."
);

};


$("settingsBtn").onclick=()=>
$("editBtn").click();


/* LOGOUT */

$("logoutBtn").onclick=
async()=>{

try{

await setOnline(false);

await signOut(auth);

}catch(error){

alert(error.message);

}

};
