<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MAJA</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
color:#111;
}

button,input,textarea,select{
font:inherit;
}

button{
cursor:pointer;
}

.hidden{
display:none!important;
}

#login{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.loginBox{
width:100%;
max-width:390px;
}

.logo{
text-align:center;
font-size:58px;
font-weight:900;
letter-spacing:-5px;
}

.tag{
text-align:center;
color:#777;
margin-bottom:28px;
}

.input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:14px;
margin-bottom:10px;
outline:none;
}

.primary{
width:100%;
padding:14px;
border:0;
border-radius:14px;
background:#111;
color:#fff;
font-weight:bold;
}

.switch{
width:100%;
padding:14px;
border:0;
background:#fff;
font-weight:bold;
}

.error{
color:#d00;
font-size:13px;
text-align:center;
margin-top:10px;
}

#app{
display:none;
max-width:680px;
margin:auto;
min-height:100vh;
}

.top{
height:60px;
position:sticky;
top:0;
z-index:50;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
border-bottom:1px solid #eee;
}

.top strong{
font-size:24px;
}

.page{
display:none;
padding-bottom:85px;
}

.page.active{
display:block;
}

.composer{
padding:15px;
border-bottom:1px solid #eee;
}

textarea{
width:100%;
min-height:90px;
padding:13px;
border:1px solid #ddd;
border-radius:15px;
resize:none;
outline:none;
}

.row{
display:flex;
align-items:center;
margin-top:8px;
}

.attach{
border:0;
background:none;
font-size:23px;
}

.post{
margin-left:auto;
border:0;
background:#111;
color:#fff;
padding:10px 18px;
border-radius:20px;
font-weight:bold;
}

.thread,
.moment,
.user{
padding:15px;
border-bottom:1px solid #eee;
}

.head,
.userRow{
display:flex;
gap:10px;
align-items:center;
}

.avatar{
width:45px;
height:45px;
border-radius:50%;
background:#111;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
overflow:hidden;
flex-shrink:0;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.username{
font-weight:bold;
}

.small{
font-size:12px;
color:#777;
}

.threadText{
margin:12px 0;
line-height:1.5;
white-space:pre-wrap;
}

.threadImg,
.momentImg{
width:100%;
max-height:520px;
object-fit:cover;
border-radius:15px;
}

.actions{
display:flex;
justify-content:space-between;
margin-top:10px;
max-width:600px;
}

.action{
border:0;
background:none;
color:#666;
}

.action.liked{
color:red;
}

.action.reposted{
color:#159447;
}

.views{
color:#777;
font-size:13px;
margin-top:8px;
}

.followBtn{
margin-left:auto;
border:1px solid #111;
background:#111;
color:#fff;
border-radius:20px;
padding:8px 15px;
font-weight:bold;
}

.followBtn.following{
background:#fff;
color:#111;
}

.commentBox{
display:flex;
gap:8px;
margin-top:12px;
}

.commentBox input{
flex:1;
padding:11px 14px;
border:1px solid #ddd;
border-radius:20px;
outline:none;
}

.commentBox button{
border:0;
background:#111;
color:#fff;
border-radius:20px;
padding:9px 15px;
}

.comments{
margin-top:10px;
}

.comment{
padding:9px 0;
border-bottom:1px solid #eee;
font-size:14px;
}

.nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:680px;
height:70px;
background:#fff;
border-top:1px solid #ddd;
display:flex;
justify-content:space-around;
align-items:center;
z-index:100;
}

.nav button{
border:0;
background:none;
color:#777;
font-size:12px;
}

.nav button.active{
color:#111;
font-weight:bold;
}

.nav i{
display:block;
font-style:normal;
font-size:22px;
margin-bottom:3px;
}

.profileHeader{
height:60px;
border-bottom:1px solid #eee;
display:flex;
align-items:center;
padding:0 12px;
}

.back{
border:0;
background:none;
font-size:28px;
}

.banner{
height:210px;
background:#ddd center/cover no-repeat;
position:relative;
}

.camera{
position:absolute;
right:15px;
bottom:15px;
width:42px;
height:42px;
border-radius:50%;
background:#000b;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
}

.profileBody{
position:relative;
padding:65px 16px 100px;
}

.profileAvatar{
position:absolute;
top:-55px;
left:16px;
}

.bigAvatar{
width:108px;
height:108px;
border-radius:50%;
object-fit:cover;
background:#111;
border:4px solid #fff;
}

.edit{
float:right;
border:1px solid #aaa;
background:#fff;
border-radius:20px;
padding:9px 16px;
font-weight:bold;
}

.status{
clear:both;
padding-top:15px;
font-weight:bold;
}

.online{
color:#159447;
}

.offline{
color:#d00;
}

.profileName{
font-size:23px;
font-weight:800;
margin-top:7px;
}

.stats{
display:flex;
gap:40px;
margin-top:22px;
}

.stat strong{
font-size:19px;
}

.stat span{
display:block;
color:#777;
font-size:13px;
}

.gender{
margin-top:20px;
padding-bottom:15px;
border-bottom:1px solid #eee;
}

.option{
width:100%;
text-align:left;
padding:18px 0;
background:#fff;
border:0;
border-bottom:1px solid #eee;
font-weight:bold;
}

/* CHAT */

.chatWindow{
position:fixed;
inset:0;
max-width:680px;
margin:auto;
background:#fff;
z-index:300;
display:none;
}

.chatWindow.open{
display:block;
}

.chatHeader{
height:60px;
border-bottom:1px solid #eee;
display:flex;
align-items:center;
padding:0 12px;
}

.chatHeader button{
border:0;
background:none;
font-size:28px;
}

.chatUserInfo{
display:flex;
align-items:center;
gap:10px;
margin-left:10px;
}

.chatUserInfo .avatar{
width:38px;
height:38px;
font-size:14px;
}

.messages{
height:calc(100vh - 120px);
overflow:auto;
padding:15px;
background:#fafafa;
}

.message{
width:max-content;
max-width:78%;
padding:9px 12px;
margin:8px 0;
border-radius:17px 17px 17px 4px;
background:#e9e9e9;
word-break:break-word;
}

.message.mine{
margin-left:auto;
border-radius:17px 17px 4px 17px;
background:#111;
color:#fff;
}

.messageTime{
font-size:10px;
opacity:.55;
text-align:right;
margin-top:4px;
}

.chatInput{
position:absolute;
bottom:0;
width:100%;
display:flex;
gap:7px;
padding:10px;
border-top:1px solid #eee;
background:#fff;
}

.chatInput input{
flex:1;
padding:11px 14px;
border:1px solid #ddd;
border-radius:22px;
outline:none;
}

.send{
width:44px;
height:44px;
border:0;
border-radius:50%;
background:#111;
color:#fff;
}

/* EDIT */

.modal{
position:fixed;
inset:0;
background:#0008;
z-index:500;
display:none;
align-items:center;
justify-content:center;
padding:15px;
}

.modal.open{
display:flex;
}

.modalBox{
width:100%;
max-width:400px;
background:#fff;
border-radius:18px;
padding:18px;
}

.modalTop{
display:flex;
align-items:center;
margin-bottom:15px;
}

.modalTop strong{
flex:1;
}

.close{
border:0;
background:none;
font-size:22px;
}

.save{
border:0;
background:#111;
color:#fff;
padding:8px 15px;
border-radius:18px;
}

.dmButton{
padding:7px 13px;
}

.badge{
display:inline-flex;
align-items:center;
justify-content:center;
min-width:18px;
height:18px;
padding:0 5px;
border-radius:20px;
background:#e22;
color:#fff;
font-size:10px;
font-weight:bold;
margin-left:3px;
}

</style>
</head>

<script type="module">


/* =========================================
   FIREBASE
   YOUR API CONFIG - UNCHANGED
========================================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
getFirestore,
collection,
doc,
getDoc,
setDoc,
addDoc,
updateDoc,
deleteDoc,
getDocs,
increment,
serverTimestamp,
query,
orderBy,
where,
onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyAUQm-3ullzFDRwn5Iu0Hg_7u0Mfiz688o",

authDomain:
"maja-1fa6a.firebaseapp.com",

projectId:
"maja-1fa6a",

messagingSenderId:
"877281790124",

appId:
"1:877281790124:web:14f693dfd580451e3bb709"

};


const firebaseApp=
initializeApp(firebaseConfig);

const auth=
getAuth(firebaseApp);

const db=
getFirestore(firebaseApp);


let currentUser=null;
let activeChat=null;
let activeChatUnsubscribe=null;


/* =========================================
   HELPERS
========================================= */

const $=id=>
document.getElementById(id);


function safe(value){

return String(value||"")
.replace(/[&<>"']/g,x=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[x]));

}


function formatTime(date){

if(!date)return "";

return date.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

}


async function getMe(){

const snap=
await getDoc(
doc(
db,
"users",
currentUser.uid
)
);

return snap.exists()
?snap.data()
:{};

}


/* =========================================
   AUTH
========================================= */

let signUpMode=false;


$("switchBtn").onclick=()=>{

signUpMode=!signUpMode;

$("signupFields")
.classList
.toggle(
"hidden",
!signUpMode
);

$("authBtn").textContent=
signUpMode
?"Create Account"
:"Sign In";

$("switchBtn").textContent=
signUpMode
?"Already have an account? Sign In"
:"Create a new account";

};


$("authBtn").onclick=
async()=>{

const email=
$("email").value.trim();

const password=
$("password").value;

if(!email||!password){

$("authError").textContent=
"Enter email and password.";

return;

}

try{

if(signUpMode){

const username=
$("username").value.trim();

const gender=
$("gender").value;

if(username.length<3){

$("authError").textContent=
"Username must be at least 3 characters.";

return;

}

if(!gender){

$("authError").textContent=
"Select your gender.";

return;

}

const result=
await createUserWithEmailAndPassword(
auth,
email,
password
);

await setDoc(
doc(
db,
"users",
result.user.uid
),
{

username,
gender,
email,

photo:"",
banner:"",

online:true,

followersCount:0,
followingCount:0,

createdAt:
serverTimestamp(),

lastSeen:
serverTimestamp()

}
);

}else{

await signInWithEmailAndPassword(
auth,
email,
password
);

}

}catch(error){

console.error(error);

$("authError").textContent=
error.message;

}

};


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

$("login").style.display="flex";
$("app").style.display="none";

return;

}

currentUser=user;

$("login").style.display="none";
$("app").style.display="block";

await createUserDocument();

await setOnline(true);

loadThreads();
loadMoments();
loadUsers();
loadProfile();

}
);


async function createUserDocument(){

const ref=
doc(
db,
"users",
currentUser.uid
);

const snap=
await getDoc(ref);

if(!snap.exists()){

await setDoc(
ref,
{

username:"MajaUser",
email:
currentUser.email||"",

gender:"",
photo:"",
banner:"",

online:true,

followersCount:0,
followingCount:0,

createdAt:
serverTimestamp(),

lastSeen:
serverTimestamp()

}
);

}

}


async function setOnline(value){

if(!currentUser)return;

await setDoc(
doc(
db,
"users",
currentUser.uid
),
{

online:value,
lastSeen:
serverTimestamp()

},
{merge:true}
);

}


setInterval(
()=>{
setOnline(true);
},
60000
);


/* =========================================
   NAVIGATION
========================================= */

function showPage(
page,
button
){

document
.querySelectorAll(".page")
.forEach(
x=>x.classList.remove("active")
);

$(page).classList.add("active");

document
.querySelectorAll(".nav button")
.forEach(
x=>x.classList.remove("active")
);

$(button).classList.add("active");

}


$("navThreads").onclick=()=>
showPage(
"threads",
"navThreads"
);

$("navMoments").onclick=()=>
showPage(
"moments",
"navMoments"
);

$("navChat").onclick=()=>
showPage(
"chat",
"navChat"
);

$("navProfile").onclick=
async()=>{

showPage(
"profile",
"navProfile"
);

await loadProfile();

};


$("backProfile").onclick=()=>
showPage(
"threads",
"navThreads"
);


/* =========================================
   LOCAL IMAGE
========================================= */

function fileToDataURL(file){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();

reader.onload=()=>{
resolve(reader.result);
};

reader.onerror=reject;

reader.readAsDataURL(file);

}
);


}

function imageKey(type){

return
"MAJA_IMAGE_"+type+"_"+currentUser.uid;

}


/* =========================================
   THREAD CREATE
========================================= */

$("threadPhotoBtn").onclick=()=>
$("threadPhoto").click();


$("postBtn").onclick=
async()=>{

const text=
$("threadText")
.value
.trim();

const file=
$("threadPhoto")
.files[0];

if(!text&&!file)return;

try{

const user=
await getMe();

let image="";

if(file){

image=
await fileToDataURL(file);

}

await addDoc(
collection(
db,
"threads"
),
{

userId:
currentUser.uid,

username:
user.username||"user",

text,
image,

likesCount:0,
commentCount:0,
repostsCount:0,

createdAt:
serverTimestamp()

}
);

$("threadText").value="";
$("threadPhoto").value="";

}catch(error){

alert(error.message);

}

};


/* =========================================
   THREADS
========================================= */

function loadThreads(){

const q=
query(
collection(
db,
"threads"
),
orderBy(
"createdAt",
"desc"
)
);

onSnapshot(
q,
snapshot=>{

$("threadList").innerHTML="";

snapshot.forEach(
item=>{

const d=
item.data();

const el=
document.createElement("div");

el.className="thread";

el.innerHTML=`

<div class="head">

<div class="avatar">

${safe(
(d.username||"U")
.charAt(0)
.toUpperCase()
)}

</div>

<div>

<div class="username">
@${safe(
d.username||"user"
)}
</div>

<div class="small">
MAJA
</div>

</div>

</div>

<div class="threadText">
${safe(d.text||"")}
</div>

${
d.image
?
`<img class="threadImg"
src="${d.image}">`
:""
}

<div class="actions">

<button class="action likeBtn">
❤️ ${d.likesCount||0}
</button>

<button class="action commentBtn">
💬 ${d.commentCount||0}
</button>

<button class="action repostBtn">
🔁 ${d.repostsCount||0}
</button>

</div>

<div class="comments hidden"></div>

`;

const likeBtn=

function loadComments(

){

query(
collection(
db,
"threads",
threadId,

),

"createdAt",
"asc"
)

q,
snapshot=>{

"input"

/* =========================================
   DM
========================================= */

function getChatId(
uid1,
uid2
){

return[
uid1,
uid2
]
.sort()
.join("_");

}


async function openChat(
uid,
name
){

if(
!currentUser||
uid===
currentUser.uid
)return;

activeChat=uid;

$("chatTitle")
.textContent=
"@"+name;

$("chatWindow")
.classList
.add("open");

await loadChatUser(uid);

loadMessages();

}


async function loadChatUser(
uid
){

const snap=
await getDoc(
doc(
db,
"users",
uid
)
);

if(!snap.exists())return;

const user=
snap.data();

$("chatStatus")
.textContent=
user.online
?"🟢 Online"
:"Offline";

const avatar=
$("chatAvatar");

avatar.textContent=
(
user.username||
"U"
)
.charAt(0)
.toUpperCase();

}


/* =========================================
   LOAD DM
========================================= */

function loadMessages(){

if(!activeChat)return;

if(activeChatUnsubscribe){

activeChatUnsubscribe();

activeChatUnsubscribe=null;

}

const chatId=
getChatId(
currentUser.uid,
activeChat
);

const q=
query(
collection(
db,
"chats",
chatId,
"messages"
),
orderBy(
"createdAt",
"asc"
)
);

activeChatUnsubscribe=
onSnapshot(
q,
async snapshot=>{

$("messages").innerHTML="";

snapshot.forEach(
message=>{

const data=
message.data();

const div=
document.createElement("div");

const mine=
data.senderId===
currentUser.uid;

div.className=
"message"+
(
mine
?" mine"
:""
);

let time="";

if(
data.createdAt
){

time=
formatTime(
data.createdAt.toDate()
);

}

div.innerHTML=`

<div>
${safe(data.text||"")}
</div>

<div class="messageTime">

${time}

${
mine
?
(
data.seen
?" ✓✓"
:" ✓"
)
:""
}

</div>

`;

$("messages")
.appendChild(div);

}
);

$("messages").scrollTop=
$("messages").scrollHeight;

await markMessagesSeen();

}
);

}


/* =========================================
   SEND DM
========================================= */

async function sendMessage(){

if(!activeChat)return;

const input=
$("messageInput");

const text=
input.value.trim();

if(!text)return;

const chatId=
getChatId(
currentUser.uid,
activeChat
);

const user=
await getMe();

await setDoc(
doc(
db,
"chats",
chatId
),
{

members:[
currentUser.uid,
activeChat
],

lastMessage:text,

lastSender:
currentUser.uid,

updatedAt:
serverTimestamp()

},
{
merge:true
}
);

await addDoc(
collection(
db,
"chats",
chatId,
"messages"
),
{

senderId:
currentUser.uid,

receiverId:
activeChat,

senderName:
user.username||
"user",

text,

seen:false,

createdAt:
serverTimestamp()

}
);

input.value="";

}


$("sendBtn").onclick=
sendMessage;


$("messageInput")
.addEventListener(
"keydown",
event=>{

if(
event.key==="Enter"
){

event.preventDefault();

sendMessage();

}

}
);


/* =========================================
   MARK SEEN
========================================= */

async function markMessagesSeen(){

if(!activeChat)return;

const chatId=
getChatId(
currentUser.uid,
activeChat
);

const q=
query(
collection(
db,
"chats",
chatId,
"messages"
),
where(
"receiverId",
"==",
currentUser.uid
),
where(
"seen",
"==",
false
)
);

const snapshot=
await getDocs(q);

for(
const item of snapshot.docs
){

await updateDoc(
item.ref,
{
seen:true
}
);

}

}

   CLOSE CHAT
========================================= */

$("closeChat").onclick=
()=>{

$("chatWindow")
.classList
.remove("open");

activeChat=null;

if(
activeChatUnsubscribe

activeChatUnsubscribe();

activeChatUnsubscribe=null;

}
