<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>MAJA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #111;
    }

    .login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: white;
    }

    .login-box {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .welcome {
      color: #777;
      margin-bottom: 35px;
    }

    .phone-input,
    .otp-input {
      width: 100%;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .continue,
    .verify {
      width: 100%;
      padding: 16px;
      margin-top: 14px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .otp-area {
      display: none;
      margin-top: 15px;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      color: #777;
    }

    #recaptcha-container {
      margin-top: 15px;
      display: flex;
      justify-content: center;
    }

    .app {
      display: none;
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background: white;
      z-index: 5;
    }

    header h1 {
      font-size: 27px;
    }

    .page {
      display: none;
      padding-bottom: 90px;
    }

    .page.active {
      display: block;
    }

    .thread {
      padding: 20px;
      border-bottom: 1px solid #eee;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    .thread-text {
      margin: 14px 0;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 25px;
      color: #666;
      font-size: 14px;
    }

    .chat {
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #eee;
    }

    .chat-info {
      flex: 1;
    }

    .last-message {
      margin-top: 5px;
      color: #888;
      font-size: 14px;
    }

    .profile {
      text-align: center;
      padding: 45px 20px;
    }

    .profile .avatar {
      width: 90px;
      height: 90px;
      margin: auto;
      font-size: 30px;
    }

    .profile h2 {
      margin-top: 15px;
    }

    .profile p {
      margin-top: 7px;
      color: #777;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      height: 72px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav button {
      border: none;
      background: none;
      color: #777;
      font-size: 13px;
      cursor: pointer;
    }

    .nav button.active {
      color: #111;
      font-weight: bold;
    }

    .icon {
      display: block;
      font-size: 22px;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="login">

  <div class="login-box">

    <div class="logo">MAJA</div>

    <p class="welcome">
      Connect. Chat. Share.
    </p>

    <input
      id="phoneNumber"
      class="phone-input"
      type="tel"
      placeholder="+2348012345678"
      autocomplete="tel"
    >

    <button id="sendOtp" class="continue">
      Continue
    </button>

    <div id="recaptcha-container"></div>

    <div id="otpArea" class="otp-area">

      <input
        id="otpCode"
        class="otp-input"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="Enter 6-digit OTP"
      >

      <button id="verifyOtp" class="verify">
        Verify & Continue
      </button>

    </div>

    <div id="loginMessage" class="message"></div>

  </div>

</div>


<!-- MAIN APP -->

<div id="app" class="app">

  <header>
    <h1>MAJA</h1>
  </header>


  <!-- THREADS -->

  <section id="threads" class="page active">

    <div class="thread">

      <div class="user">
        <div class="avatar">A</div>

        <div>
          <b>Abdullahi</b>
          <small> · 2m</small>
        </div>
      </div>

      <p class="thread-text">
        Welcome to MAJA 👋
      </p>

      <div class="actions">
        <span>♡ Like</span>
        <span>💬 Reply</span>
        <span>↗ Share</span>
      </div>

    </div>

  </section>


  <!-- CHAT -->

  <section id="chat" class="page">

    <div class="chat">

      <div class="avatar">A</div>

      <div class="chat-info">
        <b>Abdullahi</b>
        <div class="last-message">
          Hello 👋
        </div>
      </div>

      <small>2m</small>

    </div>

  </section>


  <!-- PROFILE -->

  <section id="profile" class="page">

    <div class="profile">

      <div class="avatar">M</div>

      <h2>My Profile</h2>

      <p id="userPhone">Phone number</p>

    </div>

  </section>


  <!-- NAVIGATION -->

  <nav class="nav">

    <button id="threadsBtn" class="active"
      onclick="showPage('threads','threadsBtn')">

      <span class="icon">🧵</span>
      Threads

    </button>

    <button id="chatBtn"
      onclick="showPage('chat','chatBtn')">

      <span class="icon">💬</span>
      Chat

    </button>

    <button id="profileBtn"
      onclick="showPage('profile','profileBtn')">

      <span class="icon">👤</span>
      Profile

    </button>

  </nav>

</div>


<!-- FIREBASE -->

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    RecaptchaVerifier,
    signInWithPhoneNumber,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  const firebaseConfig = {

    apiKey: "AIzaSyAEWIrc0uCIHvJ_RHYW3l8UTumzYWeNo-w",

    authDomain: "maja-a6299.firebaseapp.com",

    projectId: "maja-a6299",

    storageBucket: "maja-a6299.firebasestorage.app",

    messagingSenderId: "217642905179",

    appId: "1:217642905179:web:683d1c3e8c6fab3356997e",

    measurementId: "G-SPCEJNFTLH"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);


  const loginPage = document.getElementById("loginPage");

  const mainApp = document.getElementById("app");

  const phoneInput = document.getElementById("phoneNumber");

  const sendOtp = document.getElementById("sendOtp");

  const otpArea = document.getElementById("otpArea");

  const otpInput = document.getElementById("otpCode");

  const verifyOtp = document.getElementById("verifyOtp");

  const message = document.getElementById("loginMessage");


  window.recaptchaVerifier = new RecaptchaVerifier(
    auth,
    "recaptcha-container",
    {
      size: "normal"
    }
  );


  sendOtp.addEventListener("click", async () => {

    const phone = phoneInput.value.trim();

    if (!phone) {

      message.textContent =
        "Enter your phone number with country code.";

      return;
    }


    sendOtp.disabled = true;

    message.textContent = "Sending OTP...";


    try {

      window.confirmationResult =
        await signInWithPhoneNumber(
          auth,
          phone,
          window.recaptchaVerifier
        );


      otpArea.style.display = "block";

      message.textContent =
        "OTP sent. Check your phone.";

    }

    catch (error) {

      console.error(error);

      message.textContent =
        error.message || "Could not send OTP.";

      sendOtp.disabled = false;

    }

  });


  verifyOtp.addEventListener("click", async () => {

    const otp = otpInput.value.trim();

    if (!otp) {

      message.textContent =
        "Enter the OTP.";

      return;
    }


    try {

      await window.confirmationResult.confirm(otp);

    }

    catch (error) {

      console.error(error);

      message.textContent =
        "Invalid OTP. Please try again.";

    }

  });


  onAuthStateChanged(auth, (user) => {

    if (user) {

      loginPage.style.display = "none";

      mainApp.style.display = "block";

      document.getElementById("userPhone").textContent =
        user.phoneNumber || "Phone number";

    }

  });


  window.showPage = function(page, button) {

    document.querySelectorAll(".page")
      .forEach(item =>
        item.classList.remove("active")
      );

    document.getElementById(page)
      .classList.add("active");


    document.querySelectorAll(".nav button")
      .forEach(item =>
        item.classList.remove("active")
      );

    document.getElementById(button)
      .classList.add("active");

  };

</script>

</body>
  </html>
