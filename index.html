<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAJA</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;font-family:Arial,sans-serif;color:#111}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

#login{
 min-height:100vh;background:white;display:flex;
 align-items:center;justify-content:center;padding:20px
}
.loginBox{width:100%;max-width:400px}
.logo{text-align:center;font-size:48px;font-weight:900;margin-bottom:5px}
.tag{text-align:center;color:#777;margin-bottom:25px}
input,textarea{
 width:100%;padding:13px;border:1px solid #ddd;
 border-radius:12px;outline:none;background:#fff;margin-bottom:10px
}
.mainBtn{
 background:#111;color:#fff;border-radius:12px;
 padding:13px 18px;font-weight:bold
}
.loginBox .mainBtn{width:100%}
.switch{width:100%;background:#fff;padding:14px;font-weight:bold}
.msg{text-align:center;color:#777;font-size:13px;margin:8px}

#app{
 display:none;max-width:680px;min-height:100vh;
 margin:auto;background:#fff;position:relative
}
.header{
 height:60px;position:sticky;top:0;z-index:20;
 display:flex;align-items:center;justify-content:center;
 background:#fff;border-bottom:1px solid #eee
}
.header b{font-size:27px}

.page{display:none;padding-bottom:90px}
.page.active{display:block}

/* THREADS */
.composer{padding:15px;border-bottom:1px solid #eee}
.tools{display:flex;align-items:center;gap:8px}
.tool{background:#eee;padding:10px 13px;border-radius:10px}
.postBtn{margin-left:auto}

.thread{padding:16px;border-bottom:1px solid #eee}
.user{display:flex;align-items:center;gap:10px}
.avatar,.avatarText{
 width:45px;height:45px;border-radius:50%;flex-shrink:0
}
.avatar{object-fit:cover;background:#ddd}
.avatarText{
 background:#111;color:#fff;display:flex;
 align-items:center;justify-content:center;font-weight:bold
}
.username{font-weight:bold}
.handle{font-size:12px;color:#888}
.threadText{margin:12px 0;white-space:pre-wrap;line-height:1.5}
.threadImg{
 width:100%;max-height:500px;object-fit:cover;border-radius:14px
}
.actions{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.action{background:transparent;color:#666;padding:5px 0}
.action.liked{color:#e11}
.action.reposted{color:#16833b}

.comments{display:none;margin-top:10px}
.comment{border-top:1px solid #eee;padding:10px 0}
.commentBox{display:flex;gap:7px}
.commentBox input{flex:1;margin:0}
.commentBox button{background:#111;color:#fff;border-radius:10px;padding:0 15px}

/* PROFILE */
.banner{
 height:210px;background:#ddd center/cover no-repeat
}
.profileBody{padding:60px 18px 20px;position:relative}
.profilePic,.profilePicText{
 width:105px;height:105px;border:4px solid white;
 border-radius:50%;position:absolute;top:-53px;left:18px
}
.profilePic{object-fit:cover;background:#ddd}
.profilePicText{
 background:#111;color:#fff;display:flex;
 align-items:center;justify-content:center;font-size:35px;font-weight:bold
}
.profileHead{display:flex;justify-content:space-between}
.settingsBtn{background:#eee;padding:10px;border-radius:10px}
.stats{display:flex;gap:40px;padding:20px 0;border-bottom:1px solid #eee}
.stat b,.stat span{display:block;text-align:center}
.stat span{font-size:12px;color:#777;margin-top:4px}
.settings{display:none;padding-top:20px}
.settings.open{display:block}
.label{display:block;font-weight:bold;font-size:13px;margin:12px 0 7px}
.file{display:inline-block;background:#eee;padding:11px 14px;border-radius:10px}
.logout{background:#eee;padding:12px 20px;border-radius:10px}

/* CHAT LIST */
.chatUser{
 display:flex;align-items:center;gap:12px;
 padding:15px;border-bottom:1px solid #eee
}
.chatInfo{flex:1}
.small{font-size:12px;color:#888}

/* CHAT */
.chatWindow{
 display:none;position:fixed;inset:0;max-width:680px;
 margin:auto;background:#fff;z-index:100;
 flex-direction:column
}
.chatWindow.open{display:flex}
.chatHeader{
 height:60px;min-height:60px;display:flex;
 align-items:center;gap:8px;border-bottom:1px solid #ddd;padding:7px
}
.back{background:transparent;font-size:32px;padding:5px 12px}
.messages{
 flex:1;overflow-y:auto;padding:15px;
}
.bubble{
 max-width:80%;width:max-content;background:#eee;
 border-radius:16px;padding:10px 13px;margin:7px 0;
 word-break:break-word
}
.bubble.mine{margin-left:auto;background:#111;color:#fff}
.messageImage{
 display:block;max-width:240px;max-height:300px;
 border-radius:12px;margin-top:5px
}
.sticker{font-size:70px;line-height:1}
.sendBox{
 min-height:64px;display:flex;align-items:center;
 gap:6px;padding:8px;border-top:1px solid #ddd;
 background:#fff
}
.sendBox input{flex:1;margin:0}
.sendBox button{
 height:44px;background:#111;color:#fff;
 border-radius:10px;padding:0 15px;font-weight:bold
}
.attach{
 width:44px;height:44px;background:#eee;
 border-radius:10px;font-size:22px;flex-shrink:0
}

/* STICKERS */
.stickerPanel{
 display:none;position:absolute;bottom:64px;left:8px;right:8px;
 background:#fff;border:1px solid #ddd;border-radius:15px;
 padding:12px;box-shadow:0 5px 25px #0002
}
.stickerPanel.open{display:block}
.stickers{
 display:grid;grid-template-columns:repeat(6,1fr);gap:8px
}
.stickerBtn{
 background:#f5f5f5;border-radius:10px;
 font-size:30px;padding:8px
}

/* NOTIFICATIONS */
.notificationPanel{
 display:none;position:fixed;top:65px;right:10px;
 width:min(370px,calc(100% - 20px));max-height:70vh;
 overflow-y:auto;background:#fff;border:1px solid #ddd;
 border-radius:15px;z-index:200;box-shadow:0 5px 30px #0002
}
.notificationPanel.open{display:block}
.notification{
 padding:13px;border-bottom:1px solid #eee;
 font-size:14px
}
.notification b{display:block}
.noticeEmpty{text-align:center;color:#888;padding:30px}

.bell{
 position:absolute;right:15px;background:transparent;
 font-size:23px
}
.badge{
 position:absolute;right:5px;top:3px;
 background:#e11;color:#fff;border-radius:20px;
 min-width:17px;height:17px;font-size:10px;
 display:flex;align-items:center;justify-content:center
}

/* EDITOR */
.editor{
 display:none;position:fixed;inset:0;background:#000d;
 z-index:300;align-items:center;justify-content:center;padding:15px
}
.editor.open{display:flex}
.editorBox{
 width:100%;max-width:650px;background:#111;
 border-radius:18px;padding:55px 12px 12px;
 position:relative
}
.closeEditor{
 position:absolute;right:10px;top:10px;
 width:42px;height:42px;border-radius:50%;
 background:#fff;font-size:25px;z-index:5
}
.editorTitle{position:absolute;top:22px;left:15px;color:#fff;font-weight:bold}
.editorImage{
 display:block;max-width:100%;max-height:65vh;
 margin:auto;border-radius:12px
}
.editorActions{display:flex;gap:8px;margin-top:12px}
.editorActions button{flex:1}

.nav{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:100%;max-width:680px;height:70px;
 display:flex;justify-content:space-around;align-items:center;
 background:#fff;border-top:1px solid #ddd;z-index:30
}
.nav button{background:transparent;color:#777;min-width:80px}
.nav button.active{color:#111;font-weight:bold}
.nav span{display:block;font-size:21px;margin-bottom:2px}
.empty{text-align:center;color:#888;padding:45px 20px}
</style>
</head>

<body>

<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 doc,
 setDoc,
 getDoc,
 addDoc,
 updateDoc,
 deleteDoc,
 query,
 orderBy,
 onSnapshot,
 serverTimestamp,
 increment
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={
 apiKey:"AIzaSyCAThpmkzHUaEgxafLjedZBoDdjfhaHjA4",
 authDomain:"maja-46a91.firebaseapp.com",
 projectId:"maja-46a91",
 storageBucket:"maja-46a91.firebasestorage.app",
 messagingSenderId:"1076643705312",
 appId:"1:1076643705312:web:1c10e9b5cfb0987a3ebb85"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let user=null;
let createMode=false;
let postImage="";
let chatUser=null;
let stopMessages=null;
let editorType="";


const $=id=>document.getElementById(id);

function escapeText(v){
 return String(v||"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#039;"
 }[c]));
}

function validUsername(v){
 return /^[A-Za-z0-9_]{3,20}$/.test(v);
}


/* IMAGE */

function imageToBase64(file,maxWidth=1000){

 return new Promise((resolve,reject)=>{

  const reader=new FileReader();

  reader.onload=()=>{

   const img=new Image();

   img.onload=()=>{

    const scale=Math.min(1,maxWidth/img.width);

    const canvas=document.createElement("canvas");

    canvas.width=img.width*scale;
    canvas.height=img.height*scale;

    canvas.getContext("2d")
     .drawImage(img,0,0,canvas.width,canvas.height);

    resolve(
     canvas.toDataURL("image/jpeg",.65)
    );
   };

   img.onerror=reject;
   img.src=reader.result;
  };

  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}


/* LOGIN */

$("switchBtn").onclick=()=>{

 createMode=!createMode;

 $("usernameArea")
  .classList.toggle("hidden",!createMode);

 $("authBtn").textContent=
  createMode?"Create Account":"Sign In";

 $("switchBtn").textContent=
  createMode
  ?"Already have an account? Sign In"
  :"Create a new account";

 $("authMsg").textContent="";
};


$("authBtn").onclick=async()=>{

 const email=$("email").value.trim();
 const password=$("password").value;
 const username=$("username").value.trim();

 if(!email||!password){
  $("authMsg").textContent="Fill all fields.";
  return;
 }

 if(password.length<6){
  $("authMsg").textContent="Password must be 6+ characters.";
  return;
 }

 if(createMode&&!validUsername(username)){
  $("authMsg").textContent=
   "Username: 3-20 letters/numbers/_";
  return;
 }

 $("authBtn").disabled=true;

 try{

  if(createMode){

   const result=
    await createUserWithEmailAndPassword(
     auth,email,password
    );

   await setDoc(
    doc(db,"users",result.user.uid),
    {
     username,
     email,
     photo:"",
     banner:"",
     createdAt:serverTimestamp()
    }
   );

  }else{

   await signInWithEmailAndPassword(
    auth,email,password
   );

  }

 }catch(error){

  $("authMsg").textContent=
   error.code+" — "+error.message;

 }

 $("authBtn").disabled=false;
};


onAuthStateChanged(auth,async current=>{

 user=current;

 if(!current){

  $("login").style.display="flex";
  $("app").style.display="none";
  return;
 }

 $("login").style.display="none";
 $("app").style.display="block";

 await ensureUser();
 await loadProfile();
 loadThreads();
 loadUsers();
 loadNotifications();
});


async function ensureUser(){

 const ref=doc(db,"users",user.uid);
 const snap=await getDoc(ref);

 if(!snap.exists()){

  await setDoc(ref,{
   username:"Maja_"+Math.floor(Math.random()*9000+1000),
   email:user.email||"",
   photo:"",
   banner:"",
   createdAt:serverTimestamp()
  });

 }
}


async function me(){

 const snap=await getDoc(
  doc(db,"users",user.uid)
 );

 return snap.data()||{};
}


/* NOTIFICATIONS */

async function notify(uid,type,text,threadId=""){

 if(!uid||uid===user.uid)return;

 try{

  await addDoc(
   collection(db,"notifications"),
   {
    userId:uid,
    fromId:user.uid,
    type,
    text,
    threadId,
    read:false,
    createdAt:serverTimestamp()
   }
  );

 }catch(error){
  console.error(error);
 }
}


function loadNotifications(){

 const q=query(
  collection(db,"notifications"),
  orderBy("createdAt","desc")
 );

 onSnapshot(q,snap=>{

  const list=[];

  snap.forEach(item=>{

   const d=item.data();

   if(d.userId===user.uid){

    list.push({
     id:item.id,
     ...d
    });

   }

  });

  const unread=list.filter(x=>!x.read).length;

  $("badge").textContent=unread;

  $("badge").classList.toggle(
   "hidden",unread===0
  );

  $("notifications").innerHTML="";

  if(!list.length){

   $("notifications").innerHTML=
    `<div class="noticeEmpty">
     No notifications
     </div>`;

   return;
  }

  list.forEach(n=>{

   const div=document.createElement("div");

   div.className="notification";

   div.innerHTML=
    `<b>🔔 MAJA</b>
     ${escapeText(n.text||"Notification")}`;

   $("notifications").appendChild(div);

  });

 });
}


$("bell").onclick=()=>{

 $("notificationPanel")
  .classList.toggle("open");

};


/* THREADS */

$("photoBtn").onclick=()=>{
 $("postFile").click();
};


$("postFile").onchange=async e=>{

 const file=e.target.files[0];

 if(!file)return;

 postImage=await imageToBase64(file,1000);

 $("postPreview").classList.remove("hidden");

 $("postPreview").innerHTML=
  `<img class="threadImg" src="${postImage}">`;

};


$("postBtn").onclick=async()=>{

 const text=$("postText").value.trim();

 if(!text&&!postImage){
  $("postMsg").textContent=
   "Write something or add a photo.";
  return;
 }

 $("postBtn").disabled=true;
 $("postMsg").textContent="Posting...";

 try{

  const m=await me();

  await addDoc(
   collection(db,"threads"),
   {
    text,
    image:postImage,
    username:m.username||"user",
    userId:user.uid,
    likes:0,
    reposts:0,
    createdAt:serverTimestamp()
   }
  );

  $("postText").value="";
  $("postFile").value="";
  postImage="";
  $("postPreview").innerHTML="";
  $("postPreview").classList.add("hidden");

  $("postMsg").textContent="Posted ✓";

 }catch(error){

  $("postMsg").textContent=
   error.code+" — "+error.message;

 }

 $("postBtn").disabled=false;
};


function loadThreads(){

 const q=query(
  collection(db,"threads"),
  orderBy("createdAt","desc")
 );

 onSnapshot(q,snap=>{

  $("threads").innerHTML="";

  snap.forEach(item=>{
   renderThread(item,$("threads"));
  });

  if(snap.empty){
   $("threads").innerHTML=
    `<div class="empty">No threads yet.</div>`;
  }

 },error=>{

  $("threads").innerHTML=
   `<div class="empty">
    ${escapeText(error.code)}
    <br>
    ${escapeText(error.message)}
    </div>`;

 });
}


function renderThread(snap,container){

 const d=snap.data();

 const article=document.createElement("article");

 article.className="thread";

 const initial=(d.username||"U")
  .charAt(0).toUpperCase();

 article.innerHTML=`

  <div class="user">

   <div class="avatarText">
    ${escapeText(initial)}
   </div>

   <div>
    <div class="username">
     @${escapeText(d.username||"user")}
    </div>

    <div class="handle">MAJA</div>
   </div>

  </div>

  ${
   d.text
   ?`<div class="threadText">
      ${escapeText(d.text)}
     </div>`
   :""
  }

  ${
   d.image
   ?`<img class="threadImg" src="${d.image}">`
   :""
  }

  <div class="actions">

   <button class="action like">
    ♡ Like (${d.likes||0})
   </button>

   <button class="action commentBtn">
    💬 Comment
   </button>

   <button class="action repost">
    🔁 Repost (${d.reposts||0})
   </button>

   ${
    d.userId===user.uid
    ?`<button class="action delete">🗑 Delete</button>`
    :""
   }

  </div>

  <div class="comments">

   <div class="commentList"></div>

   <div class="commentBox">

    <input placeholder="Write a comment...">

    <button>Send</button>

   </div>

  </div>
 `;


 /* LIKE */

 article.querySelector(".like").onclick=async()=>{

  await updateDoc(
   doc(db,"threads",snap.id),
   {likes:increment(1)}
  );

  await notify(
   d.userId,
   "like",
   "@"+(await me()).username+
   " liked your thread.",
   snap.id
  );

 };


 /* COMMENT */

 article.querySelector(".commentBtn").onclick=()=>{

  const box=article.querySelector(".comments");

  box.style.display=
   box.style.display==="block"
   ?"none"
   :"block";

  if(box.style.display==="block"){
   loadComments(
    snap.id,
    article.querySelector(".commentList")
   );
  }

 };


 const commentInput=
  article.querySelector(".commentBox input");

 const commentSend=
  article.querySelector(".commentBox button");


 commentSend.onclick=async()=>{

  const text=commentInput.value.trim();

  if(!text)return;

  commentSend.disabled=true;

  try{

   const m=await me();

   await addDoc(
    collection(
     db,
     "threads",
     snap.id,
     "comments"
    ),
    {
     text,
     username:m.username||"user",
     userId:user.uid,
     createdAt:serverTimestamp()
    }
   );

   await notify(
    d.userId,
    "comment",
    "@"+(m.username||"user")+
    " commented on your thread.",
    snap.id
   );

   commentInput.value="";

  }catch(error){

   console.error(error);

  }

  commentSend.disabled=false;
 };


 /* REPOST */

 article.querySelector(".repost").onclick=async()=>{

  const m=await me();

  await addDoc(
   collection(db,"threads"),
   {
    text:d.text||"",
    image:d.image||"",
    username:m.username||"user",
    userId:user.uid,
    repostOf:snap.id,
    repostedFrom:d.username||"user",
    likes:0,
    reposts:0,
    createdAt:serverTimestamp()
   }
  );

  await updateDoc(
   doc(db,"threads",snap.id),
   {reposts:increment(1)}
  );

  await notify(
   d.userId,
   "repost",
   "@"+(m.username||"user")+
   " reposted your thread.",
   snap.id
  );

 };


 /* DELETE */

 const del=article.querySelector(".delete");

 if(del){

  del.onclick=async()=>{

   if(!confirm("Delete this thread?"))return;

   await deleteDoc(
    doc(db,"threads",snap.id)
   );

  };

 }

 container.appendChild(article);
}


/* COMMENTS */

function loadComments(threadId,list){

 const q=query(
  collection(
   db,
   "threads",
   threadId,
   "comments"
  ),
  orderBy("createdAt","asc")
 );

 onSnapshot(q,snap=>{

  list.innerHTML="";

  snap.forEach(item=>{

   const d=item.data();

   const div=document.createElement("div");

   div.className="comment";

   div.innerHTML=
    `<b>@${escapeText(d.username||"user")}</b>
     ${escapeText(d.text||"")}`;

   list.appendChild(div);

  });

 });
}


/* CHAT USERS */

function loadUsers(){

 onSnapshot(
  collection(db,"users"),
  snap=>{

   $("users").innerHTML="";

   snap.forEach(item=>{

    if(item.id===user.uid)return;

    const d=item.data();
    const name=d.username||"user";

    const div=document.createElement("div");

    div.className="chatUser";

    div.innerHTML=`

     ${
      d.photo
      ?`<img class="avatar" src="${d.photo}">`
      :`<div class="avatarText">
        ${escapeText(
         name.charAt(0).toUpperCase()
        )}
       </div>`
     }

     <div class="chatInfo">
      <b>@${escapeText(name)}</b>
      <div class="small">Tap to chat</div>
     </div>
    `;

    div.onclick=()=>{
     openChat(item.id,name,d.photo||"");
    };

    $("users").appendChild(div);

   });

  }
 );
}


/* CHAT */

function chatId(a,b){
 return [a,b].sort().join("_");
}


function openChat(uid,name,photo){

 chatUser=uid;

 $("chatName").textContent="@"+name;

 $("chatAvatar").innerHTML=
  photo
  ?`<img class="avatar" src="${photo}">`
  :`<div class="avatarText">
     ${escapeText(name.charAt(0).toUpperCase())}
    </div>`;

 $("chatWindow").classList.add("open");

 loadMessages();
}


function loadMessages(){

 if(stopMessages)stopMessages();

 const id=chatId(user.uid,chatUser);

 const q=query(
  collection(db,"chats",id,"messages"),
  orderBy("createdAt","asc")
 );

 stopMessages=onSnapshot(q,snap=>{

  $("messages").innerHTML="";

  snap.forEach(item=>{

   const d=item.data();

   const div=document.createElement("div");

   div.className=
    "bubble "+
    (d.senderId===user.uid?"mine":"");

   if(d.type==="image"){

    div.innerHTML=
     `<img class="messageImage"
       src="${d.content}">
      ${
       d.text
       ?`<div>${escapeText(d.text)}</div>`
       :""
      }`;

   }else if(d.type==="sticker"){

    div.innerHTML=
     `<div class="sticker">
       ${escapeText(d.content)}
      </div>`;

   }else{

    div.textContent=d.text||"";

   }

   $("messages").appendChild(div);

  });

  requestAnimationFrame(()=>{
   $("messages").scrollTop=
    $("messages").scrollHeight;
  });

 });
}


/* SEND TEXT */

async function sendText(){

 const input=$("messageInput");
 const text=input.value.trim();

 if(!text||!chatUser)return;

 const id=chatId(user.uid,chatUser);
 const m=await me();

 await addDoc(
  collection(db,"chats",id,"messages"),
  {
   type:"text",
   text,
   senderId:user.uid,
   receiverId:chatUser,
   senderUsername:m.username||"user",
   createdAt:serverTimestamp()
  }
 );

 await notify(
  chatUser,
  "message",
  "@"+(m.username||"user")+
  " sent you a message."
 );

 input.value="";
 input.focus();
}


$("sendBtn").onclick=sendText;

$("messageInput").addEventListener(
 "keydown",e=>{
  if(e.key==="Enter"){
   e.preventDefault();
   sendText();
  }
 }
);


/* ATTACHMENT */

$("attachBtn").onclick=()=>{
 $("chatFile").click();
};


$("chatFile").onchange=async e=>{

 const file=e.target.files[0];

 if(!file||!chatUser)return;

  const image=
   await imageToBase64(file,900);

  const m=await me();

  await addDoc(
   collection(db,"chats",id,"messages"),
   {
    type:"image",
    content:image,
    text:"",
    senderId:user.uid,
    receiverId:chatUser,
    senderUsername:m.username||"user",
    createdAt:serverTimestamp()
   }
  );

  await notify(

   "@"+(m.username||"user")+
   " sent you a photo."
  );

 }catch(error){

   error.code+" — "+error.message
  );

};


/* STICKERS */

$("stickerBtn").onclick=()=>{
 $("stickerPanel").classList.toggle("open");
};


document.querySelectorAll(".stickerBtn")
.forEach(btn=>{

 btn.onclick=async()=>{

  if(!chatUser)return;

  const sticker=btn.textContent;
  const id=chatId(user.uid,chatUser);
  const m=await me();

  await addDoc(
   collection(db,"chats",id,"messages"),
   {
    type:"sticker",
    content:sticker,
    senderId:user.uid,
    receiverId:chatUser,
    senderUsername:m.username||"user",
    createdAt:serverTimestamp()
   }
  );

  await notify(
   chatUser,
   "message",
   "@"+(m.username||"user")+
   " sent you a sticker."
  );

  $("stickerPanel").classList.remove("open");
 };

});


/* BACK */

$("backChat").onclick=()=>{

 $("chatWindow").classList.remove("open");

 if(stopMessages){
  stopMessages();
  stopMessages=null;
 }

 chatUser=null;
};


/* PROFILE */

async function loadProfile(){

 const d=await me();

 $("profileName").textContent="@"+(d.username||"user");
 $("profileEmail").textContent=d.email||user.email||"";
 $("editUsername").value=d.username||"";

 if(d.banner){
  $("banner").style.backgroundImage=
   `url("${d.banner}")`;
 }

 if(d.photo){

  $("profilePicture").innerHTML=
   `<img class="profilePic" src="${d.photo}">`;

 }else{

  $("profilePicture").innerHTML=
   `<div class="profilePicText">
    ${(d.username||"U").charAt(0).toUpperCase()}
    </div>`;

 }
}


$("settingsBtn").onclick=()=>{
 $("settings").classList.toggle("open");
};


$("saveUsername").onclick=async()=>{

 const name=$("editUsername").value.trim();

 if(!validUsername(name)){
  $("profileMsg").textContent=
   "Invalid username.";
  return;
 }

 await setDoc(
  doc(db,"users",user.uid),
  {username:name},
  {merge:true}
 );

 await loadProfile();

 $("profileMsg").textContent=
  "Username saved ✓";
};


/* PROFILE/BANNER EDITOR */

function openEditor(file,type){

 editorType=type;

 const reader=new FileReader();

 reader.onload=()=>{
  $("editorImage").src=reader.result;

  $("editorTitle").textContent=
   type==="profile"
   ?"Edit Profile Picture"
   :"Edit Profile Banner";

  $("pictureEditor").classList.add("open");
 };

 reader.readAsDataURL(file);
}


$("profileFile").onchange=e=>{

 const file=e.target.files[0];

 if(file)openEditor(file,"profile");

};


$("bannerFile").onchange=e=>{

 const file=e.target.files[0];

 if(file)openEditor(file,"banner");

};


async function closeEditor(){
 $("pictureEditor").classList.remove("open");
 $("editorImage").src="";
}


$("closeEditor").onclick=closeEditor;
$("cancelEditor").onclick=closeEditor;


$("saveEditor").onclick=async()=>{

 const src=$("editorImage").src;

 if(!src)return;

 $("saveEditor").disabled=true;
 $("saveEditor").textContent="Saving...";

 try{

  const blob=
   await (await fetch(src)).blob();

  const file=
   new File([blob],"image.jpg",
   {type:"image/jpeg"});

  const image=
   await imageToBase64(
    file,
    editorType==="profile"?600:1200
   );

  await setDoc(
   doc(db,"users",user.uid),
   editorType==="profile"
   ?{photo:image}
   :{banner:image},
   {merge:true}
  );

  await loadProfile();

  $("profileMsg").textContent=
   editorType==="profile"
   ?"Profile picture updated ✓"
   :"Banner updated ✓";

  closeEditor();

 }catch(error){

  $("profileMsg").textContent=
   error.code+" — "+error.message;

 }

 $("saveEditor").disabled=false;
 $("saveEditor").textContent="Save";
};


/* LOGOUT */

$("logout").onclick=async()=>{
 await signOut(auth);
};


/* NAVIGATION */

function showPage(page,nav){

 document.querySelectorAll(".page")
  .forEach(x=>x.classList.remove("active"));

 $(page).classList.add("active");

 document.querySelectorAll(".nav button")
  .forEach(x=>x.classList.remove("active"));

 $(nav).classList.add("active");
}


$("threadsNav").onclick=()=>{
 showPage("threadsPage","threadsNav");
};

$("chatNav").onclick=()=>{
 showPage("chatPage","chatNav");
};

$("profileNav").onclick=async()=>{
 showPage("profilePage","profileNav");
 await loadProfile();
};

</script>
