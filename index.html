<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>MAJA</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#111;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#fff;
}

.loginBox{
  width:100%;
  max-width:390px;
}

.logo{
  text-align:center;
  font-size:52px;
  font-weight:900;
  letter-spacing:-3px;
  margin-bottom:5px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:28px;
}

.input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:14px;
  outline:none;
  margin-bottom:10px;
  background:#fff;
}

.input:focus,
textarea:focus,
select:focus{
  border-color:#111;
}

.primary{
  width:100%;
  padding:14px;
  border:0;
  border-radius:14px;
  background:#111;
  color:#fff;
  font-weight:bold;
}

.secondary{
  width:100%;
  padding:14px;
  border:0;
  background:transparent;
  color:#111;
  font-weight:bold;
}

.authMessage{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:12px;
}

/* =========================
   APP
========================= */

#app{
  display:none;
  max-width:680px;
  margin:auto;
  min-height:100vh;
  background:#fff;
}

.appHeader{
  position:sticky;
  top:0;
  z-index:50;
  height:60px;
  background:#fff;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:center;
}

.appLogo{
  font-size:25px;
  font-weight:900;
}

.notificationButton{
  position:absolute;
  right:12px;
  border:0;
  background:transparent;
  font-size:22px;
}

.notificationBadge{
  position:absolute;
  top:-3px;
  right:-4px;
  min-width:18px;
  height:18px;
  padding:2px 5px;
  background:red;
  color:white;
  border-radius:20px;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   PAGES
========================= */

.page{
  display:none;
  padding-bottom:85px;
}

.page.active{
  display:block;
}

/* =========================
   BOTTOM NAV
========================= */

.bottomNav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);

  max-width:680px;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;

  align-items:center;

}

.navButton{

  background:transparent;
  color:#777;
  min-width:65px;
  padding:6px;
}

.navButton.active{
  color:#111;
  font-weight:bold;
}

.navIcon{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

/* =========================
   COMPOSER
========================= */

.composer{
  padding:15px;
  border-bottom:1px solid #eee;
}

.composer textarea{
  width:100%;
  min-height:90px;
  resize:none;
  border:1px solid #ddd;
  border-radius:14px;
  padding:13px;
  outline:none;
}

.composerBottom{
  display:flex;

.attachButton{

.postButton{

/* =========================

========================= */

/* =========================

========================= */

.empty{
  padding:45px 20px;
  text-align:center;
  color:#888;
}
</style>

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  doc,
  getDoc,
  setDoc,
  onSnapshot,
  query,
  orderBy,
  addDoc,
  updateDoc,
  deleteDoc,
  increment,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
  getStorage
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyCAThpmkzHUaEgxafLjedZBoDdjfhaA4",

  authDomain:
  "maja-46a91.firebaseapp.com",

  projectId:
  "maja-46a91",

  storageBucket:
  "maja-46a91.firebasestorage.app",

  messagingSenderId:
  "1076643705312",

  appId:
  "1:1076643705312:web:1c10e9b5cfb0987a3ebb85"

};


const firebaseApp =
initializeApp(firebaseConfig);


const auth =
getAuth(firebaseApp);


const db =
getFirestore(firebaseApp);


const storage =
getStorage(firebaseApp);


/* =========================
   GLOBALS
========================= */

let currentUser = null;

let signupMode = false;


/* =========================
   HELPERS
========================= */

const $ = id =>
document.getElementById(id);


function validUsername(name){

  return /^[A-Za-z0-9_]{3,20}$/.test(name);

}


async function getMyUser(){

  if(!currentUser){
    return {};
  }

  const snap =
  await getDoc(
    doc(
      db,
      "users",
      currentUser.uid
    )
  );

  return snap.exists()
  ? snap.data()
  : {};

}


function escapeHTML(value){

  return String(value || "")
  .replace(/[&<>"']/g, char => ({

    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"

  }[char]));

}


/* =========================
   AUTH MODE
========================= */

$("switchAuth").onclick = () => {

  signupMode =
  !signupMode;


  $("signupFields")
  .classList
  .toggle(
    "hidden",
    !signupMode
  );


  $("authButton").textContent =
  signupMode
  ? "Create Account"
  : "Sign In";


  $("switchAuth").textContent =
  signupMode
  ? "Already have an account? Sign In"
  : "Create a new account";


  $("authMessage").textContent = "";

};


/* =========================
   AUTH
========================= */

$("authButton").onclick =
async () => {

  const email =
  $("email").value.trim();

  const password =
  $("password").value;

  const username =
  $("signupUsername").value.trim();

  const gender =
  $("signupGender").value;


  if(!email || !password){

    $("authMessage").textContent =
    "Enter your email and password.";

    return;

  }


  if(password.length < 6){

    $("authMessage").textContent =
    "Password must contain at least 6 characters.";

    return;

  }


  if(signupMode){

    if(!validUsername(username)){

      $("authMessage").textContent =
      "Username must be 3-20 characters.";

      return;

    }


    if(!gender){

      $("authMessage").textContent =
      "Select gender.";

      return;

    }

  }


  $("authButton").disabled = true;


  try{

    if(signupMode){

      const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


      await setDoc(
        doc(
          db,
          "users",
          result.user.uid
        ),
        {

          username,
          email,
          gender,

          photo:"",
          banner:"",

          online:true,

          followersCount:0,
          followingCount:0,

          createdAt:
          serverTimestamp(),

          lastSeen:
          serverTimestamp()

        }
      );

    }else{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }

  }catch(error){

    $("authMessage").textContent =
    error.message;

  }


  $("authButton").disabled = false;

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async user => {

    currentUser = user;


    if(!user){

      $("loginPage").style.display =
      "flex";

      $("app").style.display =
      "none";

      return;

    }


    $("loginPage").style.display =
    "none";

    $("app").style.display =
    "block";


    await ensureUser();


    await setOnline(true);


    loadProfile();

    loadThreads();

    loadMoments();

    loadChatUsers();

    loadNotifications();

  }
);


/* =========================
   ENSURE USER
========================= */

async function ensureUser(){

  const userRef =
  doc(
    db,
    "users",
    currentUser.uid
  );


  const snap =

function loadThreads(){

  const q =
  query(
    collection(
      db,
      "threads"
    ),
    orderBy(
      "createdAt",
      "desc"
    )
  );


  onSnapshot(
    q,
    snapshot => {

      $("threadsList").innerHTML = "";


      snapshot.forEach(
        item => {

          const data =
          item.data();


          const article =
          document.createElement(
            "article"
          );


          article.className =
          "thread";


          const initial =
          (data.username || "U")
          .charAt(0)
          .toUpperCase();


          article.innerHTML = `

            <div class="threadHeader">

              <div class="avatarLetter">
                ${escapeHTML(initial)}
              </div>

              <div>

                <div class="threadName">
                  @${escapeHTML(
                    data.username || "user"
                  )}
                </div>

                <div class="threadHandle">
                  MAJA
                </div>

              </div>

            </div>

            <div class="threadContent">
              ${escapeHTML(
                data.text || ""
              )}
            </div>

            <div class="threadActions">

              <button class="actionButton likeButton">
                ♡ ${data.likes || 0}
              </button>

              <button class="actionButton commentButton">
                💬 Comment
              </button>

              <button class="actionButton repostButton">
                🔁 ${data.reposts || 0}
              </button>

            </div>

          `;


          const likeButton =
          article.querySelector(
            ".likeButton"
          );


          const likeId =
          currentUser.uid +
          "_" +
          item.id;


          getDoc(
            doc(
              db,
              "likes",
              likeId
            )
          ).then(
            likeSnap => {

              if(likeSnap.exists()){

                likeButton
                .classList
                .add("liked");

              }

            }
          );


          likeButton.onclick =
          async () => {

            if(
              likeButton.dataset.busy ===
              "true"
            ){

              return;

            }


            likeButton.dataset.busy =
            "true";


            try{

              const likeRef =
              doc(
                db,
                "likes",
                likeId
              );


              const exists =
              await getDoc(
                likeRef
              );


              if(exists.exists()){

                await deleteDoc(
                  likeRef
                );


                await updateDoc(
                  doc(
                    db,
                    "threads",
                    item.id
                  ),
                  {
                    likes:
                    increment(-1)
                  }
                );


                likeButton
                .classList
                .remove("liked");

              }else{

                await setDoc(
                  likeRef,
                  {

                    userId:
                    currentUser.uid,

                    threadId:
                    item.id,

                    createdAt:
                    serverTimestamp()

                  }
                );


                await updateDoc(
                  doc(
                    db,
                    "threads",
                    item.id
                  ),
                  {
                    likes:
                    increment(1)
                  }
                );


                likeButton
                .classList
                .add("liked");

              }

            }catch(error){

              alert(error.message);

            }


            likeButton.dataset.busy =
            "false";

          };


          const repostButton =
          article.querySelector(
            ".repostButton"
          );


          const repostId =
          currentUser.uid +
          "_" +
          item.id;


          getDoc(
            doc(
              db,
              "reposts",
              repostId
            )
          ).then(
            repostSnap => {

              if(repostSnap.exists()){

                repostButton
                .classList
                .add("reposted");

              }

            }
          );


          repostButton.onclick =
          async () => {

            if(
              repostButton.dataset.busy ===
              "true"
            ){

              return;

            }


            repostButton.dataset.busy =
            "true";


            try{

              const repostRef =
              doc(
                db,
                "reposts",
                repostId
              );


              const exists =
              await getDoc(
                repostRef
              );


              if(exists.exists()){

                await deleteDoc(
                  repostRef
                );


                await updateDoc(
                  doc(
                    db,
                    "threads",
                    item.id
                  ),
                  {
                    reposts:
                    increment(-1)
                  }
                );


                repostButton
                .classList
                .remove(
                  "reposted"
                );

              }else{

                await setDoc(
                  repostRef,
                  {

                    userId:
                    currentUser.uid,

                    threadId:
                    item.id,

                    createdAt:
                    serverTimestamp()

                  }
                );


                await updateDoc(
                  doc(
                    db,
                    "threads",
                    item.id
                  ),
                  {
                    reposts:
                    increment(1)
                  }
                );


                repostButton
                .classList
                .add(
                  "reposted"
                );

              }

            }catch(error){

              alert(error.message);

            }


            repostButton.dataset.busy =
            "false";

          };


          article
          .querySelector(
            ".commentButton"
          )
          .onclick =
          async () => {

            const comment =
            prompt(
              "Write your comment:"
            );


            if(
              !comment ||
              !comment.trim()
            ){

              return;

            }


            const me =
            await getMyUser();


            await addDoc(
              collection(
                db,
                "threads",
                item.id,
                "comments"
              ),
              {

                userId:
                currentUser.uid,

                username:
                me.username || "user",

                text:
                comment.trim(),

                createdAt:
                serverTimestamp()

              }
            );

          };


          $("threadsList")
          .appendChild(
            article
          );

        }
      );

    }
  );

}

async function loadProfile(){

    return;
  }


  const me =
  await getMyUser();


  const username =
  me.username || "user";


  $("profileUsername")
  .textContent =
  "@" + username;


  $("profileGender")
  .textContent =
  me.gender || "Not selected";


  $("followersCount")
  .textContent =
  me.followersCount || 0;


  $("followingCount")
  .textContent =
  me.followingCount || 0;


  $("profileStatus")
  .innerHTML =
  me.online
  ? `<span class="online">💚 Online</span>`
  : `<span class="offline">♥️ Offline</span>`;


  if(me.banner){

    $("profileBanner")
    .style.backgroundImage =
    `url("${me.banner}")`;

  }else{

    $("profileBanner")
    .style.backgroundImage =
    "";

  }


  if(me.photo){

    $("profileAvatarContainer")
    .innerHTML = `

      <img
        class="profileAvatar"
        src="${me.photo}"
        alt="Profile">

    `;

  }else{

    $("profileAvatarContainer")
    .innerHTML = `

      <div class="profileLetter">
        ${escapeHTML(
          username
          .charAt(0)
          .toUpperCase()
        )}
      </div>

    `;

  }

}

/* =========================
   NOTIFICATIONS
========================= */

function loadNotifications(){

  const q =
  query(
    collection(
      db,
      "notifications"
    ),
    orderBy(
      "createdAt",
      "desc"
    )
  );


  onSnapshot(
    q,
    snapshot => {

      $("notificationList")
      .innerHTML = "";


      let unread = 0;


      snapshot.forEach(
        item => {

          const data =
          item.data();


          if(
            data.userId !==
            currentUser.uid
          ){

            return;

          }


          if(!data.read){

            unread++;

          }


          const div =
          document.createElement(
            "div"
          );


          div.className =
          "notification " +
          (
            !data.read
            ? "unread"
            : ""
          );


          div.textContent =
          data.text || "Notification";


          $("notificationList")
          .appendChild(div);

        }
      );


      $("notificationBadge")
      .textContent =
      unread;


      $("notificationBadge")
      .classList
      .toggle(
        "hidden",
        unread === 0
      );

    }
  );

}
