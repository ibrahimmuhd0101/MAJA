<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  background:white;
}

header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  background:white;
  z-index:5;
}

.logo{
  font-size:27px;
  font-weight:800;
}

.page{
  display:none;
  padding-bottom:90px;
}

.page.active{
  display:block;
}

.thread{
  padding:20px;
  border-bottom:1px solid #eee;
}

.user{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.thread-text{
  margin:14px 0;
  line-height:1.5;
}

.actions{
  display:flex;
  gap:25px;
  color:#666;
}

.chat{
  display:flex;
  align-items:center;
  gap:12px;
  padding:18px;
  border-bottom:1px solid #eee;
}

.chat-info{
  flex:1;
}

.last{
  color:#888;
  margin-top:5px;
  font-size:14px;
}

.profile{
  text-align:center;
  padding:40px 20px;
}

.profile .avatar{
  width:90px;
  height:90px;
  margin:auto;
  font-size:30px;
}

.profile h2{
  margin-top:15px;
}

.profile p{
  color:#777;
  margin-top:7px;
}

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:600px;
  height:72px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav button{
  border:0;
  background:none;
  color:#777;
  font-size:13px;
  cursor:pointer;
}

.nav button.active{
  color:#111;
  font-weight:bold;
}

.icon{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}
</style>
</head>

<body>

</section>


<!-- NAVIGATION -->

<nav class="nav">

  <button id="threadsBtn" class="active" onclick="showPage('threads','threadsBtn')">
    <span class="icon">🧵</span>
    Threads
  </button>

  <button id="chatBtn" onclick="showPage('chat','chatBtn')">
    <span class="icon">💬</span>
    Chat
  </button>

  <button id="profileBtn" onclick="showPage('profile','profileBtn')">
    <span class="icon">👤</span>
    Profile
  </button>

</nav>

</div>


<script>

function showPage(page, button){

  document.querySelectorAll('.page').forEach(function(item){
    item.classList.remove('active');
  });

  document.getElementById(page).classList.add('active');

  document.querySelectorAll('.nav button').forEach(function(item){
    item.classList.remove('active');
  });

  document.getElementById(button).classList.add('active');
}

</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import {
    getAuth,
    RecaptchaVerifier,
    signInWithPhoneNumber
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAEWIrc0uCIHvJ_RHYW3l8UTumzYWeNo-w",
    authDomain: "maja-a6299.firebaseapp.com",
    projectId: "maja-a6299",
    storageBucket: "maja-a6299.firebasestorage.app",
    messagingSenderId: "217642905179",
    appId: "1:217642905179:web:683d1c3e8c6fab3356997e",
    measurementId: "G-SPCEJNFTLH"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.recaptchaVerifier = new RecaptchaVerifier(
    auth,
    "recaptcha-container",
    {
      size: "normal"
    }
  );
>
  const sendOtpButton = document.getElementById("sendOtp");
const verifyOtpButton = document.getElementById("verifyOtp");

sendOtpButton.addEventListener("click", async () => {
  const phoneNumber = document.getElementById("phoneNumber").value.trim();
  const message = document.getElementById("loginMessage");

  if (!phoneNumber) {
    message.textContent = "Please enter your phone number.";
    return;
  }

  try {
    window.confirmationResult = await signInWithPhoneNumber(
      auth,
      phoneNumber,
      window.recaptchaVerifier
    );

    document.getElementById("otpArea").style.display = "block";
    message.textContent = "OTP sent. Check your phone.";
  } catch (error) {
    console.error(error);
    message.textContent = "Could not send OTP. Check the number and try again.";
  }
});

verifyOtpButton.addEventListener("click", async () => {
  const otp = document.getElementById("otpCode").value.trim();
  const message = document.getElementById("loginMessage");

  if (!otp) {
    message.textContent = "Enter the OTP.";
    return;
  }

  try {
    await window.confirmationResult.confirm(otp);

    document.getElementById("loginPage").style.display = "none";
    document.querySelector(".app").style.display = "block";

    message.textContent = "";
  } catch (error) {
    console.error(error);
    message.textContent = "Invalid OTP. Please try again.";
  }
});
</script
