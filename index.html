<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJA</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#111;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
#login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.loginBox{
  width:100%;
  max-width:390px;
}
.logo{
  text-align:center;
  font-size:55px;
  font-weight:900;
  letter-spacing:-4px;
}
.tagline{
  text-align:center;
  color:#777;
  margin:5px 0 30px;
}
.input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:14px;
  margin-bottom:10px;
  outline:none;
}
.mainBtn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:14px;
  background:#111;
  color:#fff;
  font-weight:bold;
}
.switchBtn{
  width:100%;
  padding:14px;
  border:0;
  background:white;
  font-weight:bold;
}
.msg{
  text-align:center;
  color:#d00;
  font-size:13px;
  margin-top:10px;
}

/* APP */
#app{
  display:none;
  max-width:680px;
  margin:auto;
  min-height:100vh;
}
.header{
  height:60px;
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:center;
}
.headerLogo{
  font-size:25px;
  font-weight:900;
}
.bell{
  position:absolute;
  right:12px;
  border:0;
  background:none;
  font-size:22px;
}
.badge{
  position:absolute;
  top:-3px;
  right:-4px;
  background:red;
  color:#fff;
  border-radius:20px;
  min-width:18px;
  height:18px;
  font-size:10px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.page{
  display:none;
  padding-bottom:85px;
}
.page.active{display:block}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:680px;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;
  z-index:100;
  display:flex;
  justify-content:space-around;
  align-items:center;
}
.nav button{
  border:0;
  background:none;
  color:#777;
  font-size:12px;
}
.nav button.active{
  color:#111;
  font-weight:bold;
}
.navIcon{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

/* COMPOSER */
.composer{
  padding:15px;
  border-bottom:1px solid #eee;
}
.composer textarea{
  width:100%;
  min-height:90px;
  resize:none;
  border:1px solid #ddd;
  border-radius:15px;
  padding:13px;
  outline:none;
}
.composeRow{
  display:flex;
  align-items:center;
  margin-top:8px;
}
.attach{
  border:0;
  background:none;
  font-size:23px;
}
.post{
  margin-left:auto;
  background:#111;
  color:#fff;
  border:0;
  border-radius:20px;
  padding:10px 19px;
  font-weight:bold;
}

/* THREAD */
.thread{
  padding:15px;
  border-bottom:1px solid #eee;
}
.threadHead{
  display:flex;
  align-items:center;
  gap:10px;
}
.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
}
.letter{
  width:46px;
  height:46px;
  border-radius:50%;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}
.name{font-weight:bold}
.handle{font-size:12px;color:#777}
.threadText{
  margin:12px 0;
  line-height:1.5;
  white-space:pre-wrap;
}
.threadImage{
  width:100%;
  max-height:500px;
  object-fit:cover;
  border-radius:14px;
  margin-bottom:10px;
}
.actions{
  display:flex;
  justify-content:space-between;
  max-width:520px;
}
.action{
  border:0;
  background:none;
  color:#666;
}
.action.liked{color:red}
.action.reposted{color:#159447}

/* PROFILE */
.profileHeader{
  height:60px;
  display:flex;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:0 12px;
}
.back{
  border:0;
  background:none;
  font-size:28px;
}
.profileHeader strong{
  margin-left:10px;
  font-size:19px;
}
.banner{
  height:210px;
  background:#ddd center/cover no-repeat;
  position:relative;
}
.bannerCamera{
  position:absolute;
  right:15px;
  bottom:15px;
  width:45px;
  height:45px;
  border-radius:50%;
  background:#000b;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:20px;
}
.profileBody{
  position:relative;
  padding:65px 16px 100px;
}
.avatarBox{
  position:absolute;
  top:-55px;
  left:16px;
}
.bigAvatar{
  width:108px;
  height:108px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid white;
  background:#ddd;
}
.bigLetter{
  width:108px;
  height:108px;
  border-radius:50%;
  border:4px solid white;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:bold;
}
.avatarCamera{
  position:absolute;
  right:0;
  bottom:0;
  width:34px;
  height:34px;
  border-radius:50%;
  border:3px solid white;
  background:#111;
  color:white;
}
.edit{
  float:right;
  border:1px solid #aaa;
  background:#fff;
  border-radius:22px;
  padding:9px 17px;
  font-weight:bold;
}
.status{
  clear:both;
  padding-top:15px;
  font-size:14px;
  font-weight:bold;
}
.online{color:#159447}
.offline{color:#d00}
.profileName{
  font-size:23px;
  font-weight:800;
  margin-top:7px;
}
.stats{
  display:flex;
  gap:35px;
  margin-top:22px;
}
.stat strong{
  font-size:18px;
}
.stat span{
  display:block;
  color:#777;
  font-size:13px;
}
.gender{
  margin-top:20px;
  padding-bottom:15px;
  border-bottom:1px solid #eee;
}
.gender span{
  color:#777;
  margin-left:8px;
}
.profileItem{
  width:100%;
  border:0;
  border-bottom:1px solid #eee;
  background:#fff;
  text-align:left;
  padding:18px 0;
  font-weight:bold;
}

/* WINDOWS */
.window{
  position:fixed;
  inset:0;
  max-width:680px;
  margin:auto;
  background:#fff;
  z-index:300;
  display:none;
  overflow:auto;
}
.window.open{display:block}
.windowHead{
  height:60px;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  padding:0 12px;
}
.windowHead button{
  border:0;
  background:none;
  font-size:28px;
}
.windowHead strong{
  margin-left:10px;
}

/* NOTIFICATION */
.notificationPanel{
  position:fixed;
  top:65px;
  right:10px;
  width:min(390px,calc(100% - 20px));
  max-height:70vh;
  overflow:auto;
  background:#fff;
  border:1px solid #ddd;
  border-radius:16px;
  box-shadow:0 8px 30px #0002;
  z-index:200;
  display:none;
}
.notificationPanel.open{display:block}
.notification{
  padding:14px;
  border-bottom:1px solid #eee;
}
.notification.unread{
  background:#f3f3f3;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal.open{display:flex}
.modalBox{
  width:100%;
  max-width:500px;
  background:white;
  border-radius:18px;
  padding:18px;
}
.modalTop{
  display:flex;
  align-items:center;
  margin-bottom:20px;
}
.modalTop strong{
  flex:1;
  font-size:19px;
}
.close{
  border:0;
  background:none;
  font-size:22px;
}
.label{
  font-size:13px;
  font-weight:bold;
  display:block;
  margin:10px 0 6px;
}
.empty{
  text-align:center;
  padding:45px 20px;
  color:#888;
}

/* STICKERS */
.stickerGrid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
  margin-top:10px;
}
.sticker{
  border:0;
  background:#f3f3f3;
  border-radius:10px;
  padding:9px;
  font-size:24px;
}
.chatBox{
  padding:15px;
}
.chatMessages{
  min-height:55vh;
  padding-bottom:15px;
}
.message{
  max-width:80%;
  padding:10px 13px;
  border-radius:17px;
  margin:7px 0;
  background:#eee;
}
.message.mine{
  margin-left:auto;
  background:#111;
  color:white;
}
.chatComposer{
  position:sticky;
  bottom:70px;
  background:white;
  border-top:1px solid #eee;
  padding:10px;
  display:flex;
  gap:7px;
}
.chatComposer input{
  flex:1;
  border:1px solid #ddd;
  border-radius:20px;
  padding:10px 13px;
}
.chatSend{
  border:0;
  background:#111;
  color:white;
  border-radius:50%;
  width:42px;
  height:42px;
}
</style>
</head>

<body>

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  doc,
  getDoc,
  setDoc,
  addDoc,
  updateDoc,
  deleteDoc,
  increment,
  serverTimestamp,
  query,
  orderBy,
  onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyCAThpmzHUaEgxafLjedZBoDdjfhaHjA4",

  authDomain:
  "maja-46a91.firebaseapp.com",

  projectId:
  "maja-46a91",

  storageBucket:
  "maja-46a91.firebasestorage.app",

  messagingSenderId:
  "1076643705312",

  appId:
  "1:1076643705312:web:1c10e9b5cfb0987a3ebb85"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

const storage =
getStorage(app);


let currentUser = null;
let signupMode = false;
let activeChatUser = null;


/* =========================
   HELPERS
========================= */

const $ =
id => document.getElementById(id);


function escapeHTML(value){

  return String(value || "")
  .replace(/[&<>"']/g,c => ({

    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"

  }[c]));

}


function usernameOK(name){

  return /^[A-Za-z0-9_]{3,20}$/
  .test(name);

}


/* =========================
   LOGIN MODE
========================= */

$("switchBtn").onclick =
() => {

  signupMode =
  !signupMode;

  $("signupFields")
  .classList
  .toggle(
    "hidden",
    !signupMode
  );

  $("authBtn").textContent =
  signupMode
  ? "Create Account"
  : "Sign In";

  $("switchBtn").textContent =
  signupMode
  ? "Already have an account? Sign In"
  : "Create a new account";

};


/* =========================
   AUTH
========================= */

$("authBtn").onclick =
async () => {

  const email =
  $("email").value.trim();

  const password =
  $("password").value;

  const username =
  $("username").value.trim();

  const gender =
  $("gender").value;


  if(!email || !password){

    $("authMsg").textContent =
    "Enter email and password.";

    return;

  }


  try{

    if(signupMode){

      if(!usernameOK(username)){

        $("authMsg").textContent =
        "Username must be 3-20 characters.";

        return;

      }


      if(!gender){

        $("authMsg").textContent =
        "Select gender.";

        return;

      }


      const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


      await setDoc(
        doc(
          db,
          "users",
          result.user.uid
        ),
        {

          username,
          email,
          gender,

          photo:"",
          banner:"",

          online:true,

          followersCount:0,
          followingCount:0,

          createdAt:
          serverTimestamp(),

          lastSeen:
          serverTimestamp()

        }
      );

    }else{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }

  }catch(error){

    $("authMsg").textContent =
    error.message;

  }

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async user => {

    currentUser =
    user;


    if(!user){

      $("login").style.display =
      "flex";

      $("app").style.display =
      "none";

      return;

    }


    $("login").style.display =
    "none";

    $("app").style.display =
    "block";


    await ensureUser();

    await updateOnline(true);

    loadProfile();

    loadThreads();

    loadMoments();

    loadUsers();

    loadNotifications();

  }
);

  const snap =
  await getDoc(refUser);


  if(!snap.exists()){

    await setDoc(
      refUser,
      {

        username:
        "Maja_" +
        Math.floor(
          Math.random()*9000+1000
        ),

        email:
        currentUser.email || "",

        gender:"",

        photo:"",
        banner:"",

        online:true,

        followersCount:0,
        followingCount:0,

        createdAt:
        serverTimestamp(),

        lastSeen:
        serverTimestamp()

      }
    );

  }

}

/* =========================
   IMAGE UPLOAD
========================= */

async function uploadImage(
  file,
  folder
){

  if(!file)return "";

  const path =
  folder +
  "/" +
  currentUser.uid +
  "_" +
  Date.now() +
  "_" +
  file.name;

  const imageRef =
  ref(
    storage,
    path
  );


  await uploadBytes(
    imageRef,
    file
  );


  return await getDownloadURL(
    imageRef
  );

}

/* =========================
   LOAD THREADS
========================= */

function loadThreads(){

  const q =
  query(
    collection(
      db,
      "threads"
    ),
    orderBy(
      "createdAt",
      "desc"
    )
  );


  onSnapshot(
    q,
    snapshot => {

      $("threadList")
      .innerHTML = "";


      snapshot.forEach(
        item => {

          const data =
          item.data();


          const initial =
          (
            data.username ||
            "U"
          )
          .charAt(0)
          .toUpperCase();


          const div =
          document.createElement(
            "article"
          );


          div.className =
          "thread";


          div.innerHTML = `

            <div class="threadHead">

              <div class="letter">
                ${escapeHTML(initial)}
              </div>

              <div>

                <div class="name">
                  @${escapeHTML(
                    data.username ||
                    "user"
                  )}
                </div>

                <div class="handle">
                  MAJA
                </div>

              </div>

            </div>

            ${
              data.text
              ?
              `<div class="threadText">
                ${escapeHTML(data.text)}
              </div>`
              :
              ""
            }

            ${
              data.image
              ?
              `<img
                class="threadImage"
                src="${data.image}">
              `
              :
              ""
            }

            <div class="actions">

              <button
                class="action like">
                ♡ ${data.likes || 0}
              </button>

              <button
                class="action comment">
                💬
              </button>

              <button
                class="action repost">
                🔁 ${data.reposts || 0}
              </button>

            </div>

          `;


          const like =
          div.querySelector(
            ".like"
          );


          const likeId =
          currentUser.uid +
          "_" +
          item.id;


          getDoc(
            doc(
              db,
              "likes",
              likeId
            )
          ).then(
            snap => {

              if(snap.exists()){

                like.classList
                .add("liked");

              }

            }
          );


          like.onclick =
          async () => {

            if(
              like.dataset.busy
            )return;


            like.dataset.busy =
            "1";


            const likeRef =
            doc(
              db,
              "likes",
              likeId
            );


            const exists =
            await getDoc(
              likeRef
            );


            if(exists.exists()){

              await deleteDoc(
                likeRef
              );


              await updateDoc(
                doc(
                  db,
                  "threads",
                  item.id
                ),
                {
                  likes:
                  increment(-1)
                }
              );


              like.classList
              .remove("liked");

            }else{

              await setDoc(
                likeRef,
                {

                  userId:
                  currentUser.uid,

                  threadId:
                  item.id,

                  createdAt:
                  serverTimestamp()

                }
              );


              await updateDoc(
                doc(
                  db,
                  "threads",
                  item.id
                ),
                {
                  likes:
                  increment(1)
                }
              );


              like.classList
              .add("liked");

            }


            like.dataset.busy =
            "";

          };


          const repost =
          div.querySelector(
            ".repost"
          );


          const repostId =
          currentUser.uid +
          "_" +
          item.id;


          getDoc(
            doc(
              db,
              "reposts",
              repostId
            )
          ).then(
            snap => {

              if(snap.exists()){

                repost.classList
                .add("reposted");

              }

            }
          );


          repost.onclick =
          async () => {

            if(
              repost.dataset.busy
            )return;


            repost.dataset.busy =
            "1";


            const repostRef =
            doc(
              db,
              "reposts",
              repostId
            );


            const exists =
            await getDoc(
              repostRef
            );


            if(exists.exists()){

              await deleteDoc(
                repostRef
              );


              await updateDoc(
                doc(
                  db,
                  "threads",
                  item.id
                ),
                {
                  reposts:
                  increment(-1)
                }
              );


              repost.classList
              .remove(
                "reposted"
              );

            }else{

              await setDoc(
                repostRef,
                {

                  userId:
                  currentUser.uid,

                  threadId:
                  item.id,

                  createdAt:
                  serverTimestamp()

                }
              );


              await updateDoc(
                doc(
                  db,
                  "threads",
                  item.id
                ),
                {
                  reposts:
                  increment(1)
                }
              );


              repost.classList
              .add(
                "reposted"
              );

            }


            repost.dataset.busy =
            "";

          };


          div.querySelector(
            ".comment"
          ).onclick =
          async () => {

            const text =
            prompt(
              "Write your comment:"
            );


            if(!text)return;


            const me =
            await getMyUser();


            await addDoc(
              collection(
                db,
                "threads",
                item.id,
                "comments"
              ),
              {

                userId:
                currentUser.uid,

                username:
                me.username || "user",

                text:text.trim(),

                createdAt:
                serverTimestamp()

              }
            );


            if(
              data.userId !==
              currentUser.uid
            ){

              await addDoc(
                collection(
                  db,
                  "notifications"
                ),
                {

                  userId:
                  data.userId,

                  fromUserId:
                  currentUser.uid,

                  text:
                  "Someone commented on your Thread.",

                  read:false,

                  createdAt:
                  serverTimestamp()

                }
              );

            }

          };


          $("threadList")
          .appendChild(div);

        }
      );

    }
  );

}

function loadUsers(){

      snapshot.forEach(

          const data =

          const div =

            "div"
          );


          div.className =
          "thread";


          div.innerHTML = `

            <div class="threadHead">

              <div class="letter">
                ${escapeHTML(
                  (
                    data.username ||
                    "U"
                  )
                  .charAt(0)
                  .toUpperCase()
                )}

              <div>

                <div class="name">
                  @${escapeHTML(
                    data.username ||
                    "user"
                  )}
                </div>

                <div class="${
                  data.online
                  ? "online"
                  : "offline"
                }">

                  ${
                    data.online
                    ? "💚 Online"
                    : "♥️ Offline"
                  }

                </div>

              </div>

            </div>

          `;


          div.onclick =
          () =>
          openChat(
            item.id,
            data.username ||
            "user"
          );


          $("usersList")
          .appendChild(div);

        }
      );


      if(!found){

        $("usersList")
        .innerHTML = `

          <div class="empty">
            No other users yet.
          </div>

        `;

      }

    }
  );

}

/* =========================
   CHAT
========================= */

function chatId(){

  return [
    currentUser.uid,
    activeChatUser
  ]
  .sort()
  .join("_");

}


function loadMessages(){

  if(!activeChatUser)return;


  const q =
  query(
    collection(
      db,
      "chats",
      chatId(),
      "messages"
    ),
    orderBy(
      "createdAt",
      "asc"
    )
  );


  onSnapshot(
    q,
    snapshot => {

      $("chatMessages")
      .innerHTML = "";


      snapshot.forEach(
        item => {

          const data =
          item.data();


          const div =
          document.createElement(
            "div"
          );


          div.className =
          "message " +
          (
            data.userId ===
            currentUser.uid
            ? "mine"
            : ""
          );


          div.textContent =
          data.text || "";


          $("chatMessages")
          .appendChild(div);

        }
      );


      $("chatMessages")
      .scrollTop =
      $("chatMessages")
      .scrollHeight;

    }
  );

}

  if(!activeChatUser)return;


  const input =
  $("chatInput");


  const text =

  if(!text)return;


  await addDoc(
    collection(

    ),
    {

      userId:
      currentUser.uid,

      text,

      createdAt:
      serverTimestamp()

    }
  );


  input.value = "";

}

/* =========================
   NOTIFICATIONS
========================= */

function loadNotifications(){

  const q =
  query(
    collection(
      db,
      "notifications"
    ),
    orderBy(
      "createdAt",
      "desc"
    )
  );


  onSnapshot(
    q,
    snapshot => {

      $("notificationList")
      .innerHTML = "";


      let unread = 0;


      snapshot.forEach(
        item => {

          const data =
          item.data();


          if(
            data.userId !==
            currentUser.uid
          )return;


          if(!data.read){

            unread++;

          }


          const div =
          document.createElement(
            "div"
          );


          div.className =
          "notification " +
          (
            !data.read
            ? "unread"
            : ""
          );


          div.textContent =
          data.text ||
          "New notification";


          $("notificationList")
          .appendChild(div);

        }
      );


      $("badge")
      .textContent =
      unread;


      $("badge")
      .classList
      .toggle(
        "hidden",
        unread === 0
      );

    }
  );

}
