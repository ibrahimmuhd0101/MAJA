<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f5f5;
 color:#111;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;

}

}
.logo{

}
.tag{

 margin-bottom:25px;
}
input,textarea{

}
textarea{resize:none;height:100px}

.main-btn{

}
.switch-btn{

}

.app{

}
.header{

 gap:7px;

}
.comment-box input{
 flex:1;
 margin:0;
}
.comment-box button{

 background:#111;
 color:white;
 border-radius:10px;
 padding:0 15px;
}

.banner{
 height:220px;
 background:#ddd center/cover no-repeat;
}
.profile-body{
 padding:60px 18px 20px;
 position:relative;
}
.profile-pic{
 width:105px;
 height:105px;
 border-radius:50%;
 object-fit:cover;
 border:4px solid white;

 left:20px;
 background:#111;
}
.profile-pic-text{
 width:105px;
 height:105px;
 border-radius:50%;
 border:4px solid white;
 position:absolute;
 top:-53px;
 left:20px;
 background:#111;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:35px;
 font-weight:bold;
}
.profile-head{
 display:flex;
 justify-content:space-between;
}
.settings-btn{
 border:0;
 background:#eee;
 border-radius:10px;
 padding:10px;
}
.stats{
 display:flex;
 gap:40px;
 padding:20px 0;
 border-bottom:1px solid #eee;
}
.stat b{display:block;text-align:center}
.stat span{font-size:12px;color:#777}

.settings{
 display:none;
 padding-top:20px;
}
.settings.open{display:block}
.label{
 display:block;
 font-weight:bold;
 font-size:13px;
 margin-bottom:6px;
}
.file{
 display:inline-block;
 background:#eee;
 border-radius:10px;
 padding:11px 14px;
 margin-bottom:15px;
 font-weight:bold;
}
.logout{
 border:0;
 background:#eee;
 padding:12px 20px;
 border-radius:10px;
}

.users{}
.chat-user{
 display:flex;
 gap:12px;
 align-items:center;
 padding:15px;
 border-bottom:1px solid #eee;
}
.chat-info{flex:1}
.small{font-size:12px;color:#888}

.chat-window{
 display:none;
 position:fixed;
 inset:0;
 z-index:50;
 max-width:680px;
 margin:auto;
 background:white;
}
.chat-header{
 height:60px;
 display:flex;
 align-items:center;
 gap:10px;
 border-bottom:1px solid #ddd;
 padding:8px;
}
.back{
 border:0;
 background:none;
 font-size:30px;
}
.messages{
 height:calc(100vh - 120px);
 overflow-y:auto;
 padding:15px;
}
.bubble{
 max-width:78%;
 width:max-content;
 background:#eee;
 border-radius:15px;
 padding:10px 13px;
 margin:7px 0;
 white-space:pre-wrap;
 word-break:break-word;
}
.mine{
 margin-left:auto;
 background:#111;
 color:white;
}
.send-box{
 height:60px;
 display:flex;
 gap:7px;
 padding:8px;
 border-top:1px solid #ddd;
}
.send-box input{
 flex:1;
 margin:0;
}
.send-box button{
 border:0;
 background:#111;
 color:white;
 border-radius:10px;
 padding:0 17px;
}

.nav{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 max-width:680px;
 width:100%;
 height:70px;
 display:flex;
 justify-content:space-around;
 background:white;
 border-top:1px solid #ddd;
 z-index:20;
}
.nav button{
 border:0;
 background:none;
 color:#777;
}
.nav button.active{
 color:#111;
 font-weight:bold;
}
.nav span{
 display:block;
 font-size:21px;
}
.empty{
 text-align:center;
 padding:50px 20px;
 color:#888;
}
</style>
</head>

<body>

<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 doc,
 setDoc,
 getDoc,
 addDoc,
 updateDoc,
 deleteDoc,
 query,
 where,
 orderBy,
 onSnapshot,
 serverTimestamp,
 increment
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyCAThpmkzHUaEgxafLjedZBoDdjfhaHjA4",
authDomain:"maja-46a91.firebaseapp.com",
projectId:"maja-46a91",
storageBucket:"maja-46a91.firebasestorage.app",
messagingSenderId:"1076643705312",
appId:"1:1076643705312:web:1c10e9b5cfb0987a3ebb85"
};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


let user=null;
let createMode=false;
let postImage="";
let chatUser=null;
let stopMessages=null;


const $=id=>document.getElementById(id);


function escapeText(value){

return String(value||"")
.replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c]));

}


function validUsername(name){

return /^[A-Za-z0-9_]{3,20}$/.test(name);

}


function imageToBase64(file,maxWidth=1000){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=()=>{

const img=new Image();

img.onload=()=>{

const scale=Math.min(
1,
maxWidth/img.width
);

const canvas=document.createElement("canvas");

canvas.width=Math.round(img.width*scale);
canvas.height=Math.round(img.height*scale);

canvas
.getContext("2d")
.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);

resolve(
canvas.toDataURL(
"image/jpeg",
0.6
)
);

};

img.onerror=reject;
img.src=reader.result;

};

reader.onerror=reject;
reader.readAsDataURL(file);

});

}


/* LOGIN MODE */

$("switchBtn").onclick=()=>{

createMode=!createMode;

$("usernameArea")
.classList
.toggle(
"hidden",
!createMode
);

$("authBtn").textContent=
createMode
?"Create Account"
:"Sign In";

$("switchBtn").textContent=
createMode
?"Already have an account? Sign In"
:"Create a new account";

$("authMsg").textContent="";

};


/* AUTH */

$("authBtn").onclick=async()=>{

const email=$("email").value.trim();
const password=$("password").value;
const username=$("username").value.trim();


if(!email){

$("authMsg").textContent=
"Enter your email.";

return;

}

if(!password){

$("authMsg").textContent=
"Enter your password.";

return;

}

if(password.length<6){

$("authMsg").textContent=
"Password must be at least 6 characters.";

return;

}

if(
createMode &&
!validUsername(username)
){

$("authMsg").textContent=
"Username must be 3-20 letters, numbers or underscore.";

return;

}


$("authBtn").disabled=true;

$("authBtn").textContent=
createMode
?"Creating..."
:"Signing in...";


try{

if(createMode){

const result=
await createUserWithEmailAndPassword(
auth,
email,
password
);

await setDoc(
doc(db,"users",result.user.uid),
{
username,
email,
photo:"",
banner:"",
createdAt:serverTimestamp()
}
);

}else{

await signInWithEmailAndPassword(
auth,
email,
password
);

}

}catch(error){

console.error(error);

$("authMsg").textContent=
error.code+
" — "+
error.message;

}


$("authBtn").disabled=false;

$("authBtn").textContent=
createMode
?"Create Account"
:"Sign In";

};


/* AUTH STATE */

onAuthStateChanged(
auth,
async current=>{

user=current;

if(!current){

$("login").style.display="flex";
$("app").style.display="none";

return;

}

$("login").style.display="none";
$("app").style.display="block";

await loadProfile();
loadThreads();
loadUsers();

});



/* PROFILE */

async function myProfile(){

const snap=
await getDoc(
doc(db,"users",user.uid)
);

return snap.exists()
?snap.data()
:{};

}


async function loadProfile(){

const data=await myProfile();

const name=data.username||"user";

$("profileName").textContent=
"@"+name;

$("profileEmail").textContent=
data.email||user.email||"";

$("editUsername").value=name;


if(data.banner){

$("banner").style.backgroundImage=
`url("${data.banner}")`;

}else{

$("banner").style.backgroundImage="none";

}


if(data.photo){

$("profilePicture").innerHTML=
`<img class="profile-pic"
src="${data.photo}">`;

}else{

$("profilePicture").innerHTML=
`<div class="profile-pic-text">
${escapeText(name.charAt(0).toUpperCase())}
</div>`;

}

}


/* SETTINGS */

$("settingsBtn").onclick=()=>{

$("settings")
.classList
.toggle("open");

};


/* USERNAME */

$("saveUsername").onclick=async()=>{

const name=
$("editUsername")
.value
.trim();

if(!validUsername(name)){

$("profileMsg").textContent=
"Use 3-20 letters, numbers or underscore.";

return;

}

$("saveUsername").disabled=true;

$("profileMsg").textContent=
"Saving...";

try{

await setDoc(
doc(db,"users",user.uid),
{
username:name
},
{merge:true}
);

await loadProfile();

$("profileMsg").textContent=
"Username saved ✓";

}catch(error){

$("profileMsg").textContent=
error.code+
" — "+
error.message;

}

$("saveUsername").disabled=false;

};


/* PROFILE PICTURE */

$("profileFile").onchange=async e=>{

const file=e.target.files[0];

if(!file)return;

$("profileMsg").textContent=
"Uploading...";

try{

const image=
await imageToBase64(
file,
500
);

await setDoc(
doc(db,"users",user.uid),
{
photo:image
},
{merge:true}
);

await loadProfile();

$("profileMsg").textContent=
"Profile picture updated ✓";

}catch(error){

$("profileMsg").textContent=
error.code+
" — "+
error.message;

}

};


/* BANNER */

$("bannerFile").onchange=async e=>{

const file=e.target.files[0];

if(!file)return;

$("profileMsg").textContent=
"Uploading banner...";

try{

const image=
await imageToBase64(
file,
1200
);

await setDoc(
doc(db,"users",user.uid),
{
banner:image
},
{merge:true}
);

await loadProfile();

$("profileMsg").textContent=
"Banner updated ✓";

}catch(error){

$("profileMsg").textContent=
error.code+
" — "+
error.message;

}

};


/* LOGOUT */

$("logout").onclick=()=>signOut(auth);



/* POST PHOTO */

$("photoBtn").onclick=()=>
$("postFile").click();


$("postFile").onchange=async e=>{

const file=e.target.files[0];

if(!file)return;

try{

postImage=
await imageToBase64(
file,
1000
);

$("postPreview").classList.remove("hidden");

$("postPreview").innerHTML=
`<img class="thread-img"
src="${postImage}">`;

}catch(error){

console.error(error);

}

};


/* POST */

$("postBtn").onclick=async()=>{

const text=
$("postText")
.value
.trim();

if(!text && !postImage){

$("postMsg").textContent=
"Write something or add a photo.";

return;

}

$("postBtn").disabled=true;

$("postMsg").textContent=
"Posting...";

try{

const me=await myProfile();

await addDoc(
collection(db,"threads"),
{
text,
image:postImage,
username:me.username||"user",
userId:user.uid,
likes:0,
createdAt:serverTimestamp()
}
);

$("postText").value="";
postImage="";
$("postFile").value="";
$("postPreview").innerHTML="";
$("postPreview").classList.add("hidden");

$("postMsg").textContent=
"Posted ✓";

}catch(error){

console.error(error);

$("postMsg").textContent=
error.code+
" — "+
error.message;

}

$("postBtn").disabled=false;

};



/* THREADS */

function loadThreads(){

const q=query(
collection(db,"threads"),
orderBy("createdAt","desc")
);

onSnapshot(
q,
snap=>{

$("threads").innerHTML="";

snap.forEach(item=>
renderThread(
item,
$("threads")
)
);

if(snap.empty){

$("threads").innerHTML=
'<div class="empty">No threads yet.</div>';

}

},
error=>{

$("threads").innerHTML=
`<div class="empty">
${error.code}<br>${error.message}
</div>`;

}
);

}


/* RENDER THREAD */

function renderThread(
snap,
container
){

const data=snap.data();

const article=document.createElement("article");

article.className="thread";

article.innerHTML=`

<div class="user">

<div class="avatar-text">
${escapeText(
(data.username||"u")
.charAt(0)
.toUpperCase()
)}
</div>

<div>
<div class="username">
@${escapeText(data.username||"user")}
</div>
<div class="handle">MAJA</div>
</div>

</div>

${
data.text
?`<div class="thread-text">
${escapeText(data.text)}
</div>`
:""
}

${
data.image
?`<img class="thread-img"
src="${data.image}">`
:""
}

<div class="actions">

<button class="action like">
♡ Like (${data.likes||0})
</button>

<button class="action comment">
💬 Comment
</button>

<button class="action share">
↗ Share
</button>

${
data.userId===user.uid
?`<button class="action delete">
🗑 Delete
</button>`
:""
}

</div>

<div class="comments">

<div class="comment-list"></div>

<div class="comment-box">

<input placeholder="Write a comment...">

<button>Send</button>

</div>

</div>
`;


/* LIKE */

article.querySelector(".like").onclick=
async()=>{

try{

await updateDoc(
doc(db,"threads",snap.id),
{
likes:increment(1)
}
);

}catch(error){

console.error(error);

}

};


/* COMMENT */

article.querySelector(".comment").onclick=()=>{

const box=
article.querySelector(".comments");

box.style.display=
box.style.display==="block"
?"none"
:"block";

loadComments(
snap.id,
article.querySelector(".comment-list")
);

};


/* SEND COMMENT */

const commentInput=
article.querySelector(
".comment-box input"
);

article
.querySelector(".comment-box button")
.onclick=async()=>{

const text=
commentInput.value.trim();

if(!text)return;

try{

const me=await myProfile();

await addDoc(
collection(
db,
"threads",
snap.id,
"comments"
),
{
text,
username:me.username||"user",
userId:user.uid,
createdAt:serverTimestamp()
}
);

commentInput.value="";

}catch(error){

console.error(error);

}

};


/* SHARE */

article.querySelector(".share").onclick=
async()=>{

try{

if(navigator.share){

await navigator.share({
title:"MAJA",
text:data.text||"Check this MAJA thread"
});

}else{

await navigator.clipboard.writeText(
data.text||"Check this MAJA thread"
);

alert("Copied ✓");

}

}catch(error){}

};


/* DELETE */

const del=
article.querySelector(".delete");

if(del){

del.onclick=async()=>{

if(!confirm("Delete this thread?"))return;

try{

await deleteDoc(
doc(db,"threads",snap.id)
);

}catch(error){

console.error(error);

}

};

}


container.appendChild(article);

}


/* COMMENTS */

function loadComments(
threadId,
list
){

const q=query(
collection(
db,
"threads",
threadId,
"comments"
),
orderBy("createdAt","asc")
);

onSnapshot(
q,
snap=>{

list.innerHTML="";

snap.forEach(item=>{

const data=item.data();

const div=
document.createElement("div");

div.className="comment";

div.innerHTML=
`<b>@${escapeText(
data.username||"user"
)}</b>
${escapeText(data.text||"")}`;

list.appendChild(div);

});

}
);

}


/* USERS */

function loadUsers(){

onSnapshot(
collection(db,"users"),
snap=>{

$("users").innerHTML="";

let found=false;

snap.forEach(item=>{

if(item.id===user.uid)return;

found=true;

const data=item.data();

const name=data.username||"user";

const div=
document.createElement("div");

div.className="chat-user";

div.innerHTML=`

${
data.photo
?`<img class="avatar"
src="${data.photo}">`
:`<div class="avatar-text">
${escapeText(
name.charAt(0).toUpperCase()
)}
</div>`
}

<div class="chat-info">

<b>@${escapeText(name)}</b>

<br>

<span class="small">
Tap to chat
</span>

</div>
`;

div.onclick=()=>{

openChat(
item.id,
name,
data.photo||""
);

};

$("users").appendChild(div);

});

if(!found){

$("users").innerHTML=
'<div class="empty">No other users yet.</div>';

}

}
);

}


/* CHAT ID */

function makeChatId(a,b){

return [a,b]
.sort()
.join("_");

}


/* OPEN CHAT */

function openChat(
uid,
name,
photo
){

chatUser=uid;

$("chatName").textContent=
"@"+name;

$("chatAvatar").innerHTML=
photo
?`<img class="avatar" src="${photo}">`
:`<div class="avatar-text">
${escapeText(
name.charAt(0).toUpperCase()
)}
</div>`;

$("chatWindow").style.display="block";

loadMessages();

}


/* MESSAGES */

function loadMessages(){

if(stopMessages)
stopMessages();

const chatId=
makeChatId(
user.uid,
chatUser
);

const q=query(
collection(
db,
"chats",
chatId,
"messages"
),
orderBy("createdAt","asc")
);

stopMessages=
onSnapshot(
q,
snap=>{

$("messages").innerHTML="";

snap.forEach(item=>{

const data=item.data();

const div=
document.createElement("div");

div.className=
"bubble "+
(
data.senderId===user.uid
?"mine"
:""
);

div.textContent=
data.text||"";

$("messages").appendChild(div);

});

$("messages").scrollTop=
$("messages").scrollHeight;

},
error=>{

console.error(
"CHAT ERROR",
error
);

$("messages").innerHTML=
`<div class="empty">
${error.code}<br>${error.message}
</div>`;

}
);

}


/* SEND MESSAGE */

async function sendMessage(){

const input=$("messageInput");
const button=$("sendBtn");

const text=input.value.trim();

if(!text)return;

if(!chatUser){

alert("Select a user first.");

return;

}

const chatId=
makeChatId(
user.uid,
chatUser
);

button.disabled=true;
button.textContent="Sending...";

try{

await addDoc(
collection(
db,
"chats",
chatId,
"messages"
),
{
text:text,
senderId:user.uid,
receiverId:chatUser,
createdAt:serverTimestamp()
}
);

input.value="";

button.textContent="Sent ✓";

setTimeout(
()=>button.textContent="Send",
800
);

}catch(error){

console.error(
"SEND ERROR:",
error
);

alert(
"An kasa aika saƙon:\n\n"+
error.code+
"\n"+
error.message
);

button.textContent="Send";

}

button.disabled=false;

}


$("sendBtn").onclick=
sendMessage;


$("messageInput").onkeydown=
e=>{

if(e.key==="Enter"){

e.preventDefault();
sendMessage();

}

};


$("backChat").onclick=()=>{

$("chatWindow").style.display="none";

if(stopMessages){

stopMessages();
stopMessages=null;

}

};


/* NAVIGATION */

function page(
page,
nav
){

document
.querySelectorAll(".page")
.forEach(x=>
x.classList.remove("active")
);

$(page).classList.add("active");

document
.querySelectorAll(".nav button")
.forEach(x=>
x.classList.remove("active")
);

$(nav).classList.add("active");

}


$("threadsNav").onclick=
()=>page(
"threadsPage",
"threadsNav"
);

$("chatNav").onclick=
()=>page(
"chatPage",
"chatNav"
);

$("profileNav").onclick=
async()=>{

page(
"profilePage",
"profileNav"
);

await loadProfile();

};

</script>

</body>
</html>
