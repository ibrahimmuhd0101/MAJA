<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f4f4;
  color:#111;
}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:white;
}

.login-box{
  width:100%;
  max-width:390px;
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:30px;
}

input{
  width:100%;
  padding:16px;
  margin-bottom:12px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

.main-button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:bold;
  margin-bottom:12px;
  cursor:pointer;
}

.switch{
  width:100%;
  padding:14px;
  border:0;
  background:white;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

.message{
  text-align:center;
  margin-top:15px;
  font-size:14px;
  color:#777;
}

.app{
  display:none;
  max-width:600px;
  margin:auto;
  min-height:100vh;
  background:white;
}

header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  background:white;
  z-index:5;
}

header h1{
  font-size:27px;
}

.page{
  display:none;
  padding-bottom:90px;
}

.page.active{
  display:block;
}

.thread{
  padding:20px;
  border-bottom:1px solid #eee;
}

.user{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.thread-text{
  margin:14px 0;
  line-height:1.6;
}

.actions{
  display:flex;
  gap:25px;
  color:#666;
  font-size:14px;
}

.chat{
  padding:18px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #eee;
}

.chat-info{
  flex:1;
}

.last-message{
  margin-top:5px;
  color:#888;
  font-size:14px;
}

.profile{
  text-align:center;
  padding:45px 20px;
}

.profile .avatar{
  width:90px;
  height:90px;
  margin:auto;
  font-size:30px;
}

.profile h2{
  margin-top:15px;
}

.profile p{
  margin-top:7px;
  color:#777;
}

.logout{
  margin-top:25px;
  padding:13px 25px;
  border:0;
  border-radius:10px;
  background:#111;
  color:white;
}

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:600px;
  height:72px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav button{
  border:0;
  background:none;
  color:#777;
  font-size:13px;
  cursor:pointer;
}

.nav button.active{
  color:#111;
  font-weight:bold;
}

.icon{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="login">

  <div class="login-box">

    <div class="logo">MAJA</div>

    <p class="subtitle">
      Connect. Chat. Share.
    </p>

    <div id="authForm">

      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="authButton" class="main-button">
        Sign In
      </button>

      <button id="switchButton" class="switch">
        Create a new account
      </button>

    </div>

    <p id="authMessage" class="message"></p>

  </div>

</div>


<!-- MAIN APP -->

<div id="app" class="app">

  <header>
    <h1>MAJA</h1>
  </header>


  <!-- THREADS -->

  <section id="threads" class="page active">
<div style="padding:20px;border-bottom:1px solid #eee;">

  <textarea
    id="threadInput"
    placeholder="What's happening?"
    maxlength="500"
    style="
      width:100%;
      min-height:90px;
      padding:15px;
      border:1px solid #ddd;
      border-radius:12px;
      resize:none;
      font-size:15px;
      outline:none;
    "
  ></textarea>

  <button
    id="postThread"
    style="
      margin-top:10px;
      width:100%;
      padding:14px;
      border:0;
      border-radius:12px;
      background:#111;
      color:white;
      font-weight:bold;
      font-size:15px;
    "
  >
    Post Thread
  </button>

  <p id="threadMessage"
     style="
       margin-top:10px;
       font-size:13px;
       color:#777;
     ">
  </p>

</div>

<div id="threadsList"></div>
    <div class="thread">

      <div class="user">

        <div class="avatar">M</div>

        <div>
          <b>MAJA</b>
          <small> · Welcome</small>
        </div>

      </div>

      <p class="thread-text">
        Welcome to MAJA 👋
      </p>

      <div class="actions">
        <span>♡ Like</span>
        <span>💬 Reply</span>
        <span>↗ Share</span>
      </div>

    </div>

  </section>


  <!-- CHAT -->

  <section id="chat" class="page">

    <div class="chat">

      <div class="avatar">M</div>

      <div class="chat-info">

        <b>MAJA</b>

        <div class="last-message">
          Welcome to MAJA 💬
        </div>

      </div>

    </div>

  </section>


  <!-- PROFILE -->

  <section id="profile" class="page">

    <div class="profile">

      <div class="avatar">M</div>

      <h2>My Profile</h2>

      <p id="userEmail">Email</p>

      <button id="logoutButton" class="logout">
        Sign Out
      </button>

    </div>

  </section>


  <!-- NAVIGATION -->

  <nav class="nav">

    <button
      id="threadsBtn"
      class="active"
      onclick="showPage('threads','threadsBtn')">

      <span class="icon">🧵</span>
      Threads

    </button>

    <button
      id="chatBtn"
      onclick="showPage('chat','chatBtn')">

      <span class="icon">💬</span>
      Chat

    </button>

    <button
      id="profileBtn"
      onclick="showPage('profile','profileBtn')">

      <span class="icon">👤</span>
      Profile

    </button>

  </nav>

</div>


<!-- FIREBASE -->
  <script type="module">
const threadInput = document.getElementById("threadInput");
const postThread = document.getElementById("postThread");
const threadMessage = document.getElementById("threadMessage");
const threadsList = document.getElementById("threadsList");

postThread.addEventListener("click", async () => {

  const text = threadInput.value.trim();

  if (!text) {
    threadMessage.textContent = "Rubuta wani abu kafin ka post.";
    return;
  }

  const user = auth.currentUser;

  if (!user) {
    threadMessage.textContent = "Ka fara Sign In.";
    return;
  }

  postThread.disabled = true;
  threadMessage.textContent = "Posting...";

  try {

    await addDoc(collection(db, "threads"), {
      text: text,
      userId: user.uid,
      email: user.email,
      createdAt: serverTimestamp()
    });

    threadInput.value = "";
    threadMessage.textContent = "Thread posted ✓";

  } catch (error) {

    console.error(error);
    threadMessage.textContent =
      "An samu matsala wajen posting.";

  }

  postThread.disabled = false;

});


const threadsQuery = query(
  collection(db, "threads"),
  orderBy("createdAt", "desc")
);


onSnapshot(threadsQuery, (snapshot) => {

  threadsList.innerHTML = "";

  snapshot.forEach((doc) => {

    const data = doc.data();

    const div = document.createElement("div");

    div.className = "thread";

    div.innerHTML = `
      <div class="user">
        <div class="avatar">
          ${data.email ? data.email.charAt(0).toUpperCase() : "M"}
        </div>

        <div>
          <b>${data.email || "MAJA User"}</b>
        </div>
      </div>

      <p class="thread-text">
        ${data.text}
      </p>

      <div class="actions">
        <span>♡ Like</span>
        <span>💬 Reply</span>
        <span>↗ Share</span>
      </div>
    `;

    threadsList.appendChild(div);

  });

});


import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyAEWIrc0uCIHvJ_RHYW3l8UTumzYWeNo-w",

  authDomain: "maja-a6299.firebaseapp.com",

  projectId: "maja-a6299",

  storageBucket: "maja-a6299.firebasestorage.app",

  messagingSenderId: "217642905179",

  appId: "1:217642905179:web:683d1c3e8c6fab3356997e",

  measurementId: "G-SPCEJNFTLH"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);

const loginPage =
document.getElementById("loginPage");

const mainApp =
document.getElementById("app");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const authButton =
document.getElementById("authButton");

const switchButton =
document.getElementById("switchButton");

const authMessage =
document.getElementById("authMessage");

const userEmail =
document.getElementById("userEmail");

const logoutButton =
document.getElementById("logoutButton");


let createMode = false;


switchButton.addEventListener("click", () => {

  createMode = !createMode;

  if(createMode){

    authButton.textContent = "Create Account";

    switchButton.textContent = "Already have an account? Sign In";

  }else{

    authButton.textContent = "Sign In";

    switchButton.textContent = "Create a new account";

  }

});


authButton.addEventListener("click", async () => {

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  if(!email || !password){

    authMessage.textContent =
      "Enter your email and password.";

    return;

  }


  authMessage.textContent =
    "Please wait...";


  try{

    if(createMode){

      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    }else{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }

    authMessage.textContent = "";

  }catch(error){

    console.error(error);

    if(error.code === "auth/email-already-in-use"){

      authMessage.textContent =
        "This email is already registered.";

    }else if(error.code === "auth/invalid-credential"){

      authMessage.textContent =
        "Email or password is incorrect.";

    }else if(error.code === "auth/weak-password"){

      authMessage.textContent =
        "Password must be at least 6 characters.";

    }else if(error.code === "auth/invalid-email"){

      authMessage.textContent =
        "Please enter a valid email.";

    }else{

      authMessage.textContent =
        error.message;

    }

  }

});


logoutButton.addEventListener("click", async () => {

  await signOut(auth);

});


onAuthStateChanged(auth, (user) => {

  if(user){

    loginPage.style.display = "none";

    mainApp.style.display = "block";

    userEmail.textContent =
      user.email || "Email";

  }else{

    loginPage.style.display = "flex";

    mainApp.style.display = "none";

  }

});


window.showPage = function(page, button){

  document.querySelectorAll(".page")
    .forEach(item =>
      item.classList.remove("active")
    );

  document.getElementById(page)
    .classList.add("active");


  document.querySelectorAll(".nav button")
    .forEach(item =>
      item.classList.remove("active")
    );

  document.getElementById(button)
    .classList.add("active");

};

</script>

</body>
</html>
