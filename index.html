<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJA</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#fff;
 color:#111;
}

button,input,textarea{
 font:inherit;
}

button{cursor:pointer}

.hidden{display:none!important}

#login{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.loginBox{
 width:100%;
 max-width:390px;
}

.logo{
 text-align:center;
 font-size:58px;
 font-weight:900;
 letter-spacing:-5px;
}

.tag{
 text-align:center;
 color:#777;
 margin-bottom:28px;
}

.input{
 width:100%;
 padding:14px;
 border:1px solid #ddd;
 border-radius:14px;
 margin-bottom:10px;
 outline:none;
}

.primary{
 width:100%;
 padding:14px;
 border:0;
 border-radius:14px;
 background:#111;
 color:#fff;
 font-weight:bold;
}

.switch{
 width:100%;
 padding:14px;
 border:0;
 background:#fff;
 font-weight:bold;
}

.error{

 margin-top:10px;
}

#app{
 display:none;

 margin:auto;
 min-height:100vh;
}

.top{
 height:60px;
 position:sticky;
 top:0;
 z-index:50;
 background:#fff;
 border-bottom:1px solid #eee;

 justify-content:center;
 align-items:center;
}

.top strong{
 font-size:24px;
}

.page{
 display:none;
 padding-bottom:90px;
}

.page.active{
 display:block;
}

.composer{
 padding:15px;
 border-bottom:1px solid #eee;
}

textarea{
 width:100%;
 min-height:90px;
 border:1px solid #ddd;
 border-radius:15px;
 padding:13px;
 resize:none;
 outline:none;
}

.row{
 display:flex;
 align-items:center;
 margin-top:8px;
}

.attach{
 background:none;
 border:0;
 font-size:22px;
}

.post{
 margin-left:auto;
 background:#111;
 color:#fff;
 border:0;
 padding:10px 18px;
 border-radius:20px;
 font-weight:bold;
}

.thread,
.moment,
.user,
.notification{
 padding:15px;
 border-bottom:1px solid #eee;
}

.head,
.userRow{
 display:flex;
 align-items:center;
 gap:10px;
}

.avatar{
 width:45px;
 height:45px;
 border-radius:50%;
 background:#111;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 flex-shrink:0;
 overflow:hidden;
}

.avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.username{
 font-weight:bold;
}

.small{
 font-size:12px;
 color:#777;
}

.threadText{
 margin:12px 0;
 line-height:1.5;
 white-space:pre-wrap;
}

.threadImg,
.momentImg{
 width:100%;

 object-fit:cover;
 border-radius:15px;
}

.actions{
 display:flex;
 justify-content:space-between;
 margin-top:10px;
}

.action{
 background:none;
 border:0;
 color:#666;
}

.action.liked{

}

.action.reposted{

}

.views{

}

.comments{

}

.comment{

}

.commentBox{

}

.commentBox input{

}

.commentBox button{

}

.followBtn{

}

.profileHeader{

}

.back{

.banner{

.camera{

.profileBody{

.bigAvatar{

}

.edit{

}

.profileName{

}

.stats{

}

.stat strong{

}

.stat span{

}

.online{

}

.offline{

}

.option{

 border-bottom:1px solid #eee;

 font-weight:bold;
}

/* NOTIFICATIONS */

.notification{

}

.notification.unread{

}

.notificationText{

}

.notificationTime{

 margin-top:5px;
}

/* CHAT */

.chatWindow{
 position:fixed;
 inset:0;
 max-width:680px;
 margin:auto;
 background:#fff;
 z-index:300;
 display:none;
}

.chatWindow.open{
 display:block;
}

.chatHeader{
 height:60px;
 display:flex;
 align-items:center;
 padding:0 12px;
 border-bottom:1px solid #eee;
}

.chatHeader button{
 border:0;
 background:none;
 font-size:28px;
}

.chatUserInfo{
 display:flex;
 align-items:center;
 gap:10px;
 margin-left:10px;
}

.chatUserInfo .avatar{

}

.messages{

.message{
 width:max-content;

 margin:8px 0;

}

.message.mine{
 margin-left:auto;
 border-radius:17px 17px 4px 17px;
 background:#111;
 color:#fff;
}

.messageTime{
 font-size:10px;
 opacity:.55;
 text-align:right;
 margin-top:4px;
}

.chatInput{
 position:absolute;
 bottom:0;
 width:100%;
 display:flex;
 gap:7px;
 padding:10px;
 border-top:1px solid #eee;
 background:#fff;
}

.chatInput input{
 flex:1;
 border:1px solid #ddd;
 border-radius:22px;
 padding:11px 14px;
 outline:none;
}

.send{
 width:44px;
 height:44px;
 border:0;
 border-radius:50%;
 background:#111;
 color:#fff;
}

.modal{
 position:fixed;
 inset:0;
 background:#0008;
 z-index:500;
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
}

.modal.open{
 display:flex;
}

.modalBox{
 width:100%;
 max-width:400px;
 background:#fff;
 border-radius:18px;
 padding:18px;
}

.modalTop{
 display:flex;
 align-items:center;
 margin-bottom:15px;
}

.modalTop strong{
 flex:1;
}

.close{
 border:0;
 background:none;
 font-size:22px;
}

.save{
 border:0;
 background:#111;
 color:#fff;
 padding:8px 15px;
 border-radius:18px;
}

</style>
</head>

<script type="module">

/* =========================================
   FIREBASE
   MAJA-1FA6A CONFIG
========================================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
getFirestore,
collection,
doc,
getDoc,
setDoc,
addDoc,
updateDoc,
deleteDoc,
getDocs,
increment,
serverTimestamp,
query,
orderBy,
where,
onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyAUQm-3ullzFDRwn5Iu0Hg_7u0Mfiz688o",

authDomain:
"maja-1fa6a.firebaseapp.com",

projectId:
"maja-1fa6a",

messagingSenderId:
"877281790124",

appId:
"1:877281790124:web:14f693dfd580451e3bb709"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);

let currentUser=null;
let activeChat=null;
let chatUnsubscribe=null;


/* HELPERS */

const $=
id=>document.getElementById(id);


function safe(v){

return String(v||"")
.replace(/[&<>"']/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c]));

}


function timeText(date){

if(!date)return "";

return date.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

}


async function getMe(){

const snap=
await getDoc(
doc(
db,
"users",
currentUser.uid
)
);

return snap.exists()
?snap.data()
:{};

}


/* AUTH */

let signup=false;


$("switchBtn").onclick=()=>{

signup=!signup;

$("signupFields")
.classList
.toggle(
"hidden",
!signup
);

$("authBtn").textContent=
signup
?"Create Account"
:"Sign In";

$("switchBtn").textContent=
signup
?"Already have an account? Sign In"
:"Create a new account";

};


$("authBtn").onclick=
async()=>{

const email=
$("email").value.trim();

const password=
$("password").value;

if(!email||!password){

$("authError").textContent=
"Enter email and password.";

return;

}

try{

if(signup){

const username=
$("username").value.trim();

const gender=
$("gender").value;

if(username.length<3){

$("authError").textContent=
"Username must be at least 3 characters.";

return;

}

const result=
await createUserWithEmailAndPassword(
auth,
email,
password
);

await setDoc(
doc(
db,
"users",
result.user.uid
),
{

username,
gender,
email,

photo:"",
banner:"",

online:true,

followersCount:0,
followingCount:0,

createdAt:
serverTimestamp(),

lastSeen:
serverTimestamp()

}
);

}else{

await signInWithEmailAndPassword(
auth,
email,
password
);

}

}catch(error){

$("authError").textContent=
error.message;

}

};


/* AUTH STATE */

onAuthStateChanged(
auth,
async user=>{

if(!user){

$("login").style.display="flex";
$("app").style.display="none";

return;

}

currentUser=user;

$("login").style.display="none";
$("app").style.display="block";

await ensureUser();

await setOnline(true);

loadThreads();
loadMoments();
loadUsers();
loadNotifications();
loadProfile();

}
);


async function ensureUser(){

const ref=
doc(
db,
"users",
currentUser.uid
);

const snap=
await getDoc(ref);

if(!snap.exists()){

await setDoc(
ref,
{

username:"MajaUser",

email:
currentUser.email||"",

gender:"",

photo:"",
banner:"",

online:true,

followersCount:0,
followingCount:0,

createdAt:
serverTimestamp(),

lastSeen:
serverTimestamp()

}
);

}

}


async function setOnline(value){

if(!currentUser)return;

await setDoc(
doc(
db,
"users",
currentUser.uid
),
{

online:value,

lastSeen:
serverTimestamp()

},
{
merge:true
}
);

}


window.addEventListener(
"beforeunload",
()=>{
setOnline(false);
}
);


/* NAV */

function showPage(
page,
button
){

document
.querySelectorAll(".page")
.forEach(
x=>x.classList.remove("active")
);

$(page).classList.add("active");

document
.querySelectorAll(".nav button")
.forEach(
x=>x.classList.remove("active")
);

$(button).classList.add("active");

if(page==="notifications"){

markNotificationsRead();

}

}


$("navThreads").onclick=()=>
showPage(
"threads",
"navThreads"
);

$("navMoments").onclick=()=>
showPage(
"moments",
"navMoments"
);

$("navChat").onclick=()=>
showPage(
"chat",
"navChat"
);

$("navNotifications").onclick=()=>
showPage(
"notifications",
"navNotifications"
);

$("navProfile").onclick=()=>
showPage(
"profile",
"navProfile"
);


/* THREAD PHOTO */

$("threadPhotoBtn").onclick=()=>
$("threadPhoto").click();


function fileToDataURL(file){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();

reader.onload=
()=>resolve(reader.result);

reader.onerror=reject;

reader.readAsDataURL(file);

}
);


/* CREATE THREAD */

$("postBtn").onclick=
async()=>{

const text=
$("threadText")
.value
.trim();

const file=
$("threadPhoto")
.files[0];

if(!text&&!file)return;

let image="";

if(file){

image=
await fileToDataURL(file);

}

const user=
await getMe();

await addDoc(
collection(
db,
"threads"
),
{

userId:
currentUser.uid,

username:
user.username||"user",

text,
image,

likesCount:0,
commentCount:0,
repostsCount:0,

createdAt:
serverTimestamp()

}
);

$("threadText").value="";
$("threadPhoto").value="";

};


/* THREADS */

function loadThreads(){

const q=
query(
collection(db,"threads"),
orderBy(
"createdAt",
"desc"
)
);

onSnapshot(
q,
snapshot=>{

$("threadList").innerHTML="";

snapshot.forEach(
item=>{

const d=
item.data();

const el=
document.createElement("div");

el.className="thread";

el.innerHTML=`

<div class="head">

<div class="avatar">

${safe(
(d.username||"U")
.charAt(0)
.toUpperCase()
)}

</div>

<div>

<div class="username">
@${safe(d.username||"user")}
</div>

<div class="small">
MAJA
</div>

</div>

</div>

<div class="threadText">
${safe(d.text||"")}
</div>

${
d.image
?
`<img
class="threadImg"
src="${d.image}">`
:""
}

<div class="actions">

<button class="action likeBtn">
❤️ ${d.likesCount||0}
</button>

<button class="action commentBtn">
💬 ${d.commentCount||0}
</button>

<button class="action repostBtn">
🔁 ${d.repostsCount||0}
</button>

</div>

<div class="comments hidden"></div>

`;

const like=
el.querySelector(".likeBtn");

const comment=
el.querySelector(".commentBtn");

const repost=
el.querySelector(".repostBtn");

const comments=
el.querySelector(".comments");


checkLike(item.id,like);

checkRepost(item.id,repost);


like.onclick=
async()=>{

const id=
item.id+
"_"+currentUser.uid;

async function isFollowing(
uid
){

const snap=
await getDoc(
doc(
db,
"follows",
currentUser.uid+
"_"+uid
)
);

return snap.exists();

}


async function toggleFollow(
target
){

const id=
currentUser.uid+
"_"+target;

const ref=
doc(db,"follows",id);

const snap=
await getDoc(ref);

if(snap.exists()){

await deleteDoc(ref);

await updateDoc(
doc(db,"users",currentUser.uid),
{
followingCount:
increment(-1)
}
);

await updateDoc(
doc(db,"users",target),
{
followersCount:
increment(-1)
}
);

return false;

}

await setDoc(
ref,
{

followerId:
currentUser.uid,

followingId:
target,

createdAt:
serverTimestamp()

}
);

await updateDoc(
doc(db,"users",currentUser.uid),
{
followingCount:
increment(1)
}
);

await updateDoc(
doc(db,"users",target),
{
followersCount:
increment(1)
}
);

await createNotification(
target,
"follow",
""
);

return true;

}


/* DM */

function chatId(
a,
b
){

return[
a,b
]
.sort()
.join("_");

}


async function openChat(
uid,
name
){

activeChat=uid;

$("chatTitle")
.textContent=
"@"+name;

$("chatWindow")
.classList.add("open");

const user=
await getDoc(
doc(db,"users",uid)
);

if(user.exists()){

const d=user.data();

$("chatStatus")
.textContent=
d.online
?"🟢 Online"
:"Offline";

}

loadMessages();

}


function loadMessages(){

if(chatUnsubscribe)
chatUnsubscribe();

const id=
chatId(
currentUser.uid,
activeChat
);

const q=
query(
collection(
db,
"chats",
id,
"messages"
),
orderBy(
"createdAt",
"asc"
)
);

chatUnsubscribe=
onSnapshot(
q,
async snapshot=>{

$("messages").innerHTML="";

snapshot.forEach(
item=>{

const d=
item.data();

const mine=
d.senderId===
currentUser.uid;

const div=
document.createElement("div");

div.className=
"message"+
(mine?" mine":"");

div.innerHTML=`

<div>
${safe(d.text||"")}
</div>

<div class="messageTime">

${
d.createdAt
?
timeText(
d.createdAt.toDate()
)
:""
}

${
mine
?
(d.seen?" ✓✓":" ✓")
:""
}

</div>

`;

$("messages")
.appendChild(div);

}
);

$("messages").scrollTop=
$("messages").scrollHeight;

await markSeen();

}
);

}


async function sendMessage(){

if(!activeChat)return;

const input=
$("messageInput");

const text=
input.value.trim();

if(!text)return;

const id=
chatId(
currentUser.uid,
activeChat
);

const user=
await getMe();

await setDoc(
doc(db,"chats",id),
{

members:[
currentUser.uid,
activeChat
],

lastMessage:text,

lastSender:
currentUser.uid,

updatedAt:
serverTimestamp()

},
{
merge:true
}
);

await addDoc(
collection(
db,
"chats",
id,
"messages"
),
{

senderId:
currentUser.uid,

receiverId:
activeChat,

senderName:
user.username||"user",

text,

seen:false,

createdAt:
serverTimestamp()

}
);

await createNotification(
activeChat,
"message",
""
);

input.value="";

}


$("sendBtn").onclick=
sendMessage;


$("messageInput")
.addEventListener(
"keydown",
e=>{

if(e.key==="Enter"){

e.preventDefault();

sendMessage();

}

}
);


async function markSeen(){

if(!activeChat)return;

const id=
chatId(
currentUser.uid,
activeChat
);

const q=
query(
collection(
db,
"chats",
id,
"messages"
),
where(
"receiverId",
"==",
currentUser.uid
),
where(
"seen",
"==",
false
)
);

const snap=
await getDocs(q);

for(
const item of snap.docs
){

await updateDoc(
item.ref,
{
seen:true
}
);

}

}


$("closeChat").onclick=
()=>{

$("chatWindow")
.classList.remove("open");

activeChat=null;

if(chatUnsubscribe){

chatUnsubscribe();

chatUnsubscribe=null;

}

};


/* NOTIFICATIONS */

async function createNotification(
receiverId,
type,
targetId
){

if(
!receiverId||
receiverId===
currentUser.uid
)return;

const user=
await getMe();

await addDoc(
collection(db,"notifications"),
{

receiverId,

senderId:
currentUser.uid,

senderName:
user.username||"user",

type,

targetId,

read:false,

createdAt:
serverTimestamp()

}
);

}


function notificationText(d){

const name=
"@"+(
d.senderName||"Someone"
);

if(d.type==="like")
return name+
" liked your post ❤️";

if(d.type==="comment")
return name+
" commented on your post 💬";

if(d.type==="repost")
return name+
" reposted your post 🔁";

if(d.type==="follow")
return name+
" followed you 👤";

if(d.type==="message")
return name+
" sent you a message 💬";

return name+
" interacted with you.";

}


function loadNotifications(){

const q=
query(
collection(db,"notifications"),
where(
"receiverId",
"==",
currentUser.uid
),
orderBy(
"createdAt",
"desc"
)
);

onSnapshot(
q,
snapshot=>{

$("notificationList")
.innerHTML="";

let unread=0;

snapshot.forEach(
item=>{

const d=
item.data();

if(!d.read)unread++;

const el=
document.createElement("div");

el.className=
"notification"+
(
d.read
?""
:" unread"
);

el.innerHTML=`

<div class="avatar">
${safe(
(d.senderName||"U")
.charAt(0)
.toUpperCase()
)}
</div>

<div class="notificationText">

${safe(
notificationText(d)
)}

<div class="notificationTime">

${
d.createdAt
?
timeText(
d.createdAt.toDate()
)
:""
}

</div>

</div>

`;

$("notificationList")
.appendChild(el);

}
);

if(unread){

$("notificationBadge")
.textContent=
unread;

$("notificationBadge")
.classList
.remove("hidden");

}else{

$("notificationBadge")
.classList
.add("hidden");

}

}
);

}
