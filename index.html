<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
getFirestore,
collection,
doc,
setDoc,
getDoc,
addDoc,
updateDoc,
deleteDoc,
query,
orderBy,
onSnapshot,
serverTimestamp,
increment
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyCAThpmkzHUaEgxafLjedZBoDdjfhaHjA4",

authDomain:
"maja-46a91.firebaseapp.com",

projectId:
"maja-46a91",

storageBucket:
"maja-46a91.firebasestorage.app",

messagingSenderId:
"1076643705312",

appId:
"1:1076643705312:web:1c10e9b5cfb0987a3ebb85"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


const $ =
id => document.getElementById(id);


let createMode = false;
let currentUser = null;
let currentChatUser = null;
let unsubscribeMessages = null;
let selectedPostImage = "";


/* USERNAME */

function validUsername(name){

return /^[A-Za-z0-9_]{3,20}$/.test(name);

}


/* IMAGE COMPRESS */

function compressImage(file,maxWidth,quality){

return new Promise((resolve,reject)=>{

const reader =
new FileReader();

reader.onload = () => {

const img =
new Image();

img.onload = () => {

const scale =
Math.min(
1,
maxWidth / img.width
);

const canvas =
document.createElement("canvas");

canvas.width =
Math.max(
1,
Math.round(img.width * scale)
);

canvas.height =
Math.max(
1,
Math.round(img.height * scale)
);

const ctx =
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);

resolve(
canvas.toDataURL(
"image/jpeg",
quality
)
);

};

img.onerror = reject;

img.src =
reader.result;

};

reader.onerror = reject;

reader.readAsDataURL(file);

});

}


/* ERROR */

function showError(element,error){

console.error(error);

element.textContent =
(error.code || "ERROR") +
" — " +
(error.message || error);

}


/* LOGIN MODE */

$("switchButton").onclick = () => {

createMode =
!createMode;

$("createFields")
.classList
.toggle(
"hidden",
!createMode
);

$("authButton").textContent =
createMode
? "Create Account"
: "Sign In";

$("switchButton").textContent =
createMode
? "Already have an account? Sign In"
: "Create a new account";

$("authMessage").textContent = "";

};


/* LOGIN */

$("authButton").onclick =
async () => {

const email =
$("email").value.trim();

const password =
$("password").value;

const username =
$("username").value.trim();


if(!email || !password){

$("authMessage").textContent =
"Enter email and password.";

return;

}


if(password.length < 6){

$("authMessage").textContent =
"Password must be at least 6 characters.";

return;

}


if(
createMode &&
!validUsername(username)
){

$("authMessage").textContent =
"Username must be 3-20 characters.";

return;

}


$("authButton").disabled =
true;

$("authMessage").textContent =
"Please wait...";


try{

if(createMode){

const result =
await createUserWithEmailAndPassword(
auth,
email,
password
);

await setDoc(
doc(
db,
"users",
result.user.uid
),
{

username:
username,

email:
email,

photo:
"",

banner:
"",

createdAt:
serverTimestamp()

}
);

}else{

await signInWithEmailAndPassword(
auth,
email,
password
);

}

}catch(error){

showError(
$("authMessage"),
error
);

}

$("authButton").disabled =
false;

};


/* AUTH STATE */

onAuthStateChanged(
auth,
async user => {

currentUser =
user;

if(!user){

$("login").style.display =
"flex";

$("app").style.display =
"none";

return;

}

$("login").style.display =
"none";

$("app").style.display =
"block";

await loadProfile();

loadThreads();

loadUsers();

});


/* CURRENT USER */

async function getMyProfile(){

const snap =
await getDoc(
doc(
db,
"users",
currentUser.uid
)
);

return snap.exists()
? snap.data()
: {};

}


/* PROFILE */

async function loadProfile(){

const data =
await getMyProfile();

const name =
data.username || "user";


$("profileName").textContent =
"@" + name;

$("profileEmail").textContent =
data.email ||
currentUser.email ||
"";


$("editUsername").value =
name;


if(data.banner){

$("profileBanner")
.style
.backgroundImage =
`url("${data.banner}")`;

}else{

$("profileBanner")
.style
.backgroundImage =
"none";

}


if(data.photo){

$("profileAvatarArea")
.innerHTML = `
<img
class="profileAvatar"
src="${data.photo}"
alt="Profile">`;

}else{

$("profileAvatarArea")
.innerHTML = `
<div class="profileAvatarText">
${name.charAt(0).toUpperCase()}
</div>`;

}

}


/* SETTINGS */

$("settingsButton").onclick =
() => {

$("settingsPanel")
.classList
.toggle("open");

};


/* SAVE USERNAME */

$("saveUsername").onclick =
async () => {

const name =
$("editUsername")
.value
.trim();


if(!validUsername(name)){

$("profileMessage").textContent =
"Username must be 3-20 letters, numbers or underscore.";

return;

}


$("saveUsername").disabled =
true;

$("profileMessage").textContent =
"Saving...";


try{

await setDoc(
doc(
db,
"users",
currentUser.uid
),
{

username:
name

},
{

merge:true

}
);

await loadProfile();

$("profileMessage").textContent =
"Username saved ✓";

}catch(error){

showError(
$("profileMessage"),
error
);

}

$("saveUsername").disabled =
false;

};


/* PROFILE PHOTO */

$("profileImage").onchange =
async event => {

const file =
event.target.files[0];

if(!file)return;


$("profileMessage").textContent =
"Uploading picture...";


try{

const image =
await compressImage(
file,
500,
0.65
);

await setDoc(
doc(
db,
"users",
currentUser.uid
),
{

photo:
image

},
{

merge:true

}
);

await loadProfile();

$("profileMessage").textContent =
"Profile picture updated ✓";

}catch(error){

showError(
$("profileMessage"),
error
);

}

};


/* BANNER */

$("bannerImage").onchange =
async event => {

const file =
event.target.files[0];

if(!file)return;


$("profileMessage").textContent =
"Uploading banner...";


try{

const image =
await compressImage(
file,
1200,
0.55
);

await setDoc(
doc(
db,
"users",
currentUser.uid
),
{

banner:
image

},
{

merge:true

}
);

await loadProfile();

$("profileMessage").textContent =
"Banner updated ✓";

}catch(error){

showError(
$("profileMessage"),
error
);

}

};


/* PHOTO BUTTON */

$("photoButton").onclick =
() => {

$("postImage").click();

};


/* POST PHOTO */

$("postImage").onchange =
async event => {

const file =
event.target.files[0];

if(!file)return;


$("postMessage").textContent =
"Preparing photo...";


try{

selectedPostImage =
await compressImage(
file,
900,
0.58
);


$("imagePreview")
.classList
.remove("hidden");

$("imagePreview")
.innerHTML = `

<img
src="${selectedPostImage}">

<button
class="removeImage">
×
</button>

`;


$("imagePreview")
.querySelector(
".removeImage"
)
.onclick = () => {

selectedPostImage =
"";

$("imagePreview")
.classList
.add("hidden");

$("imagePreview").innerHTML =
"";

$("postImage").value =
"";

};

$("postMessage").textContent =
"";

}catch(error){

showError(
$("postMessage"),
error
);

}

};


/* POST THREAD */

$("postButton").onclick =
async () => {

const text =
$("postText")
.value
.trim();


if(
!text &&
!selectedPostImage
){

$("postMessage").textContent =
"Write something or add a photo.";

return;

}


$("postButton").disabled =
true;

$("postMessage").textContent =
"Posting...";


try{

const me =
await getMyProfile();

await addDoc(
collection(
db,
"threads"
),
{

text:
text,

image:
selectedPostImage,

username:
me.username || "user",

userId:
currentUser.uid,

likes:
0,

createdAt:
serverTimestamp()

}
);


$("postText").value =
"";

selectedPostImage =
"";

$("imagePreview")
.classList
.add("hidden");

$("imagePreview").innerHTML =
"";

$("postImage").value =
"";

$("postMessage").textContent =
"Posted ✓";


setTimeout(
() => {
$("postMessage").textContent =
"";
},
1500
);

}catch(error){

showError(
$("postMessage"),
error
);

}

$("postButton").disabled =
false;

};


/* LIVE THREADS */

function loadThreads(){

const q =
query(
collection(db,"threads"),
orderBy(
"createdAt",
"desc"
)
);


onSnapshot(
q,
snapshot => {

$("threadsList").innerHTML =
"";


if(snapshot.empty){

$("threadsList").innerHTML =
`
<div class="empty">
No threads yet.
</div>
`;

return;

}


snapshot.forEach(
item => {

renderThread(
item
);

});

},
error => {

showError(
$("threadsList"),
error
);

});

}


/* RENDER THREAD */

function renderThread(snapshot){

const data =
snapshot.data();

const name =
data.username ||
"user";


const article =
document.createElement(
"article"
);

article.className =
"thread";


article.innerHTML = `

<div class="user">

<div class="avatarText">

${name
.charAt(0)
.toUpperCase()}

</div>

<div>

<div class="username">

@${escapeHtml(name)}

</div>

<div class="handle">

MAJA

</div>

</div>

</div>


${
data.text
?
`
<div class="threadText">
${escapeHtml(data.text)}
</div>
`
:
""
}


${
data.image
?
`
<img
class="threadImage"
src="${data.image}">
`
:
""
}


<div class="actions">

<button class="action likeButton">

♡ Like (${data.likes || 0})

</button>

<button class="action commentButton">

💬 Comment

</button>

<button class="action shareButton">

↗ Share

</button>

${
data.userId === currentUser.uid
?
`
<button class="action deleteButton">
🗑 Delete
</button>
`
:
""
}

</div>


<div class="comments">

<div class="commentList">
</div>

<div class="commentBox">

<input
placeholder="Write a comment...">

<button>
Send
</button>

</div>

</div>

`;


/* LIKE */

article
.querySelector(

/* ESCAPE */

function escapeHtml(text){

return String(text || "")
.replace(
/[&<>"']/g,
char => {

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[char];

}
);

}


/* COMMENTS */

function loadComments(
threadId,
list
){

const q =
query(
collection(
db,
"threads",
threadId,
"comments"
),
orderBy(
"createdAt",
"asc"
)
);


onSnapshot(
q,
snapshot => {

list.innerHTML =
"";


snapshot.forEach(
item => {

const data =
item.data();

const div =
document.createElement(
"div"
);

div.className =
"comment";

div.innerHTML =
`
<b>
@${escapeHtml(
data.username || "user"
)}
</b>

${escapeHtml(
data.text || ""
)}
`;

list.appendChild(
div
);

});

});

}


/* USERS FOR CHAT */

function loadUsers(){

onSnapshot(
collection(db,"users"),
snapshot => {

$("usersList").innerHTML =
"";

let count =
0;


snapshot.forEach(
item => {

if(
item.id ===
currentUser.uid
)return;


count++;

const data =
item.data();

const name =
data.username ||
"user";


const div =
document.createElement(
"div"
);

div.className =
"chatUser";


div.innerHTML = `

${
data.photo
?
`
<img
class="avatar"
src="${data.photo}">
`
:
`
<div class="avatarText">
${name
.charAt(0)
.toUpperCase()}
</div>
`
}

<div class="chatInfo">

<b>
@${escapeHtml(name)}
</b>

<br>

<span class="small">
Tap to chat
</span>

</div>

`;


div.onclick =
() => {

openChat(
item.id,
name
);

};


$("usersList")
.appendChild(
div
);

});


if(!count){

$("usersList").innerHTML =
`
<div class="empty">
No other users yet.
</div>
`;

}

});

}


/* CHAT ID */

function makeChatId(a,b){

return [
a,
b
]
.sort()
.join("_");

}


/* OPEN CHAT */

function openChat(
uid,
name
){

currentChatUser =
uid;


$("chatUsername")
.textContent =
"@" + name;


$("chatAvatar")
.innerHTML =
`
<div class="avatarText">
${name
.charAt(0)
.toUpperCase()}
</div>
`;


$("chatWindow")
.style
.display =
"block";


loadMessages();

}


/* CLOSE CHAT */

$("closeChat").onclick =
() => {

$("chatWindow")
.style
.display =
"none";


if(
unsubscribeMessages
){

unsubscribeMessages();

unsubscribeMessages =
null;

}

};


/* LIVE MESSAGES */

function loadMessages(){

if(
unsubscribeMessages
){

unsubscribeMessages();

}


const id =
makeChatId(
currentUser.uid,
currentChatUser
);


const q =
query(
collection(
db,
"chats",
id,
"messages"
),
orderBy(
"createdAt",
"asc"
)
);


unsubscribeMessages =
onSnapshot(
q,
snapshot => {

$("messages").innerHTML =
"";


snapshot.forEach(
item => {

const data =
item.data();


const bubble =
document.createElement(
"div"
);

bubble.className =
"bubble " +
(
data.senderId ===
currentUser.uid
?
"mine"
:
""
);

bubble.textContent =
data.text || "";


$("messages")
.appendChild(
bubble
);

});


$("messages")
.scrollTop =
$("messages")
.scrollHeight;

});

}


/* SEND MESSAGE */

$("sendMessage").onclick =
sendMessage;


$("messageInput")
.addEventListener(
"keydown",
event => {

if(
event.key ===
"Enter"
){

sendMessage();

}

});


async function sendMessage(){

const text =
$("messageInput")
.value
.trim();


if(
!text ||
!currentChatUser
)return;


const id =
makeChatId(
currentUser.uid,
currentChatUser
);


try{

await addDoc(
collection(
db,
"chats",
id,
"messages"
),
{

text:
text,

senderId:
currentUser.uid,

createdAt:
serverTimestamp()

}
);


$("messageInput").value =
"";

}catch(error){

alert(
(error.code ||
"ERROR") +
" — " +
error.message
);

}

}

/* NAVIGATION */

window.showPage =
(page,nav) => {

document
.querySelectorAll(
".page"
)
.forEach(
element => {

element
.classList
.remove("active");

}
);


$(page)
.classList
.add("active");


document
.querySelectorAll(
".nav button"
)
.forEach(
element => {

element
.classList
.remove("active");

}
);


$(nav)
.classList
.add("active");

};
