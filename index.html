<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAJA</title>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#fff;
 color:#111;
}

button,
input,
textarea,
select{
 font:inherit;
}

button{
 cursor:pointer;
}

.hidden{
 display:none!important;
}


/* LOGIN */

#login{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.login-box{
 width:100%;
 max-width:380px;
}

.logo{
 text-align:center;
 font-size:55px;
 font-weight:900;
 letter-spacing:-4px;
}

.subtitle{
 text-align:center;
 color:#777;
 margin:5px 0 25px;
}

.input{
 width:100%;
 padding:14px;
 margin-bottom:10px;
 border:1px solid #ddd;
 border-radius:14px;
 outline:none;
}

.primary{
 width:100%;
 padding:14px;
 border:0;
 border-radius:14px;
 background:#111;
 color:#fff;
 font-weight:bold;
}

.switch{
 width:100%;
 padding:14px;
 border:0;
 background:#fff;
 font-weight:bold;
}

.error{
 color:red;
 text-align:center;
 font-size:13px;
 margin-top:10px;
}


/* APP */

#app{
 display:none;
 max-width:680px;
 margin:auto;
 min-height:100vh;
}


/* TOP */

.topbar{
 height:60px;
 position:sticky;
 top:0;
 z-index:20;
 background:#fff;
 border-bottom:1px solid #eee;
 display:flex;
 align-items:center;
 justify-content:center;
}

.topbar strong{
 font-size:24px;
}


/* PAGES */

.page{
 display:none;
 padding-bottom:90px;
}

.page.active{
 display:block;
}


/* COMPOSER */

.composer{
 padding:15px;
 border-bottom:1px solid #eee;
}

.composer textarea{
 width:100%;
 min-height:90px;
 padding:13px;
 border:1px solid #ddd;
 border-radius:15px;
 resize:none;
 outline:none;
}

.row{
 display:flex;
 align-items:center;
 margin-top:8px;
}

.attach{
 border:0;
 background:none;
 font-size:23px;
}

.post{
 margin-left:auto;
 border:0;
 background:#111;
 color:#fff;
 padding:10px 18px;
 border-radius:20px;
 font-weight:bold;
}


/* THREAD */

.thread{
 padding:15px;
 border-bottom:1px solid #eee;
}

.thread-head{
 display:flex;
 align-items:center;
 gap:10px;
}

.avatar{
 width:45px;
 height:45px;
 border-radius:50%;
 background:#111;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 overflow:hidden;
}

.avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.username{
 font-weight:bold;
}

.handle{
 color:#777;
 font-size:12px;
}

.thread-text{
 margin:12px 0;
 line-height:1.5;
 white-space:pre-wrap;
}

.thread-image{
 width:100%;
 max-height:520px;
 object-fit:cover;
 border-radius:15px;
}

.actions{
 display:flex;
 justify-content:space-between;
 max-width:520px;
 margin-top:10px;
}

.action{
 border:0;
 background:none;
 color:#666;
}


/* BOTTOM NAV */

.bottom-nav{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:100%;
 max-width:680px;
 height:70px;
 background:#fff;
 border-top:1px solid #ddd;
 display:flex;
 align-items:center;
 justify-content:space-around;
 z-index:100;
}

.bottom-nav button{
 border:0;
 background:none;
 color:#777;
 font-size:12px;
}

.bottom-nav button.active{
 color:#111;
 font-weight:bold;
}

.bottom-nav i{
 display:block;
 font-style:normal;
 font-size:22px;
 margin-bottom:3px;
}


/* PROFILE */

.profile-header{
 height:60px;
 border-bottom:1px solid #eee;
 display:flex;
 align-items:center;
 padding:0 12px;
}

.back{
 border:0;
 background:none;
 font-size:28px;
}

.banner{
 height:210px;
 background:#ddd center/cover no-repeat;
 position:relative;
}

.camera{
 position:absolute;
 right:15px;
 bottom:15px;
 width:42px;
 height:42px;
 border-radius:50%;
 background:#000b;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
}

.profile-body{
 position:relative;
 padding:65px 16px 100px;
}

.profile-avatar{
 position:absolute;
 top:-55px;
 left:16px;
}

.big-avatar{
 width:108px;
 height:108px;
 border-radius:50%;
 background:#111;
 border:4px solid #fff;
 object-fit:cover;
}

.edit-btn{
 float:right;
 border:1px solid #aaa;
 background:#fff;
 border-radius:20px;
 padding:9px 16px;
 font-weight:bold;
}

.status{
 clear:both;
 padding-top:15px;
 font-weight:bold;
}

.online{
 color:#159447;
}

.offline{
 color:#d00;
}

.profile-name{
 font-size:23px;
 font-weight:800;
 margin-top:7px;
}

.stats{
 display:flex;
 gap:35px;
 margin-top:22px;
}

.stat strong{
 font-size:18px;
}

.stat span{
 display:block;
 color:#777;
 font-size:13px;
}

.gender{
 margin-top:20px;
 padding-bottom:15px;
 border-bottom:1px solid #eee;
}

.profile-option{
 width:100%;
 text-align:left;
 padding:18px 0;
 background:#fff;
 border:0;
 border-bottom:1px solid #eee;
 font-weight:bold;
}


/* USERS */

.user{
 padding:15px;
 border-bottom:1px solid #eee;
}

.user-row{
 display:flex;
 align-items:center;
 gap:10px;
}


/* CHAT */

.chat-window{
 position:fixed;
 inset:0;
 max-width:680px;
 margin:auto;
 background:#fff;
 z-index:300;
 display:none;
}

.chat-window.open{
 display:block;
}

.chat-header{
 height:60px;
 border-bottom:1px solid #eee;
 display:flex;
 align-items:center;
 padding:0 12px;
}

.chat-header button{
 border:0;
 background:none;
 font-size:28px;
}

.chat-header strong{
 margin-left:10px;
}

.messages{
 height:calc(100vh - 120px);
 overflow:auto;
 padding:15px;
}

.message{
 max-width:80%;
 background:#eee;
 padding:10px 13px;
 border-radius:17px;
 margin:7px 0;
}

.message.mine{
 margin-left:auto;
 background:#111;
 color:#fff;
}

.chat-input{
 position:absolute;
 bottom:0;
 width:100%;
 display:flex;
 gap:7px;
 padding:10px;
 border-top:1px solid #eee;
 background:#fff;
}

.chat-input input{
 flex:1;
 border:1px solid #ddd;
 border-radius:20px;
 padding:10px;
}

.send{
 width:42px;
 border:0;
 border-radius:50%;
 background:#111;
 color:#fff;
}

</style>
</head>

<body>


<!-- LOGIN -->

<div id="login">

<div class="login-box">

<div class="logo">
MAJA
</div>

<div class="subtitle">
Connect. Chat. Share.
</div>


<div id="signupFields" class="hidden">

<input
 id="username"
 class="input"
 placeholder="Username">

<select

 class="input">

<option value="">
Gender

<option value="Male">

</option>

</select>

</div>


<input

<button
 id="authBtn"
 class="primary">

Sign In

</button>


<button
 id="switchBtn"
 class="switch">

Create a new account

</button>


<div
 id="authError"
 class="error">
</div>

</div>

</div>


<!-- APP -->

<div id="app">


<div class="topbar">

<strong>
MAJA
</strong>

</div>


<!-- THREADS -->

<section

<textarea
 id="threadText"
 placeholder="What's happening?">
</textarea>


<div class="row">

<button
 id="threadPhotoBtn"

📎

</button>


<input
 id="threadPhoto"
 type="file"
 accept="image/*"
 hidden>


<button
 id="postBtn"
 class="post">

Post

</button>

</div>

</div>


<div id="threadList">
</div>

</section>


<!-- MOMENTS -->

<section
 id="moments"
 class="page">

<div class="composer">

<textarea
 id="momentText"
 placeholder="Create a Moment...">
</textarea>


<div class="row">

<button
 id="momentPhotoBtn"
 class="attach">

📎

</button>


<input
 id="momentPhoto"
 type="file"
 accept="image/*"
 hidden>


<button
 id="momentBtn"
 class="post">

Create

</button>

</div>

</div>


<div id="momentList">
</div>

</section>


<!-- CHAT -->

<section
 id="chat"
 class="page">

<div id="usersList">
</div>

</section>


<!-- PROFILE -->

<section
 id="profile"
 class="page">


<div class="profile-header">

<button
 id="backProfile"
 class="back">

←

</button>

<strong>
Profile
</strong>

</div>


<div
 id="banner"
 class="banner">


<label class="camera">

📷

<input
 id="bannerInput"
 type="file"
 accept="image/*"
 hidden>

</label>

</div>


<div class="profile-body">


<div class="profile-avatar">

<div id="avatarContainer">
</div>


<label class="camera">

📷

<input
 id="avatarInput"
 type="file"
 accept="image/*"
 hidden>

</label>

</div>


<button
 id="editBtn"
 class="edit-btn">

Edit Username

</button>


<div
 id="status"
 class="status">
</div>


<div
 id="profileName"
 class="profile-name">

@Username

</div>


<div class="stats">

<div class="stat">

<strong id="followersCount">
0
</strong>

<span>
Followers
</span>

</div>


<div class="stat">

<strong id="followingCount">
0
</strong>

<span>
Following
</span>

</div>

</div>


<div class="gender">

<strong>
Gender
</strong>

<span id="profileGender">
Not selected
</span>

</div>


<button
 id="threadsBtn"
 class="profile-option">

📜 User's Threads

</button>


<button
 id="likesBtn"
 class="profile-option">

❤️ Likes

</button>


<button
 id="settingsBtn"
 class="profile-option">

⚙️ Settings

</button>


<button
 id="logoutBtn"
 class="profile-option">

🚪 Sign Out

</button>


</div>

</section>


<!-- NAV -->

<nav class="bottom-nav">

<button
 id="navThreads"
 class="active">

<i>🏠</i>

Threads

</button>


<button
 id="navMoments">

<i>✨</i>

Moments

</button>


<button
 id="navChat">

<i>💬</i>

Chat

</button>


<button
 id="navProfile">

<i>👤</i>

Profile

</button>

</nav>

</div>


<!-- CHAT WINDOW -->

<div
 id="chatWindow"
 class="chat-window">


<div class="chat-header">

<button
 id="closeChat">

←

</button>

<strong
 id="chatTitle">

Chat

</strong>

</div>


<div
 id="messages"
 class="messages">
</div>


<div class="chat-input">

<input
 id="messageInput"
 placeholder="Write a message...">


<button
 id="sendBtn"
 class="send">

➤

</button>

</div>

  </div>
