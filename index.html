<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
getFirestore,
collection,
doc,
getDoc,
setDoc,
addDoc,
updateDoc,
deleteDoc,
query,
orderBy,
onSnapshot,
serverTimestamp,
increment
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
getStorage,
ref,
uploadBytes,
getDownloadURL
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig={

apiKey:
"AIzaSyCAThpmkzHUaEgxafLjedZBoDdjfhaHjA4",

authDomain:
"maja-46a91.firebaseapp.com",

projectId:
"maja-46a91",

storageBucket:
"maja-46a91.firebasestorage.app",

messagingSenderId:
"1076643705312",

appId:
"1:1076643705312:web:1c10e9b5cfb0987a3ebb85"

};


const firebaseApp=
initializeApp(firebaseConfig);

const auth=
getAuth(firebaseApp);

const db=
getFirestore(firebaseApp);

const storage=
getStorage(firebaseApp);


let currentUser=null;
let signupMode=false;
let currentChatUser=null;
let stopChat=null;


/* =========================
   HELPER
========================= */

const $=
id=>document.getElementById(id);


function escapeHTML(value){

return String(value||"")
.replace(/[&<>"']/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c]));

}


function usernameOK(name){

return /^[A-Za-z0-9_]{3,20}$/.test(name);

}


async function myData(){

const snap=
await getDoc(
doc(
db,
"users",
currentUser.uid
)
);

return snap.exists()
?snap.data()
:{};

}


/* =========================
   AUTH MODE
========================= */

$("switchAuth").onclick=()=>{

signupMode=!signupMode;

$("signupFields")
.classList.toggle(
"hidden",
!signupMode
);

$("authBtn").textContent=
signupMode
?"Create Account"
:"Sign In";

$("switchAuth").textContent=
signupMode
?"Already have an account? Sign In"
:"Create a new account";

$("authMsg").textContent="";

};


/* =========================
   LOGIN / SIGNUP
========================= */

$("authBtn").onclick=
async()=>{

const email=
$("email").value.trim();

const password=
$("password").value;

const username=
$("signupUsername").value.trim();

const gender=
$("signupGender").value;


if(!email||!password){

$("authMsg").textContent=
"Enter email and password.";

return;

}


if(password.length<6){

$("authMsg").textContent=
"Password must be at least 6 characters.";

return;

}


if(signupMode){

if(!usernameOK(username)){

$("authMsg").textContent=
"Username must be 3-20 letters, numbers or _.";

return;

}

if(!gender){

$("authMsg").textContent=
"Select gender.";

return;

}

}


$("authBtn").disabled=true;


try{

if(signupMode){

const result=
await createUserWithEmailAndPassword(
auth,
email,
password
);


await setDoc(
doc(
db,
"users",
result.user.uid
),
{
username,
email,
gender,
photo:"",
banner:"",
online:true,
lastSeen:serverTimestamp(),
followersCount:0,
followingCount:0,
createdAt:serverTimestamp()
}
);

}else{

await signInWithEmailAndPassword(
auth,
email,
password
);

}

}catch(error){

$("authMsg").textContent=
error.code+" — "+error.message;

}

$("authBtn").disabled=false;

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
auth,
async user=>{

currentUser=user;

if(!user){

$("login").style.display="flex";
$("app").style.display="none";

return;

}

$("login").style.display="none";
$("app").style.display="block";

await ensureUser();

await setOnline(true);

loadThreads();
loadMoments();
loadUsers();
loadNotifications();
loadProfile();

});


async function ensureUser(){

const refUser=
doc(
db,
"users",
currentUser.uid
);

const snap=
await getDoc(refUser);


if(!snap.exists()){

await setDoc(
refUser,
{
username:
"Maja_"+Math.floor(
Math.random()*9000+1000
),
email:
currentUser.email||"",
gender:"",
photo:"",
banner:"",
online:true,
lastSeen:serverTimestamp(),
followersCount:0,
followingCount:0,
createdAt:serverTimestamp()
}
);

}

}


/* =========================
   ONLINE
========================= */

async function setOnline(value){

if(!currentUser)return;

await setDoc(
doc(
db,
"users",
currentUser.uid
),
{
online:value,
lastSeen:serverTimestamp()
},
{
merge:true
}
);

}


document.addEventListener(
"visibilitychange",
()=>{

if(document.visibilityState==="visible")
setOnline(true);
else
setOnline(false);

});


/* =========================
   NOTIFICATIONS
========================= */

async function notify(
target,
text
){

if(!target||
target===currentUser.uid)return;

await addDoc(
collection(db,"notifications"),
{
userId:target,
fromId:currentUser.uid,
text,
read:false,
createdAt:serverTimestamp()
}
);

}


function loadNotifications(){

const q=
query(
collection(db,"notifications"),
orderBy(
"createdAt",
"desc"
)
);


onSnapshot(q,snap=>{

$("notifications").innerHTML="";

let unread=0;


snap.forEach(item=>{

const d=item.data();

if(d.userId!==currentUser.uid)
return;

if(!d.read)
unread++;


const div=
document.createElement("div");

div.className=
"notification "+
(

/* =========================
   PROFILE IMAGE UPLOAD
========================= */

async function uploadProfileImage(
file,
type
){

if(!file||!currentUser)
return;


if(!file.type.startsWith("image/")){

alert("Please select an image.");

return;

}


if(file.size>5*1024*1024){

alert("Image must be less than 5MB.");

return;

}


try{

const folder=
type==="banner"
?"banners"
:"profilePictures";


const imageRef=
ref(
storage,
`${folder}/${currentUser.uid}_${Date.now()}`
);


const upload=
await uploadBytes(
imageRef,
file
);


const url=
await getDownloadURL(
upload.ref
);


await setDoc(
doc(
db,
"users",
currentUser.uid
),
type==="banner"
?{banner:url}
:{photo:url},
{merge:true}
);


await loadProfile();


}catch(error){

console.error(error);

alert(
"Upload failed: "+
error.message
);

}

}

query(
