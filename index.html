<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAJA</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f5f5f5;color:#111;font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login{
 min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:20px;background:#fff
}
.login-box{width:100%;max-width:390px}
.logo{text-align:center;font-size:50px;font-weight:900}
.tag{text-align:center;color:#777;margin:5px 0 25px}
input,textarea{
 width:100%;padding:14px;border:1px solid #ddd;border-radius:13px;
 outline:none;background:#fff;margin-bottom:10px
}
textarea{min-height:95px;resize:none}
.main-btn{
 border:0;border-radius:12px;background:#111;color:#fff;
 padding:13px 18px;font-weight:bold
}
.login-box .main-btn{width:100%}
.switch-btn{width:100%;border:0;background:#fff;padding:14px;font-weight:bold}
.msg{text-align:center;color:#777;font-size:13px;margin-top:10px}

.app{
 display:none;width:100%;max-width:680px;min-height:100dvh;
 margin:auto;background:#fff;position:relative
}
.header{
 height:60px;position:sticky;top:0;z-index:20;
 display:flex;align-items:center;justify-content:center;
 background:#fff;border-bottom:1px solid #eee
}
.header b{font-size:27px}

.page{display:none;padding-bottom:85px}
.page.active{display:block}

/* THREAD */
.composer{padding:15px;border-bottom:1px solid #eee}
.tools{display:flex;align-items:center;gap:8px}
.tool{border:0;background:#eee;border-radius:10px;padding:10px 13px}
.post-btn{margin-left:auto}
.thread-preview{margin-bottom:10px;position:relative}
.thread-preview img{
 width:100%;max-height:400px;object-fit:cover;border-radius:14px
}
.thread{
 padding:16px;border-bottom:1px solid #eee
}
.user{display:flex;align-items:center;gap:10px}
.avatar,.avatar-text{
 width:45px;height:45px;border-radius:50%;flex-shrink:0
}
.avatar{object-fit:cover;background:#ddd}
.avatar-text{
 display:flex;align-items:center;justify-content:center;
 background:#111;color:#fff;font-weight:bold
}
.username{font-weight:bold}
.handle{color:#888;font-size:12px}
.thread-text{
 margin:12px 0;line-height:1.5;white-space:pre-wrap;word-break:break-word
}
.thread-img{
 width:100%;max-height:550px;object-fit:cover;border-radius:14px;display:block
}
.actions{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px}
.action{border:0;background:transparent;color:#666;padding:5px 0}
.comments{display:none;margin-top:12px}
.comment{padding:10px 0;border-top:1px solid #eee;font-size:14px}
.comment-box{display:flex;gap:7px;margin-top:8px}
.comment-box input{flex:1;min-width:0;margin:0}
.comment-box button{
 border:0;background:#111;color:#fff;border-radius:10px;padding:0 15px
}
.empty{text-align:center;padding:50px 20px;color:#888}

/* PROFILE */
.banner{
 width:100%;height:220px;background:#ddd center/cover no-repeat;
 position:relative
}
.profile-body{position:relative;padding:65px 18px 20px}
.profile-pic,.profile-pic-text{
 width:105px;height:105px;position:absolute;top:-53px;left:20px;
 border-radius:50%;border:4px solid #fff
}
.profile-pic{object-fit:cover;background:#ddd}
.profile-pic-text{
 display:flex;align-items:center;justify-content:center;
 background:#111;color:#fff;font-size:35px;font-weight:bold
}
.profile-head{
 display:flex;justify-content:space-between;align-items:flex-start;gap:10px
}
.profile-head h2{margin:0 0 5px;word-break:break-word}
.settings-btn{border:0;background:#eee;border-radius:10px;padding:10px}
.stats{display:flex;gap:40px;padding:20px 0;border-bottom:1px solid #eee}
.stat b{display:block;text-align:center}
.stat span{display:block;font-size:12px;color:#777;margin-top:4px}
.settings{display:none;padding-top:20px}
.settings.open{display:block}
.label{display:block;font-weight:bold;font-size:13px;margin:12px 0 7px}
.file{
 display:inline-block;background:#eee;border-radius:10px;
 padding:11px 14px;margin-bottom:10px;font-weight:bold
}
.logout{border:0;background:#eee;border-radius:10px;padding:12px 20px}

/* PICTURE EDITOR */
.editor{
 position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.92);
 display:none;align-items:center;justify-content:center;padding:15px
}
.editor.open{display:flex}
.editor-box{
 width:100%;max-width:650px;max-height:90dvh;
 position:relative;background:#111;border-radius:18px;
 overflow:hidden;padding:55px 12px 12px
}
.editor-close{
 position:absolute;right:10px;top:10px;z-index:5;
 width:42px;height:42px;border:0;border-radius:50%;
 background:#fff;color:#111;font-size:25px;font-weight:bold
}
.editor-title{
 position:absolute;left:15px;top:20px;color:#fff;font-weight:bold
}
.editor-image-wrap{
 display:flex;justify-content:center;align-items:center;
 max-height:65dvh;overflow:hidden
}
.editor-image{
 max-width:100%;max-height:65dvh;object-fit:contain;border-radius:12px
}
.editor-actions{
 display:flex;gap:8px;margin-top:12px
}
.editor-actions button{flex:1}

/* CHAT USERS */
.chat-user{
 display:flex;align-items:center;gap:12px;padding:15px;
 border-bottom:1px solid #eee
}
.chat-info{flex:1}
.small{font-size:12px;color:#888}

/* CHAT */
.chat-window{
 display:none;position:fixed;inset:0;width:100%;height:100dvh;
 max-width:680px;margin:auto;z-index:100;background:#fff;
 flex-direction:column;overflow:hidden
}
.chat-window.open{display:flex}
.chat-header{
 height:60px;min-height:60px;flex-shrink:0;
 display:flex;align-items:center;gap:10px;padding:8px;
 border-bottom:1px solid #ddd;background:#fff
}
.back{border:0;background:transparent;font-size:32px;line-height:1;padding:5px 12px}
#chatName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.messages{
 flex:1;min-height:0;overflow-y:auto;padding:15px;
 -webkit-overflow-scrolling:touch
}
.bubble{
 max-width:78%;width:max-content;padding:10px 13px;margin:7px 0;
 border-radius:15px;background:#eee;word-break:break-word;white-space:pre-wrap
}
.bubble.mine{margin-left:auto;background:#111;color:#fff}
.send-box{
 min-height:62px;height:62px;flex-shrink:0;
 display:flex;align-items:center;gap:7px;padding:8px;
 padding-bottom:calc(8px + env(safe-area-inset-bottom));
 border-top:1px solid #ddd;background:#fff
}
.send-box input{flex:1;min-width:0;height:45px;margin:0}
.send-box button{
 height:45px;flex-shrink:0;border:0;background:#111;color:#fff;
 border-radius:10px;padding:0 17px;font-weight:bold
}

/* NAV */
.nav{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:100%;max-width:680px;height:70px;display:flex;
 justify-content:space-around;align-items:center;background:#fff;
 border-top:1px solid #ddd;z-index:30;padding-bottom:env(safe-area-inset-bottom)
}
.nav button{border:0;background:transparent;color:#777;min-width:80px}
.nav button.active{color:#111;font-weight:bold}
.nav span{display:block;font-size:21px;margin-bottom:2px}

@media(max-width:680px){
 .banner{height:190px}
 .profile-body{padding-left:15px;padding-right:15px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">
 <div class="login-box">

  <div class="logo">MAJA</div>
  <div class="tag">Connect. Chat. Share.</div>

  <div id="usernameArea" class="hidden">
   <input id="username" type="text"
    placeholder="Username e.g. Maja_social"
    maxlength="20" autocomplete="username">
  </div>

  <input id="email" type="email" placeholder="Email address" autocomplete="email">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">

  <button id="authBtn" class="main-btn">Sign In</button>
  <button id="switchBtn" class="switch-btn">Create a new account</button>

  <div id="authMsg" class="msg"></div>
 </div>
</div>


<!-- APP -->
<div id="app" class="app">

 <div class="header"><b>MAJA</b></div>

 <!-- THREADS -->
 <section id="threadsPage" class="page active">

  <div class="composer">

   <textarea id="postText" placeholder="What's happening?"></textarea>

   <div id="postPreview" class="thread-preview hidden"></div>

   <div class="tools">

    <button id="photoBtn" class="tool">📷 Photo</button>

    <input id="postFile" type="file" accept="image/*" class="hidden">

    <button id="postBtn" class="main-btn post-btn">Post</button>

   </div>

   <div id="postMsg" class="msg"></div>
  </div>

  <div id="threads"></div>
 </section>


 <!-- CHAT USERS -->
 <section id="chatPage" class="page">
  <div id="users"></div>
 </section>


 <!-- PROFILE -->
 <section id="profilePage" class="page">

  <div id="banner" class="banner"></div>

  <div class="profile-body">

   <div id="profilePicture"></div>

   <div class="profile-head">

    <div>
     <h2 id="profileName">@user</h2>
     <div id="profileEmail" class="small"></div>
    </div>

    <button id="settingsBtn" class="settings-btn">⚙️ Settings</button>

   </div>

   <div class="stats">
    <div class="stat">
     <b id="postCount">0</b>
     <span>Threads</span>
    </div>

    <div class="stat">
     <b id="likeCount">0</b>
     <span>Likes</span>
    </div>
   </div>

   <div id="profilePosts"></div>

   <div id="settings" class="settings">

    <label class="label">Username</label>

    <input id="editUsername"
     placeholder="Maja_social" maxlength="20">

    <button id="saveUsername" class="main-btn">
     Save Username
    </button>


    <label class="label">Profile Picture</label>

    <label class="file">
     🖼️ Choose Picture
     <input id="profileFile" type="file" accept="image/*" class="hidden">
    </label>


    <label class="label">Profile Banner</label>

    <label class="file">
     🖼️ Choose Banner
     <input id="bannerFile" type="file" accept="image/*" class="hidden">
    </label>

    <div id="profileMsg" class="msg"></div>

    <br>

    <button id="logout" class="logout">Sign Out</button>

   </div>
  </div>
 </section>


 <nav class="nav">

  <button id="threadsNav" class="active">
   <span>📜</span>Threads
  </button>

  <button id="chatNav">
   <span>💬</span>Chat
  </button>

  <button id="profileNav">
   <span>👤</span>Profile
  </button>

 </nav>

</div>


<!-- CHAT WINDOW -->
<div id="chatWindow" class="chat-window">

 <div class="chat-header">

  <button id="backChat" class="back">‹</button>

  <div id="chatAvatar"></div>

  <b id="chatName">@user</b>

 </div>

 <div id="messages" class="messages"></div>

 <div class="send-box">

  <input id="messageInput"
   type="text"
   placeholder="Write a message..."
   autocomplete="off">

  <button id="sendBtn">Send</button>

 </div>

</div>


<!-- PICTURE EDITOR -->
<div id="pictureEditor" class="editor">

 <div class="editor-box">

  <!-- X IS NOW AT TOP RIGHT -->
  <button id="closeEditor" class="editor-close">×</button>

  <div id="editorTitle" class="editor-title">
   Edit Picture
  </div>

  <div class="editor-image-wrap">
   <img id="editorImage" class="editor-image" alt="Picture preview">
  </div>

  <div class="editor-actions">

   <button id="cancelEditor" class="tool">
    Cancel
   </button>

   <button id="saveEditor" class="main-btn">
    Save
   </button>

  </div>

 </div>
</div>


<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 doc,
 setDoc,
 getDoc,
 addDoc,
 updateDoc,
 deleteDoc,
 query,
 orderBy,
 onSnapshot,
 serverTimestamp,
 increment
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={
 apiKey:"AIzaSyCAThpmkzHUaEgxafLjedZBoDdjfhaHjA4",
 authDomain:"maja-46a91.firebaseapp.com",
 projectId:"maja-46a91",
 storageBucket:"maja-46a91.firebasestorage.app",
 messagingSenderId:"1076643705312",
 appId:"1:1076643705312:web:1c10e9b5cfb0987a3ebb85"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* VARIABLES */

let user=null;
let createMode=false;
let postImage="";
let chatUser=null;
let stopMessages=null;

let editorFileType="";
let editorTarget="";


/* HELPERS */

const $=id=>document.getElementById(id);

function escapeText(value){
 return String(value||"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[c]));
}

function validUsername(name){
 return /^[A-Za-z0-9_]{3,20}$/.test(name);
}


/* IMAGE CONVERTER */

function imageToBase64(file,maxWidth=1000){

 return new Promise((resolve,reject)=>{

  const reader=new FileReader();

  reader.onload=()=>{

   const img=new Image();

   img.onload=()=>{

    const scale=Math.min(1,maxWidth/img.width);

    const canvas=document.createElement("canvas");

    canvas.width=Math.round(img.width*scale);
    canvas.height=Math.round(img.height*scale);

    canvas.getContext("2d").drawImage(
     img,0,0,canvas.width,canvas.height
    );

    resolve(canvas.toDataURL("image/jpeg",.65));
   };

   img.onerror=reject;
   img.src=reader.result;
  };

  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}


/* =====================================================
 LOGIN
===================================================== */

$("switchBtn").onclick=()=>{

 createMode=!createMode;

 $("usernameArea").classList.toggle(
  "hidden",!createMode
 );

 $("authBtn").textContent=
  createMode?"Create Account":"Sign In";

 $("switchBtn").textContent=
  createMode
  ?"Already have an account? Sign In"
  :"Create a new account";

 $("authMsg").textContent="";
};


$("authBtn").onclick=async()=>{

 const email=$("email").value.trim();
 const password=$("password").value;
 const username=$("username").value.trim();

 if(!email){
  $("authMsg").textContent="Enter your email.";
  return;
 }

 if(!password){
  $("authMsg").textContent="Enter your password.";
  return;
 }

 if(password.length<6){
  $("authMsg").textContent="Password must be at least 6 characters.";
  return;
 }

 if(createMode&&!validUsername(username)){
  $("authMsg").textContent=
   "Username: 3-20 letters, numbers or underscore.";
  return;
 }

 $("authBtn").disabled=true;
 $("authBtn").textContent=createMode?"Creating...":"Signing in...";

 try{

  if(createMode){

   const result=await createUserWithEmailAndPassword(
    auth,email,password
   );

   await setDoc(
    doc(db,"users",result.user.uid),
    {
     username,
     email,
     photo:"",
     banner:"",
     createdAt:serverTimestamp()
    }
   );

  }else{

   await signInWithEmailAndPassword(
    auth,email,password
   );

  }

 }catch(error){

  console.error(error);

  $("authMsg").textContent=
   error.code+" — "+error.message;

 }

 $("authBtn").disabled=false;
 $("authBtn").textContent=
  createMode?"Create Account":"Sign In";
};


/* AUTH */

onAuthStateChanged(auth,async current=>{

 user=current;

 if(!current){

  $("login").style.display="flex";
  $("app").style.display="none";
  return;

 }

 $("login").style.display="none";
 $("app").style.display="block";

 try{

  await ensureUserProfile();
  await loadProfile();
  loadThreads();
  loadUsers();

 }catch(error){

  console.error(error);

 }

});


async function ensureUserProfile(){

 const ref=doc(db,"users",user.uid);
 const snap=await getDoc(ref);

 if(!snap.exists()){

  await setDoc(ref,{
   username:"Maja_"+Math.floor(1000+Math.random()*9000),
   email:user.email||"",
   photo:"",
   banner:"",
   createdAt:serverTimestamp()
  });

 }
}


async function myProfile(){

 const snap=await getDoc(
  doc(db,"users",user.uid)
 );

 return snap.exists()?snap.data():{};
}


/* =====================================================
 PROFILE
===================================================== */

async function loadProfile(){

 const data=await myProfile();

 const name=data.username||"user";

 $("profileName").textContent="@"+name;
 $("profileEmail").textContent=data.email||user.email||"";
 $("editUsername").value=name;

 if(data.banner){
  $("banner").style.backgroundImage=
   `url("${data.banner}")`;
 }else{
  $("banner").style.backgroundImage="none";
 }

 if(data.photo){

  $("profilePicture").innerHTML=
   `<img class="profile-pic" src="${data.photo}">`;

 }else{

  $("profilePicture").innerHTML=
   `<div class="profile-pic-text">
    ${escapeText(name.charAt(0).toUpperCase())}
   </div>`;

 }
}


$("settingsBtn").onclick=()=>{
 $("settings").classList.toggle("open");
};


/* USERNAME */

$("saveUsername").onclick=async()=>{

 const name=$("editUsername").value.trim();

 if(!validUsername(name)){

  $("profileMsg").textContent=
   "Username must be 3-20 letters, numbers or underscore.";

  return;
 }

 $("saveUsername").disabled=true;
 $("profileMsg").textContent="Saving...";

 try{

  await setDoc(
   doc(db,"users",user.uid),
   {username:name},
   {merge:true}
  );

  await loadProfile();

  $("profileMsg").textContent="Username saved ✓";

 }catch(error){

  $("profileMsg").textContent=
   error.code+" — "+error.message;

 }

 $("saveUsername").disabled=false;
};


/* =====================================================
 PICTURE EDITOR
===================================================== */

function openPictureEditor(file,type){

 editorFileType=type;

 const reader=new FileReader();

 reader.onload=()=>{

  $("editorImage").src=reader.result;

  $("editorTitle").textContent=
   type==="profile"
   ?"Edit Profile Picture"
   :"Edit Profile Banner";

  $("pictureEditor").classList.add("open");

 };

 reader.readAsDataURL(file);
}


function closePictureEditor(){

 $("pictureEditor").classList.remove("open");
 $("editorImage").src="";

}


$("closeEditor").onclick=
 closePictureEditor;

$("cancelEditor").onclick=
 closePictureEditor;


/* PROFILE PICTURE */

$("profileFile").onchange=async event=>{

 const file=event.target.files[0];

 if(!file)return;

 openPictureEditor(file,"profile");

};


$("saveEditor").onclick=async()=>{

 if(!$("editorImage").src)return;

 $("saveEditor").disabled=true;
 $("saveEditor").textContent="Saving...";

 try{

  const response=await fetch(
   $("editorImage").src
  );

  const blob=await response.blob();

  const image=await imageToBase64(
   new File([blob],"image.jpg",{type:"image/jpeg"}),
   editorFileType==="profile"?600:1200
  );

  await setDoc(
   doc(db,"users",user.uid),
   editorFileType==="profile"
   ?{photo:image}
   :{banner:image},
   {merge:true}
  );

  await loadProfile();

  $("profileMsg").textContent=
   editorFileType==="profile"
   ?"Profile picture updated ✓"
   :"Banner updated ✓";

  closePictureEditor();

 }catch(error){

  console.error(error);

  $("profileMsg").textContent=
   error.code+" — "+error.message;

 }

 $("saveEditor").disabled=false;
 $("saveEditor").textContent="Save";

};


/* BANNER */

$("bannerFile").onchange=event=>{

 const file=event.target.files[0];

 if(!file)return;

 openPictureEditor(file,"banner");

};


/* LOGOUT */

$("logout").onclick=async()=>{
 await signOut(auth);
};


/* =====================================================
 POST
===================================================== */

$("photoBtn").onclick=()=>{
 $("postFile").click();
};


$("postFile").onchange=async event=>{

 const file=event.target.files[0];

 if(!file)return;

 try{

  postImage=await imageToBase64(file,1000);

  $("postPreview").classList.remove("hidden");

  $("postPreview").innerHTML=
   `<img src="${postImage}" alt="Preview">`;

 }catch(error){

  console.error(error);

 }
};


$("postBtn").onclick=async()=>{

 const text=$("postText").value.trim();

 if(!text&&!postImage){

  $("postMsg").textContent=
   "Write something or add a photo.";

  return;
 }

 $("postBtn").disabled=true;
 $("postMsg").textContent="Posting...";

 try{

  const me=await myProfile();

  await addDoc(
   collection(db,"threads"),
   {
    text,
    image:postImage,
    username:me.username||"user",
    userId:user.uid,
    likes:0,
    createdAt:serverTimestamp()
   }
  );

  $("postText").value="";
  postImage="";
  $("postFile").value="";
  $("postPreview").innerHTML="";
  $("postPreview").classList.add("hidden");

  $("postMsg").textContent="Posted ✓";

  setTimeout(()=>{
   $("postMsg").textContent="";
  },1500);

 }catch(error){

  console.error(error);

  $("postMsg").textContent=
   error.code+" — "+error.message;

 }

 $("postBtn").disabled=false;
};


/* =====================================================
 THREADS
===================================================== */

function loadThreads(){

 const q=query(
  collection(db,"threads"),
  orderBy("createdAt","desc")
 );

 onSnapshot(q,snap=>{

  $("threads").innerHTML="";

  snap.forEach(item=>{
   renderThread(item,$("threads"));
  });

  if(snap.empty){

   $("threads").innerHTML=
    `<div class="empty">No threads yet.</div>`;

  }

 },error=>{

  console.error(error);

  $("threads").innerHTML=
   `<div class="empty">
    ${escapeText(error.code)}
    <br>
    ${escapeText(error.message)}
   </div>`;

 });
}


function renderThread(snap,container){

 const data=snap.data();

 const article=document.createElement("article");

 article.className="thread";

 const initial=(data.username||"u")
  .charAt(0).toUpperCase();

 article.innerHTML=`

  <div class="user">

   <div class="avatar-text">
    ${escapeText(initial)}
   </div>

   <div>
    <div class="username">
     @${escapeText(data.username||"user")}
    </div>
    <div class="handle">MAJA</div>
   </div>

  </div>

  ${
   data.text
   ?`<div class="thread-text">
      ${escapeText(data.text)}
     </div>`
   :""
  }

  ${
   data.image
   ?`<img class="thread-img"
       src="${data.image}"
       alt="Thread image">`
   :""
  }

  <div class="actions">

   <button class="action like">
    ♡ Like (${data.likes||0})
   </button>

   <button class="action comment">
    💬 Comment
   </button>

   <button class="action share">
    ↗ Share
   </button>

   ${
    data.userId===user.uid
    ?`<button class="action delete">
       🗑 Delete
      </button>`
    :""
   }

  </div>

  <div class="comments">

   <div class="comment-list"></div>

   <div class="comment-box">

    <input type="text"
     placeholder="Write a comment...">

    <button>Send</button>

   </div>

  </div>
 `;


 /* LIKE */

 article.querySelector(".like").onclick=async()=>{

  try{

   await updateDoc(
    doc(db,"threads",snap.id),
    {likes:increment(1)}
   );

  }catch(error){

   console.error(error);

  }

 };


 /* COMMENTS */

 article.querySelector(".comment").onclick=()=>{

  const box=article.querySelector(".comments");

  if(box.style.display==="block"){

   box.style.display="none";

  }else{

   box.style.display="block";

   loadComments(
    snap.id,
    article.querySelector(".comment-list")
   );

  }

 };


 const input=
  article.querySelector(".comment-box input");

 const send=
  article.querySelector(".comment-box button");


 send.onclick=async()=>{

  const text=input.value.trim();

  if(!text)return;

  send.disabled=true;

  try{

   const me=await myProfile();

   await addDoc(
    collection(
     db,
     "threads",
     snap.id,
     "comments"
    ),
    {
     text,
     username:me.username||"user",
     userId:user.uid,
     createdAt:serverTimestamp()
    }
   );

   input.value="";

  }catch(error){

   console.error(error);

  }

  send.disabled=false;

 };


 /* SHARE */

 article.querySelector(".share").onclick=async()=>{

  try{

   if(navigator.share){

    await navigator.share({
     title:"MAJA",
     text:data.text||"Check this MAJA thread"
    });

   }else{

    await navigator.clipboard.writeText(
     data.text||"Check this MAJA thread"
    );

    alert("Copied ✓");

   }

  }catch(error){}

 };


 /* DELETE */

 const deleteBtn=
  article.querySelector(".delete");

 if(deleteBtn){

  deleteBtn.onclick=async()=>{

   if(!confirm("Delete this thread?"))return;

   try{

    await deleteDoc(
     doc(db,"threads",snap.id)
    );

   }catch(error){

    alert(
     error.code+
     "\n"+
     error.message
    );

   }

  };

 }

 container.appendChild(article);
}


/* COMMENTS */

function loadComments(threadId,list){

 const q=query(
  collection(
   db,
   "threads",
   threadId,
   "comments"
  ),
  orderBy("createdAt","asc")
 );

 onSnapshot(q,snap=>{

  list.innerHTML="";

  snap.forEach(item=>{

   const data=item.data();

   const div=document.createElement("div");

   div.className="comment";

   div.innerHTML=
    `<b>@${escapeText(
     data.username||"user"
    )}</b>
    ${escapeText(data.text||"")}`;

   list.appendChild(div);

  });

 });
}


/* =====================================================
 CHAT USERS
===================================================== */

function loadUsers(){

 onSnapshot(
  collection(db,"users"),
  snap=>{

   $("users").innerHTML="";

   let found=false;

   snap.forEach(item=>{

    if(item.id===user.uid)return;

    found=true;

    const data=item.data();

    const name=data.username||"user";

    const div=document.createElement("div");

    div.className="chat-user";

    div.innerHTML=`

     ${
      data.photo
      ?`<img class="avatar"
          src="${data.photo}">`
      :`<div class="avatar-text">
          ${escapeText(
           name.charAt(0).toUpperCase()
          )}
        </div>`
     }

     <div class="chat-info">

      <b>@${escapeText(name)}</b>

      <br>

      <span class="small">
       Tap to chat
      </span>

     </div>

    `;

    div.onclick=()=>{
     openChat(
      item.id,
      name,
      data.photo||""
     );
    };

    $("users").appendChild(div);

   });

   if(!found){

    $("users").innerHTML=
     `<div class="empty">
      No other users yet.
      </div>`;

   }

  }
 );
}


/* CHAT ID */

function makeChatId(a,b){

 return [a,b].sort().join("_");

}


/* OPEN CHAT */

function openChat(uid,name,photo){

 chatUser=uid;

 $("chatName").textContent="@"+name;

 if(photo){

  $("chatAvatar").innerHTML=
   `<img class="avatar" src="${photo}">`;

 }else{

  $("chatAvatar").innerHTML=
   `<div class="avatar-text">
    ${escapeText(
     name.charAt(0).toUpperCase()
    )}
   </div>`;

 }

 $("chatWindow").classList.add("open");

 document.body.style.overflow="hidden";

 loadMessages();

}


/* LIVE MESSAGES */

function loadMessages(){

 if(stopMessages){

  stopMessages();
  stopMessages=null;

 }

 const chatId=makeChatId(
  user.uid,
  chatUser
 );

 const q=query(
  collection(
   db,
   "chats",
   chatId,
   "messages"
  ),
  orderBy("createdAt","asc")
 );

 stopMessages=onSnapshot(
  q,
  snap=>{

   $("messages").innerHTML="";

   snap.forEach(item=>{

    const data=item.data();

    const div=document.createElement("div");

    div.className=
     "bubble "+
     (
      data.senderId===user.uid
      ?"mine"
      :""
     );

    div.textContent=data.text||"";

    $("messages").appendChild(div);

   });

   requestAnimationFrame(()=>{
    $("messages").scrollTop=
     $("messages").scrollHeight;
   });

  },
  error=>{

   console.error(error);

   $("messages").innerHTML=
    `<div class="empty">
     ${escapeText(error.code)}
     <br><br>
     ${escapeText(error.message)}
     </div>`;

  }
 );
}


/* SEND MESSAGE */

async function sendMessage(){

 const input=$("messageInput");
 const button=$("sendBtn");

 const text=input.value.trim();

 if(!text||!chatUser)return;

 button.disabled=true;
 button.textContent="Sending...";

 const chatId=makeChatId(
  user.uid,
  chatUser
 );

 try{

  await addDoc(
   collection(
    db,
    "chats",
    chatId,
    "messages"
   ),
   {
    text,
    senderId:user.uid,
    receiverId:chatUser,
    createdAt:serverTimestamp()
   }
  );

  input.value="";
  input.focus();

 }catch(error){

  console.error(error);

  alert(
   "An kasa aika saƙon:\n\n"+
   error.code+
   "\n"+
   error.message
  );

 }

 button.disabled=false;
 button.textContent="Send";
}


$("sendBtn").onclick=sendMessage;

$("messageInput").addEventListener(
 "keydown",
 event=>{

  if(event.key==="Enter"){

   event.preventDefault();
   sendMessage();

  }

 }
);


/* BACK */

$("backChat").onclick=()=>{

 $("chatWindow").classList.remove("open");

 document.body.style.overflow="";

 if(stopMessages){

  stopMessages();
  stopMessages=null;

 }

 chatUser=null;

};


/* =====================================================
 NAVIGATION
===================================================== */

function showPage(pageId,navId){

 document.querySelectorAll(".page")
  .forEach(page=>{
   page.classList.remove("active");
  });

 $(pageId).classList.add("active");

 document.querySelectorAll(".nav button")
  .forEach(button=>{
   button.classList.remove("active");
  });

 $(navId).classList.add("active");
}


$("threadsNav").onclick=()=>{
 showPage("threadsPage","threadsNav");
};

$("chatNav").onclick=()=>{
 showPage("chatPage","chatNav");
};

$("profileNav").onclick=async()=>{
 showPage("profilePage","profileNav");
 await loadProfile();
};

</script>

</body>
</html>
