<script type="module">

/* =========================
   FIREBASE
========================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
getFirestore,
collection,
doc,
setDoc,
getDoc,
addDoc,
updateDoc,
deleteDoc,
query,
orderBy,
onSnapshot,
serverTimestamp,
increment
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyCAThpmkzHUaEgxafLjedZBoDdjfhaHjA4",

authDomain:
"maja-46a91.firebaseapp.com",

projectId:
"maja-46a91",

storageBucket:
"maja-46a91.firebasestorage.app",

messagingSenderId:
"1076643705312",

appId:
"1:1076643705312:web:1c10e9b5cfb0987a3ebb85"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


let user=null;
let createMode=false;
let postImage="";
let stopMessages=null;


/* =========================
   HELPERS
========================= */

const $=
id=>document.getElementById(id);


function escapeText(value){

return String(value||"")
.replace(/[&<>"']/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c]));

}


function validUsername(name){

return /^[A-Za-z0-9_]{3,20}$/.test(name);

}


async function getMe(){

const snap=
await getDoc(
doc(db,"users",user.uid)
);

return snap.exists()
?snap.data()
:{};

}


function imageToBase64(file,max=1000){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();

reader.onload=()=>{

const img=
new Image();

img.onload=()=>{

const scale=
Math.min(
1,
max/img.width
);

const canvas=
document.createElement("canvas");

canvas.width=
img.width*scale;

canvas.height=
img.height*scale;

const ctx=
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);

resolve(
canvas.toDataURL(
"image/jpeg",
0.7
)
);

};

img.onerror=reject;

img.src=reader.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}


/* =========================
   AUTH MODE
========================= */

$("switchBtn").onclick=()=>{

createMode=!createMode;

$("usernameArea")
.classList.toggle(
"hidden",
!createMode
);

$("gender")
.classList.toggle(
"hidden",
!createMode
);

$("authBtn").textContent=
createMode
?"Create Account"
:"Sign In";

$("switchBtn").textContent=
createMode
?"Already have an account? Sign In"
:"Create a new account";

$("authMsg").textContent="";

};


/* =========================
   LOGIN / SIGNUP
========================= */

$("authBtn").onclick=
async()=>{

const email=
$("email").value.trim();

const password=
$("password").value;

const username=
$("username").value.trim();

const gender=
$("gender").value;


if(!email||!password){

$("authMsg").textContent=
"Fill email and password.";

return;

}


if(password.length<6){

$("authMsg").textContent=
"Password must be at least 6 characters.";

return;

}


if(
createMode &&
!validUsername(username)
){

$("authMsg").textContent=
"Username must be 3-20 letters, numbers or _.";

return;

}


if(createMode&&!gender){

$("authMsg").textContent=
"Select gender.";

return;

}


$("authBtn").disabled=true;


try{

if(createMode){

const result=
await createUserWithEmailAndPassword(
auth,
email,
password
);


await setDoc(
doc(db,"users",result.user.uid),
{
username,
email,
gender,
photo:"",
banner:"",
online:true,
lastSeen:serverTimestamp(),
followersCount:0,
followingCount:0,
createdAt:serverTimestamp()
}
);


}else{

await signInWithEmailAndPassword(
auth,
email,
password
);

}

}catch(error){

$("authMsg").textContent=
error.code+
" — "+
error.message;

}


$("authBtn").disabled=false;

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
auth,
async current=>{

user=current;


if(!current){

$("login").style.display="flex";
$("app").style.display="none";

return;

}


$("login").style.display="none";
$("app").style.display="block";


await ensureUser();

await setOnline(true);

await loadProfile();

loadThreads();

loadMoments();

loadUsers();

loadNotifications();

});


async function ensureUser(){

const ref=
doc(db,"users",user.uid);

const snap=
await getDoc(ref);


if(!snap.exists()){

await setDoc(
ref,
{
username:
"Maja_"+Math.floor(
Math.random()*9000+1000
),
email:user.email||"",
gender:"",
photo:"",
banner:"",
online:true,
lastSeen:serverTimestamp(),
followersCount:0,
followingCount:0,
createdAt:serverTimestamp()
}
);

}

}


/* =========================
   ONLINE / OFFLINE
========================= */

async function setOnline(value){

if(!user)return;


await setDoc(
doc(db,"users",user.uid),
{
online:value,
lastSeen:serverTimestamp()
},
{merge:true}
);

}


window.addEventListener(
"beforeunload",
()=>{
setOnline(false);
}
);

document.addEventListener(
"visibilitychange",
()=>{

if(document.visibilityState==="visible"){

setOnline(true);

}else{

setOnline(false);

}

});


/* =========================
   NOTIFICATION
========================= */

async function notification(
target,
text,
threadId=""
){

if(!target||target===user.uid)return;


await addDoc(
collection(db,"notifications"),
{

function loadThreads(){

const q=
query(
collection(db,"threads"),
orderBy("createdAt","desc")
);


onSnapshot(q,snap=>{

$("threads").innerHTML="";


snap.forEach(item=>{

const d=item.data();

const el=
document.createElement("article");

el.className="thread";


const initial=
(d.username||"U")
.charAt(0)
.toUpperCase();


el.innerHTML=`

<div class="user">

<div class="avatarText">
${escapeText(initial)}
</div>

<div>

<div class="username">
@${escapeText(d.username||"user")}
</div>

<div class="handle">
MAJA
</div>

</div>

</div>

${
d.text
?
`
<div class="threadText">
${escapeText(d.text)}
</div>
`
:""
}

${
d.image
?
`
<img
class="threadImg"
src="${d.image}">
`
:""
}

<div class="actions">

<button class="action like">
♡ Like (${d.likes||0})
</button>

<button class="action comment">
💬 Comment
</button>

<button class="action repost">
🔁 Repost (${d.reposts||0})
</button>

${
d.userId===user.uid
?
`
<button class="action delete">
🗑 Delete
</button>
`
:""
}

</div>

<div class="comments hidden"></div>
`;


const like=
el.querySelector(".like");


const likeId=
user.uid+"_"+item.id;


getDoc(
doc(db,"likes",likeId)
).then(s=>{

if(s.exists()){

like.classList.add("liked");

like.textContent=
"♥ Liked ("+
(d.likes||0)+
")";

}

});


like.onclick=
async()=>{

like.disabled=true;


try{

const ref=
doc(db,"likes",likeId);

const existing=
await getDoc(ref);


if(existing.exists()){

await deleteDoc(ref);

await updateDoc(
doc(db,"threads",item.id),
{
likes:increment(-1)
}
);

like.classList.remove("liked");

like.textContent=
"♡ Like ("+
Math.max(
0,
(d.likes||1)-1
)+
")";

}else{

await setDoc(
ref,
{
userId:user.uid,
threadId:item.id,
createdAt:serverTimestamp()
}
);

await updateDoc(
doc(db,"threads",item.id),
{
likes:increment(1)
}
);

like.classList.add("liked");

like.textContent=
"♥ Liked ("+
((d.likes||0)+1)+
")";


if(d.userId!==user.uid){

const me=
await getMe();

await notification(
d.userId,
"@"+
(me.username||"user")+
" liked your thread."
);

}

}

}catch(error){

alert(error.message);

}

async function isFollowing(
targetId
){

const snap=
await getDoc(
doc(
db,
"following",
user.uid,
"list",
targetId
)
);

return snap.exists();

}


async function followUser(
targetId
){

if(targetId===user.uid)return;


const already=
await isFollowing(targetId);


if(already){

await deleteDoc(
doc(
db,
"following",
user.uid,
"list",
targetId
)
);

await deleteDoc(
doc(
db,
"followers",
targetId,
"list",
user.uid
)
);


await updateDoc(
doc(db,"users",user.uid),
{
followingCount:increment(-1)
}
);


await updateDoc(
doc(db,"users",targetId),
{
followersCount:increment(-1)
}
);


}else{

await setDoc(
doc(
db,
"following",
user.uid,
"list",
targetId
),
{
userId:targetId,
createdAt:serverTimestamp()
}
);


await setDoc(
doc(
db,
"followers",
targetId,
"list",
user.uid
),
{
userId:user.uid,
createdAt:serverTimestamp()
}
);


await updateDoc(
doc(db,"users",user.uid),
{
followingCount:increment(1)
}
);


await updateDoc(
doc(db,"users",targetId),
{
followersCount:increment(1)
}
);


const me=
await getMe();


await notification(
targetId,
"@"+
(me.username||"user")+
" followed you."
);

}

}

return [a,b].sort().join("_");

}

function openChat(uid,name){

$("chatWindow")
.classList.add("open");

$("chatName")
.textContent="@"+name;

loadMessages(uid);

}


function loadMessages(uid){

if(stopMessages)
stopMessages();


const id=
chatId(
user.uid,
uid
);


const q=
query(
collection(
db,
"chats",
id,
"messages"
),
orderBy(
"createdAt",
"asc"
)
);


stopMessages=
onSnapshot(q,snap=>{

$("messages").innerHTML="";


snap.forEach(item=>{

const d=item.data();

const div=
document.createElement("div");

div.className=
"bubble "+
(
d.senderId===user.uid
?"mine"
:""
);

div.textContent=
d.text||"";


$("messages")
.appendChild(div);

});


$("messages").scrollTop=
$("messages").scrollHeight;

});

}


$("sendBtn").onclick=
async()=>{

const text=
$("messageInput").value.trim();

if(!text)return;


/*
  Current chat user is taken
  from chat title is not reliable,
  so this simple version keeps
  chat sending disabled until
  a chat target is stored.
*/

if(!$("chatWindow").dataset.uid){

return;

}

};


$("chatBack").onclick=()=>{

$("chatWindow")
.classList.remove("open");

if(stopMessages){

stopMessages();

stopMessages=null;

}

};
