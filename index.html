<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJA</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#fff;
 color:#111
}
button,input,textarea,select{
 font:inherit
}
button{cursor:pointer}

.hidden{display:none!important}

#login{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px
}

.login{
 width:100%;
 max-width:380px
}

.logo{
 text-align:center;
 font-size:52px;
 font-weight:900;
 margin-bottom:5px
}

.sub{
 text-align:center;
 color:#777;
 margin-bottom:25px
}

.input{
 width:100%;
 padding:14px;
 border:1px solid #ddd;
 border-radius:14px;
 margin-bottom:10px;
 outline:none
}

.primary{
 width:100%;
 padding:14px;
 border:0;
 border-radius:14px;
 background:#111;
 color:#fff;
 font-weight:bold
}

.switch{
 width:100%;
 padding:14px;
 border:0;
 background:#fff;
 font-weight:bold
}

.error{
 text-align:center;
 color:red;
 font-size:13px
}

#app{
 display:none;
 max-width:680px;
 margin:auto;
 min-height:100vh
}

.top{
 height:60px;
 position:sticky;
 top:0;
 z-index:20;
 background:#fff;
 border-bottom:1px solid #eee;
 display:flex;
 justify-content:center;
 align-items:center
}

.top strong{
 font-size:24px
}

.page{
 display:none;
 padding-bottom:90px
}

.page.active{
 display:block
}

.composer{
 padding:15px;
 border-bottom:1px solid #eee
}

textarea{
 width:100%;
 min-height:90px;
 padding:13px;
 border:1px solid #ddd;
 border-radius:15px;
 resize:none
}

.row{
 display:flex;
 align-items:center;
 margin-top:8px
}

.attach{
 border:0;
 background:none;
 font-size:23px
}

.post{
 margin-left:auto;
 border:0;
 background:#111;
 color:#fff;
 padding:10px 18px;
 border-radius:20px;
 font-weight:bold
}

.thread{
 padding:15px;
 border-bottom:1px solid #eee
}

.head{
 display:flex;
 gap:10px;
 align-items:center
}

.avatar{
 width:45px;
 height:45px;
 border-radius:50%;
 background:#111;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold
}

.name{
 font-weight:bold
}

.handle{
 color:#777;
 font-size:12px
}

.text{
 margin:12px 0;
 line-height:1.5;
 white-space:pre-wrap
}

.photo{
 width:100%;
 max-height:500px;
 object-fit:cover;
 border-radius:15px
}

.actions{
 display:flex;
 justify-content:space-between;
 max-width:500px
}

.action{
 border:0;
 background:none;
 color:#666
}

.nav{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:100%;
 max-width:680px;
 height:70px;
 background:#fff;
 border-top:1px solid #ddd;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:100
}

.nav button{
 border:0;
 background:none;
 color:#777;
 font-size:12px
}

.nav button.active{
 color:#111;
 font-weight:bold
}

.nav i{
 display:block;
 font-style:normal;
 font-size:22px
}

.profileTop{
 height:60px;
 border-bottom:1px solid #eee;
 display:flex;
 align-items:center;
 padding:0 12px
}

.back{
 border:0;
 background:none;
 font-size:28px
}

.banner{
 height:210px;
 background:#ddd center/cover no-repeat;
 position:relative
}

.camera{
 position:absolute;
 right:15px;
 bottom:15px;
 width:42px;
 height:42px;
 border-radius:50%;
 background:#000b;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center
}

.profile{
 position:relative;
 padding:65px 16px 100px
}

.avatarWrap{
 position:absolute;
 top:-55px;
 left:16px
}

.bigAvatar{
 width:108px;
 height:108px;
 border-radius:50%;
 object-fit:cover;
 background:#111;
 border:4px solid #fff
}

.edit{
 float:right;
 border:1px solid #aaa;
 background:#fff;
 border-radius:20px;
 padding:9px 16px;
 font-weight:bold
}

.status{
 clear:both;
 padding-top:15px;
 font-weight:bold
}

.online{color:#159447}
.offline{color:#d00}

.profileName{
 font-size:23px;
 font-weight:800;
 margin-top:7px
}

.stats{
 display:flex;
 gap:35px;
 margin-top:22px
}

.stat strong{
 font-size:18px
}

.stat span{
 display:block;
 color:#777;
 font-size:13px
}

.gender{
 margin-top:20px;
 padding-bottom:15px;
 border-bottom:1px solid #eee
}

.profileBtn{
 width:100%;
 text-align:left;
 padding:18px 0;
 background:#fff;
 border:0;
 border-bottom:1px solid #eee;
 font-weight:bold
}

.window{
 position:fixed;
 inset:0;
 max-width:680px;
 margin:auto;
 background:#fff;
 z-index:300;
 display:none
}

.window.open{
 display:block
}

.windowHead{
 height:60px;
 border-bottom:1px solid #eee;
 display:flex;
 align-items:center;
 padding:0 12px
}

.windowHead button{
 border:0;
 background:none;
 font-size:28px
}

.windowHead strong{
 margin-left:10px
}

.messages{
 height:calc(100vh - 120px);
 overflow:auto;
 padding:15px
}

.msg{
 max-width:80%;
 background:#eee;
 padding:10px 13px;
 border-radius:17px;
 margin:7px 0
}

.msg.mine{
 margin-left:auto;
 background:#111;
 color:#fff
}

.chatInput{
 position:absolute;
 bottom:0;
 width:100%;
 display:flex;
 gap:7px;
 padding:10px;
 border-top:1px solid #eee;
 background:#fff
}

.chatInput input{
 flex:1;
 border:1px solid #ddd;
 border-radius:20px;
 padding:10px
}

.send{
 width:42px;
 border:0;
 border-radius:50%;
 background:#111;
 color:#fff
}

.user{
 padding:15px;
 border-bottom:1px solid #eee
}

.userRow{
 display:flex;
 align-items:center;
 gap:10px
}
</style>
</head>

<body>

<div id="login">

<div class="login">

<div class="logo">MAJA</div>

<div class="sub">
Connect. Chat. Share.
</div>

<div id="signupFields" class="hidden">

<input
 id="username"
 class="input"
 placeholder="Username">

<select id="gender" class="input">
<option value="">Gender</option>
<option>Male</option>
<option>Female</option>
</select>

</div>

<input
 id="email"
 class="input"
 type="email"
 placeholder="Email">

<input
 id="password"
 class="input"
 type="password"
 placeholder="Password">

<button id="authBtn" class="primary">
Sign In
</button>

<button id="switchBtn" class="switch">
Create a new account
</button>

<div id="authError" class="error"></div>

</div>
</div>


<div id="app">

<header class="top">
<strong>MAJA</strong>
</header>


<section id="threads" class="page active">

<div class="composer">

<textarea
 id="threadText"
 placeholder="What's happening?"></textarea>

<div class="row">

<button id="threadPhotoBtn" class="attach">
📎
</button>

<input
 id="threadPhoto"
 type="file"
 accept="image/*"
 hidden>

<button id="postBtn" class="post">
Post
</button>

</div>
</div>

<div id="threadList"></div>

</section>


<section id="moments" class="page">

<div class="composer">

<textarea
 id="momentText"
 placeholder="Create a Moment..."></textarea>

<div class="row">

<button id="momentPhotoBtn" class="attach">
📎
</button>

<input
 id="momentPhoto"
 type="file"
 accept="image/*"
 hidden>

<button id="momentBtn" class="post">
Create
</button>

</div>
</div>

<div id="momentList"></div>

</section>


<section id="chat" class="page">

<div id="usersList"></div>

</section>


<section id="profile" class="page">

<div class="profileTop">

<button id="backProfile" class="back">
←
</button>

<strong>Profile</strong>

</div>

<div id="banner" class="banner">

<label class="camera">
📷
<input
 id="bannerInput"
 type="file"
 accept="image/*"
 hidden>
</label>

</div>

<div class="profile">

<div class="avatarWrap">

<div id="avatarContainer"></div>

<label class="camera">
📷
<input
 id="avatarInput"
 type="file"
 accept="image/*"
 hidden>
</label>

</div>

<button id="editBtn" class="edit">
Edit Username
</button>

<div id="status" class="status"></div>

<div id="profileName" class="profileName">
@Username
</div>

<div class="stats">

<div class="stat">
<strong id="followersCount">0</strong>
<span>Followers</span>
</div>

<div class="stat">
<strong id="followingCount">0</strong>
<span>Following</span>
</div>

</div>

<div class="gender">
<strong>Gender</strong>
<span id="profileGender">
Not selected
</span>
</div>

<button id="threadsBtn" class="profileBtn">
📜 User's Threads
</button>

<button id="likesBtn" class="profileBtn">
❤️ Likes
</button>

<button id="settingsBtn" class="profileBtn">
⚙️ Settings
</button>

<button id="logoutBtn" class="profileBtn">
🚪 Sign Out
</button>

</div>
</section>


<nav class="nav">

<button id="navThreads" class="active">
<i>🏠</i>
Threads
</button>

<button id="navMoments">
<i>✨</i>
Moments
</button>

<button id="navChat">
<i>💬</i>
Chat
</button>

<button id="navProfile">
<i>👤</i>
Profile
</button>

</nav>

</div>


<div id="chatWindow" class="window">

<div class="windowHead">

<button id="closeChat">
←
</button>

<strong id="chatTitle">
Chat
</strong>

</div>

<div id="messages" class="messages"></div>

<div class="chatInput">

<input
 id="messageInput"
 placeholder="Write a message...">

<button id="sendBtn" class="send">
➤
</button>

</div>

</div>


<script type="module">

import {
 initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 doc,
 getDoc,
 setDoc,
 addDoc,
 updateDoc,
 deleteDoc,
 increment,
 serverTimestamp,
 query,
 orderBy,
 onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
 getStorage,
 ref,
 uploadBytes,
 getDownloadURL
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


const firebaseConfig={

apiKey:"AIzaSyCAThpmkzHUaEgxafLjedZBoDdjfhaHjA4",

authDomain:"maja-46a91.firebaseapp.com",

projectId:"maja-46a91",

storageBucket:"maja-46a91.firebasestorage.app",

messagingSenderId:"1076643705312",

appId:"1:1076643705312:web:9c13113dbbead2883ebb85"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

const storage=getStorage(app);


let currentUser=null;
let activeChat=null;


const $=id=>document.getElementById(id);


function safe(t){

return String(t||"")
.replace(/[&<>"']/g,x=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[x]));

}


async function getMe(){

const s=await getDoc(
doc(db,"users",currentUser.uid)
);

return s.exists()?s.data():{};

}


/* AUTH */

$("switchBtn").onclick=()=>{

$("signupFields")
.classList.toggle("hidden");

$("authBtn").textContent=
$("signupFields")
.classList.contains("hidden")
?"Sign In"
:"Create Account";

};


$("authBtn").onclick=async()=>{

const email=$("email").value.trim();

const password=$("password").value;

try{

if(
!$("signupFields")
.classList.contains("hidden")
){

const username=$("username").value.trim();

const gender=$("gender").value;

const r=
await createUserWithEmailAndPassword(
auth,
email,
password
);

await setDoc(
doc(db,"users",r.user.uid),
{
username,
gender,
email,
photo:"",
banner:"",
online:true,
followersCount:0,
followingCount:0,
createdAt:serverTimestamp()
}
);

}else{

await signInWithEmailAndPassword(
auth,
email,
password
);

}

}catch(e){

$("authError").textContent=e.message;

}

};


/* AUTH STATE */

onAuthStateChanged(
auth,
async user=>{

if(!user){

$("login").style.display="flex";
$("app").style.display="none";
return;

}

currentUser=user;

$("login").style.display="none";
$("app").style.display="block";

await createUser();

profile();

loadThreads();

loadMoments();

loadUsers();

}
);


async function createUser(){

const r=doc(
db,
"users",
currentUser.uid
);

const s=await getDoc(r);

if(!s.exists()){

await setDoc(r,{
username:"MajaUser",
email:currentUser.email||"",
gender:"",
photo:"",
banner:"",
online:true,
followersCount:0,
followingCount:0,
createdAt:serverTimestamp()
});

}

}


/* NAVIGATION */

function page(id,nav){

document
.querySelectorAll(".page")
.forEach(x=>x.classList.remove("active"));

$(id).classList.add("active");

document
.querySelectorAll(".nav button")
.forEach(x=>x.classList.remove("active"));

$(nav).classList.add("active");

}


$("navThreads").onclick=()=>
page("threads","navThreads");

$("navMoments").onclick=()=>
page("moments","navMoments");

$("navChat").onclick=()=>
page("chat","navChat");

$("navProfile").onclick=()=>{
page("profile","navProfile");
profile();
};


/* THREAD */

$("threadPhotoBtn").onclick=()=>
$("threadPhoto").click();


$("postBtn").onclick=async()=>{

const text=$("threadText").value.trim();

const file=$("threadPhoto").files[0];

if(!text&&!file)return;

const user=await getMe();

let image="";

if(file){

const r=ref(
storage,
"threads/"+currentUser.uid+"_"+Date.now()
);

await uploadBytes(r,file);

image=await getDownloadURL(r);

}

await addDoc(
collection(db,"threads"),
{
userId:currentUser.uid,
username:user.username||"user",
text,
image,
likes:0,
reposts:0,
createdAt:serverTimestamp()
}
);

$("threadText").value="";
$("threadPhoto").value="";

};


/* LOAD THREADS */

function loadThreads(){

const q=query(
collection(db,"threads"),
orderBy("createdAt","desc")
);

onSnapshot(q,snap=>{

$("threadList").innerHTML="";

snap.forEach(item=>{

const d=item.data();

const el=document.createElement("div");

el.className="thread";

el.innerHTML=`

<div class="head">

<div class="avatar">
${safe(
(d.username||"U").charAt(0).toUpperCase()
)}
</div>

<div>

<div class="name">
@${safe(d.username||"user")}
</div>

<div class="handle">
MAJA
</div>

</div>

</div>

<div class="text">
${safe(d.text||"")}
</div>

${
d.image
?`<img class="photo" src="${d.image}">`
:""
}

<div class="actions">

<button class="action like">
♡ ${d.likes||0}
</button>

<button class="action">
💬
</button>

<button class="action repost">
🔁 ${d.reposts||0}
</button>

</div>
`;

const like=el.querySelector(".like");

like.onclick=async()=>{

await updateDoc(
doc(db,"threads",item.id),
{
likes:increment(1)
}
);

};

const repost=el.querySelector(".repost");

repost.onclick=async()=>{

await updateDoc(
doc(db,"threads",item.id),
{
reposts:increment(1)
}
);

};

$("threadList").appendChild(el);

});

});

}


/* MOMENTS */

$("momentPhotoBtn").onclick=()=>
$("momentPhoto").click();


$("momentBtn").onclick=async()=>{

const text=$("momentText").value.trim();

const file=$("momentPhoto").files[0];

if(!text&&!file)return;

const user=await getMe();

let image="";

if(file){

const r=ref(
storage,
"moments/"+currentUser.uid+"_"+Date.now()
);

await uploadBytes(r,file);

image=await getDownloadURL(r);

}

await addDoc(
collection(db,"moments"),
{
userId:currentUser.uid,
username:user.username||"user",
text,
image,
createdAt:serverTimestamp()
}
);

$("momentText").value="";
$("momentPhoto").value="";

};


function loadMoments(){

const q=query(
collection(db,"moments"),
orderBy("createdAt","desc")
);

onSnapshot(q,snap=>{

$("momentList").innerHTML="";

snap.forEach(item=>{

const d=item.data();

const el=document.createElement("div");

el.className="thread";

el.innerHTML=`

<div class="name">
✨ @${safe(d.username||"user")}
</div>

<div class="text">
${safe(d.text||"")}
</div>

${
d.image
?`<img class="photo" src="${d.image}">`
:""
}

`;

$("momentList").appendChild(el);

});

});

}


/* PROFILE */

async function profile(){

const user=await getMe();

$("profileName").textContent=
"@"+(user.username||"user");

$("profileGender").textContent=
user.gender||"Not selected";

$("followersCount").textContent=
user.followersCount||0;

$("followingCount").textContent=
user.followingCount||0;

$("status").innerHTML=
user.online
?'<span class="online">💚 Online</span>'
:'<span class="offline">♥️ Offline</span>';


if(user.banner){

$("banner").style.backgroundImage=
`url("${user.banner}")`;

}


if(user.photo){

$("avatarContainer").innerHTML=
`<img class="bigAvatar" src="${user.photo}">`;

}else{

$("avatarContainer").innerHTML=`

<div class="bigAvatar"
style="
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:35px">

${safe(
(user.username||"U")
.charAt(0)
.toUpperCase()
)}

</div>

`;

}

}


/* PHOTO */

$("avatarInput").onchange=async e=>{

const file=e.target.files[0];

if(!file)return;

const r=ref(
storage,
"profile/"+currentUser.uid+"_"+Date.now()
);

await uploadBytes(r,file);

const url=await getDownloadURL(r);

await setDoc(
doc(db,"users",currentUser.uid),
{photo:url},
{merge:true}
);

profile();

};


/* BANNER */

$("bannerInput").onchange=async e=>{

const file=e.target.files[0];

if(!file)return;

const r=ref(
storage,
"banners/"+currentUser.uid+"_"+Date.now()
);

await uploadBytes(r,file);

const url=await getDownloadURL(r);

await setDoc(
doc(db,"users",currentUser.uid),
{banner:url},
{merge:true}
);

profile();

};


/* EDIT */

$("editBtn").onclick=async()=>{

const user=await getMe();

const username=prompt(
"Edit Username:",
user.username||""
);

if(!username)return;

await setDoc(
doc(db,"users",currentUser.uid),
{username:username.trim()},
{merge:true}
);

profile();

};


/* USERS */

function loadUsers(){

onSnapshot(
collection(db,"users"),
snap=>{

$("usersList").innerHTML="";

snap.forEach(item=>{

if(item.id===currentUser.uid)return;

const d=item.data();

const el=document.createElement("div");

el.className="user";

el.innerHTML=`

<div class="userRow">

<div class="avatar">
${safe(
(d.username||"U")
.charAt(0).toUpperCase()
)}
</div>

<div>

<div class="name">
@${safe(d.username||"user")}
</div>

<div class="${
d.online?"online":"offline"
}">

${
d.online
?"💚 Online"
:"♥️ Offline"
}

</div>

</div>

</div>

`;

el.onclick=()=>openChat(
item.id,
d.username||"user"
);

$("usersList").appendChild(el);

});

}
);

}


/* CHAT */

function chatID(){

return[
currentUser.uid,
activeChat
].sort().join("_");

}


function openChat(uid,name){

activeChat=uid;

$("chatTitle").textContent="@"+name;

$("chatWindow")
.classList.add("open");

loadMessages();

}


function loadMessages(){

const q=query(
collection(
db,
"chats",
chatID(),
"messages"
),
orderBy("createdAt","asc")
);

onSnapshot(q,snap=>{

$("messages").innerHTML="";

snap.forEach(item=>{

const d=item.data();

const el=document.createElement("div");

el.className=
"msg "+
(
d.userId===currentUser.uid
?"mine":""
);

el.textContent=d.text||"";

$("messages").appendChild(el);

});

});

}


$("sendBtn").onclick=async()=>{

const input=$("messageInput");

const text=input.value.trim();

if(!text||!activeChat)return;

await addDoc(
collection(
db,
"chats",
chatID(),
"messages"
),
{
userId:currentUser.uid,
text,
createdAt:serverTimestamp()
}
);

input.value="";

};


$("closeChat").onclick=()=>{

$("chatWindow")
.classList.remove("open");

activeChat=null;

};


/* SIGN OUT */

$("logoutBtn").onclick=async()=>{

await setDoc(
doc(db,"users",currentUser.uid),
{online:false},
{merge:true}
);

await signOut(auth);

};

</script>

</body>
</html>
