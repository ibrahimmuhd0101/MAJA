<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f4f4;
  color:#111;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:white;
}

.loginBox{
  width:100%;
  max-width:400px;
}

.logo{
  text-align:center;
  font-size:48px;
  font-weight:900;
  margin-bottom:5px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

input,
textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  outline:none;
  background:white;
  margin-bottom:10px;
}

textarea{
  min-height:100px;
  resize:none;
}

.primary{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  background:#111;
  color:white;
  font-weight:bold;
}

.switch{
  width:100%;
  border:0;
  background:white;
  padding:14px;
  font-weight:bold;
}

.message{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:10px;
}

/* APP */

.app{
  display:none;
  max-width:680px;
  min-height:100vh;
  margin:auto;
  background:white;
}

.topbar{
  height:60px;
  position:sticky;
  top:0;
  z-index:10;
  background:white;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:center;
}

.topbar b{
  font-size:27px;
}

/* PAGES */

.page{
  display:none;
  padding-bottom:80px;
}

.page.active{
  display:block;
}

/* COMPOSER */

.composer{
  padding:15px;
  border-bottom:1px solid #eee;
}

.postTools{
  display:flex;
  gap:8px;
  align-items:center;
}

.tool{
  border:0;
  background:#eee;
  border-radius:10px;
  padding:10px 13px;
}

.postButton{
  width:auto;
  margin-left:auto;
  padding:10px 20px;
}

.preview{
  position:relative;
  margin-bottom:10px;
}

.preview img{
  width:100%;
  max-height:420px;
  object-fit:cover;
  border-radius:14px;
}

.removeImage{
  position:absolute;
  right:8px;
  top:8px;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:#111;
  color:white;
}

/* THREADS */

.thread{
  padding:16px;
  border-bottom:1px solid #eee;
}

.user{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar,
.avatarText{
  width:45px;
  height:45px;
  border-radius:50%;
  flex:none;
}

.avatar{
  object-fit:cover;
}

.avatarText{
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.username{
  font-weight:bold;
}

.handle{
  color:#888;
  font-size:12px;
}

.threadText{
  margin:12px 0;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.threadImage{
  width:100%;
  max-height:550px;
  object-fit:cover;
  border-radius:14px;
}

.actions{
  display:flex;
  gap:18px;
  margin-top:12px;
  flex-wrap:wrap;
}

.action{
  border:0;
  background:none;
  color:#666;
}

.action:hover{
  color:#111;
}

/* COMMENTS */

.comments{
  display:none;
  margin-top:12px;
}

.comment{
  border-top:1px solid #eee;
  padding:10px 0;
  font-size:14px;
}

.commentBox{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.commentBox input{
  flex:1;
  margin:0;
}

.commentBox button{
  border:0;
  background:#111;
  color:white;
  border-radius:10px;
  padding:0 15px;
}

/* PROFILE */

.profileBanner{
  height:230px;
  background:#ddd center/cover no-repeat;
}

.profileBody{
  padding:60px 18px 20px;
  position:relative;
}

.profileAvatar{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid white;
  position:absolute;
  top:-52px;
  left:20px;
  background:#111;
}

.profileAvatarText{
  width:105px;
  height:105px;
  border-radius:50%;
  border:4px solid white;
  position:absolute;
  top:-52px;
  left:20px;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:bold;
}

.profileTop{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.profileInfo h2{
  font-size:23px;
  margin-bottom:5px;
}

.profileEmail{
  color:#777;
  font-size:13px;
}

.profileBio{
  margin-top:12px;
  color:#555;
}

.settingsButton{
  border:0;
  background:#eee;
  border-radius:10px;
  padding:10px 13px;
}

.profileStats{
  display:flex;
  gap:40px;
  padding:20px 0;
  border-bottom:1px solid #eee;
}

.stat b{
  display:block;
  text-align:center;
}

.stat span{
  color:#777;
  font-size:12px;
}

.profileTabs{
  display:flex;
  border-bottom:1px solid #eee;
}

.profileTab{
  flex:1;
  padding:14px;
  border:0;
  background:white;
  font-weight:bold;
  border-bottom:2px solid #111;
}

/* SETTINGS */

.settings{
  display:none;
  padding-top:20px;
}

.settings.open{
  display:block;
}

.label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

.fileButton{
  display:inline-block;
  padding:11px 14px;
  background:#eee;
  border-radius:10px;
  font-weight:bold;
  margin-bottom:15px;
}

.logout{
  border:0;
  background:#eee;
  border-radius:10px;
  padding:12px 20px;
}

/* CHAT */

.chatUser{
  display:flex;
  align-items:center;
  gap:11px;
  padding:15px;
  border-bottom:1px solid #eee;
}

.chatInfo{
  flex:1;
}

.small{
  font-size:12px;
  color:#888;
}

.chatWindow{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  max-width:680px;
  margin:auto;
  background:white;
}

.chatHeader{
  height:60px;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
}

.back{
  border:0;
  background:none;
  font-size:30px;
}

.messages{
  height:calc(100vh - 120px);
  overflow:auto;
  padding:15px;
}

.bubble{
  max-width:78%;
  background:#eee;
  border-radius:15px;
  padding:10px 13px;
  margin:7px 0;
  white-space:pre-wrap;
  word-break:break-word;
}

.mine{
  margin-left:auto;
  background:#111;
  color:white;
}

.sendBox{
  height:60px;
  border-top:1px solid #ddd;
  display:flex;
  gap:7px;
  padding:8px;
}

.sendBox input{
  flex:1;
  margin:0;
}

.sendBox button{
  border:0;
  background:#111;
  color:white;
  border-radius:10px;
  padding:0 17px;
}

/* NAV */

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:680px;
  height:70px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  z-index:20;
}

.nav button{
  border:0;
  background:none;
  color:#777;
}

.nav button.active{
  color:#111;
  font-weight:bold;
}

.nav span{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.empty{
  padding:50px 20px;
  text-align:center;
  color:#888;
}
</style>
</head>

<script type="module">

/* FIREBASE */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp,
  increment
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyCAThpmkzHUaEgxafLjedZBoDdjfhaHjA4",

  authDomain:
  "maja-46a91.firebaseapp.com",

  projectId:
  "maja-46a91",

  storageBucket:
  "maja-46a91.firebasestorage.app",

  messagingSenderId:
  "1076643705312",

  appId:
  "1:1076643705312:web:1c10e9b5cfb0987a3ebb85"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* VARIABLES */

let currentUser = null;

let createMode = false;

let selectedPostImage = "";

let currentChatUser = null;

let unsubscribeMessages = null;

let unsubscribeProfilePosts = null;


/* SHORTCUT */

const $ = id =>
document.getElementById(id);


/* HELPER */

function validUsername(name){

  return /^[A-Za-z0-9_]{3,20}$/.test(name);

}


/* ESCAPE */

function escapeHtml(text){

  return String(text || "")
  .replace(
    /[&<>"']/g,
    function(c){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[c];

    }
  );

}


/* IMAGE */

function compressImage(
  file,
  maxWidth,
  quality
){

  return new Promise(
    function(resolve,reject){

      const reader =
      new FileReader();

      reader.onload =
      function(){

        const image =
        new Image();

        image.onload =
        function(){

          const scale =
          Math.min(
            1,
            maxWidth / image.width
          );

          const canvas =
          document.createElement(
            "canvas"
          );

          canvas.width =
          Math.round(
            image.width * scale
          );

          canvas.height =
          Math.round(
            image.height * scale
          );

          const ctx =
          canvas.getContext("2d");

          ctx.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
          );

          resolve(
            canvas.toDataURL(
              "image/jpeg",
              quality
            )
          );

        };

        image.onerror = reject;

        image.src = reader.result;

      };

      reader.onerror = reject;

      reader.readAsDataURL(file);

    }
  );

}


/* LOGIN MODE */

$("switchButton")
.addEventListener(
  "click",
  function(){

    createMode = !createMode;

    $("createFields")
    .classList
    .toggle(
      "hidden",
      !createMode
    );

    $("authButton")
    .textContent =
    createMode
    ? "Create Account"
    : "Sign In";

    $("switchButton")
    .textContent =
    createMode
    ? "Already have an account? Sign In"
    : "Create a new account";

    $("authMessage")
    .textContent = "";

  }
);


/* LOGIN */

$("authButton")
.addEventListener(
  "click",
  async function(){

    const email =
    $("email")
    .value
    .trim();

    const password =
    $("password")
    .value;

    const username =
    $("username")
    .value
    .trim();


    if(!email){

      $("authMessage")
      .textContent =
      "Please enter your email.";

      return;

    }


    if(!password){

      $("authMessage")
      .textContent =
      "Please enter your password.";

      return;

    }


    if(password.length < 6){

      $("authMessage")
      .textContent =
      "Password must be at least 6 characters.";

      return;

    }


    if(
      createMode &&
      !validUsername(username)
    ){

      $("authMessage")
      .textContent =
      "Username: 3-20 letters, numbers or underscore.";

      return;

    }


    $("authButton").disabled = true;

    $("authButton").textContent =
    createMode
    ? "Creating..."
    : "Signing in...";


    $("authMessage")
    .textContent = "";


    try{

      if(createMode){

        const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


        await setDoc(
          doc(
            db,
            "users",
            result.user.uid
          ),
          {

            username:
            username,

            email:
            email,

            photo:
            "",

            banner:
            "",

            createdAt:
            serverTimestamp()

          }
        );


        $("authMessage")
        .textContent =
        "Account created ✓";


      }else{

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        $("authMessage")
        .textContent =
        "Login successful ✓";

      }

    }catch(error){

      console.error(
        "AUTH ERROR:",
        error
      );


      $("authMessage")
      .textContent =
      error.code
      ? error.code +
        " — " +
        error.message
      : error.message;

    }


    $("authButton").disabled = false;

    $("authButton").textContent =
    createMode
    ? "Create Account"
    : "Sign In";

  }
);


/* AUTH STATE */

onAuthStateChanged(
  auth,
  async function(user){

    currentUser = user;


    if(!user){

      $("login").style.display =
      "flex";

      $("app").style.display =
      "none";

      return;

    }


    $("login").style.display =
    "none";

    $("app").style.display =
    "block";


    await loadProfile();

    loadThreads();

    loadUsers();

    loadProfilePosts();

  }
);


/* MY PROFILE */

async function getMyProfile(){

  const snap =
  await getDoc(
    doc(
      db,
      "users",
      currentUser.uid
    )
  );


  if(snap.exists()){

    return snap.data();

  }


  return {};

}


/* PROFILE */

async function loadProfile(){

  try{

    const data =
    await getMyProfile();

    const username =
    data.username ||
    "user";


    $("profileName")
    .textContent =
    "@" + username;


    $("profileEmail")
    .textContent =
    data.email ||
    currentUser.email ||
    "";


    $("editUsername")
    .value =
    username;


    if(data.banner){

      $("profileBanner")
      .style
      .backgroundImage =
      'url("' +
      data.banner +
      '")';

    }else{

      $("profileBanner")
      .style
      .backgroundImage =
      "none";

    }


    if(data.photo){

      $("profileAvatarArea")
      .innerHTML =

      '<img class="profileAvatar" src="' +
      data.photo +
      '" alt="Profile">';

    }else{

      $("profileAvatarArea")
      .innerHTML =

      '<div class="profileAvatarText">' +
      escapeHtml(
        username
        .charAt(0)
        .toUpperCase()
      ) +
      '</div>';

    }

  }catch(error){

    console.error(
      "PROFILE ERROR:",
      error
    );

  }

}


/* SETTINGS */

$("settingsButton")
.addEventListener(
  "click",
  function(){

    $("settingsPanel")
    .classList
    .toggle("open");

  }
);


/* SAVE USERNAME */

$("saveUsername")
.addEventListener(
  "click",
  async function(){

    const username =
    $("editUsername")
    .value
    .trim();


    if(
      !validUsername(username)
    ){

      $("profileMessage")
      .textContent =
      "Username must be 3-20 characters.";

      return;

    }


    $("saveUsername").disabled = true;

    $("profileMessage")
    .textContent =
    "Saving...";


    try{

      await setDoc(
        doc(
          db,
          "users",
          currentUser.uid
        ),
        {

          username:
          username

        },
        {

          merge:true

        }
      );


      await loadProfile();

      $("profileMessage")
      .textContent =
      "Username saved ✓";


    }catch(error){

      console.error(error);

      $("profileMessage")
      .textContent =
      error.code +
      " — " +
      error.message;

    }


    $("saveUsername").disabled = false;

  }
);


/* PROFILE PHOTO */

$("profileImage")
.addEventListener(
  "change",
  async function(event){

    const file =
    event.target.files[0];

    if(!file)return;


    $("profileMessage")

/* THREADS */

function loadThreads(){

  const q =
  query(
    collection(
      db,
      "threads"
    ),
    orderBy(
      "createdAt",
      "desc"
    )
  );


  onSnapshot(
    q,
    function(snapshot){

      $("threadsList")
      .innerHTML = "";


      if(snapshot.empty){

        $("threadsList")
        .innerHTML =

        '<div class="empty">' +
        'No threads yet.' +
        '</div>';

        return;

      }


      snapshot.forEach(
        function(item){

          renderThread(
            item,
            $("threadsList")
          );

        }
      );

    },
    function(error){

      console.error(error);

      $("threadsList")
      .innerHTML =

      '<div class="empty">' +
      error.code +
      ' — ' +
      error.message +
      '</div>';

    }
  );

}


/* PROFILE POSTS */

function loadProfilePosts(){

  if(unsubscribeProfilePosts){

    unsubscribeProfilePosts();

  }


  const q =
  query(
    collection(
      db,
      "threads"
    ),
    where(
      "userId",
      "==",
      currentUser.uid
    )
  );


  unsubscribeProfilePosts =
  onSnapshot(
    q,
    function(snapshot){

      $("profilePosts")
      .innerHTML = "";


      let count = 0;

      let likes = 0;

      const posts = [];


      snapshot.forEach(
        function(item){

          posts.push(item);

          count++;

          likes +=
          Number(
            item.data().likes || 0
          );

        }
      );


      posts.sort(
        function(a,b){

          const aTime =
          a.data().createdAt?.seconds || 0;

          const bTime =
          b.data().createdAt?.seconds || 0;

          return bTime - aTime;

        }
      );


      posts.forEach(
        function(item){

          renderThread(
            item,
            $("profilePosts")
          );

        }
      );


      $("postCount")
      .textContent =
      count;


      $("likeCount")
      .textContent =
      likes;


      if(!count){

        $("profilePosts")
        .innerHTML =

        '<div class="empty">' +
        "You haven't posted anything yet." +
        '</div>';

      }

    },
    function(error){

      console.error(
        "PROFILE POSTS:",
        error
      );

    }
  );

}


/* THREAD RENDER */

function renderThread(
  snapshot,
  container
){

  const data =
  snapshot.data();

  const name =
  data.username ||
  "user";


  const article =
  document.createElement(
    "article"
  );


  article.className =
  "thread";


  article.innerHTML =

  '<div class="user">' +

    '<div class="avatarText">' +

      escapeHtml(
        name
        .charAt(0)
        .toUpperCase()
      ) +

    '</div>' +

    '<div>' +

      '<div class="username">' +
      '@' +
      escapeHtml(name) +
      '</div>' +

      '<div class="handle">' +
      'MAJA' +
      '</div>' +

    '</div>' +

  '</div>' +


  (
    data.text
    ?
    '<div class="threadText">' +
    escapeHtml(data.text) +
    '</div>'
    :
    ''
  ) +


  (
    data.image
    ?
    '<img class="threadImage" src="' +
    data.image +
    '" alt="Post image">'
    :
    ''
  ) +


  '<div class="actions">' +

    '<button class="action likeButton" type="button">' +
    '♡ Like (' +
    (data.likes || 0) +
    ')' +
    '</button>' +

    '<button class="action commentButton" type="button">' +
    '💬 Comment' +
    '</button>' +

    '<button class="action shareButton" type="button">' +
    '↗ Share' +
    '</button>' +

    (
      data.userId === currentUser.uid
      ?
      '<button class="action deleteButton" type="button">' +
      '🗑 Delete' +
      '</button>'
      :
      ''
    ) +

  '</div>' +

  '<div class="comments">' +

    '<div class="commentList"></div>' +

    '<div class="commentBox">' +

      '<input placeholder="Write a comment...">' +

      '<button type="button">Send</button>' +

    '</div>' +

  '</div>';


  /* LIKE */

  article
  .querySelector(
    ".likeButton"
  )
  .addEventListener(
    "click",
    async function(){

      try{

        await updateDoc(
          doc(
            db,
            "threads",
            snapshot.id
          ),
          {

            likes:
            increment(1)

          }
        );

      }catch(error){

        console.error(error);

      }

    }
  );


  /* COMMENTS */

  article
  .querySelector(
    ".commentButton"
  )
  .addEventListener(
    "click",
    function(){

      const box =
      article.querySelector(
        ".comments"
      );


      box.style.display =
      box.style.display === "block"
      ? "none"
      : "block";


      loadComments(
        snapshot.id,
        article.querySelector(
          ".commentList"
        )
      );

    }
  );


  /* SEND COMMENT */

  const input =
  article.querySelector(
    ".commentBox input"
  );


  article
  .querySelector(
    ".commentBox button"
  )
  .addEventListener(
    "click",
    async function(){

      const text =
      input.value.trim();

      if(!text)return;


      try{

        const me =
        await getMyProfile();


        await addDoc(
          collection(
            db,
            "threads",
            snapshot.id,
            "comments"
          ),
          {

            text:
            text,

            username:
            me.username ||
            "user",

            userId:
            currentUser.uid,

            createdAt:
            serverTimestamp()

          }
        );


        input.value = "";

      }catch(error){

        console.error(error);

      }

    }
  );


  /* SHARE */

  article
  .querySelector(
    ".shareButton"
  )
  .addEventListener(
    "click",
    async function(){

      const text =
      data.text ||
      "Check this MAJA thread";


      try{

        if(navigator.share){

          await navigator.share({

            title:
            "MAJA",

            text:
            text

          });

        }else{

          await navigator.clipboard
          .writeText(text);

          alert(
            "Thread copied."
          );

        }

      }catch(error){}

    }
  );


  /* DELETE */

  const deleteButton =
  article.querySelector(
    ".deleteButton"
  );


  if(deleteButton){

    deleteButton
    .addEventListener(
      "click",
      async function(){

        if(
          !confirm(
            "Delete this thread?"
          )
        ){

          return;

        }


        try{

          await deleteDoc(
            doc(
              db,
              "threads",
              snapshot.id
            )
          );

        }catch(error){

          console.error(error);

        }

      }
    );

  }


  container.appendChild(
    article
  );

}


/* COMMENTS LIVE */

function loadComments(
  threadId,
  list
){

  const q =
  query(
    collection(
      db,
      "threads",
      threadId,
      "comments"
    ),
    orderBy(
      "createdAt",
      "asc"
    )
  );


  onSnapshot(
    q,
    function(snapshot){

      list.innerHTML = "";


      snapshot.forEach(
        function(item){

          const data =
          item.data();


          const div =
          document.createElement(
            "div"
          );


          div.className =
          "comment";


          div.innerHTML =

          "<b>@" +
          escapeHtml(
            data.username ||
            "user"
          ) +
          "</b> " +

          escapeHtml(
            data.text ||
            ""
          );


          list.appendChild(
            div
          );

        }
      );

    }
  );

}


/* USERS */

function loadUsers(){

  onSnapshot(
    collection(
      db,
      "users"
    ),
    function(snapshot){

      $("usersList")
      .innerHTML = "";


      let count = 0;


      snapshot.forEach(
        function(item){

          if(
            item.id ===
            currentUser.uid
          ){

            return;

          }


          count++;


          const data =
          item.data();

          const name =
          data.username ||
          "user";


          const div =
          document.createElement(
            "div"
          );


          div.className =
          "chatUser";


          div.innerHTML =

          (
            data.photo
            ?
            '<img class="avatar" src="' +
            data.photo +
            '">'
            :
            '<div class="avatarText">' +
            escapeHtml(
              name
              .charAt(0)
              .toUpperCase()
            ) +
            '</div>'
          ) +

          '<div class="chatInfo">' +

            '<b>@' +
            escapeHtml(name) +
            '</b>' +

            '<br>' +

            '<span class="small">' +
            'Tap to chat' +
            '</span>' +

          '</div>';


          div.addEventListener(
            "click",
            function(){

              openChat(
                item.id,
                name
              );

            }
          );


          $("usersList")
          .appendChild(div);

        }
      );


      if(!count){

        $("usersList")
        .innerHTML =

        '<div class="empty">' +
        'No other users yet.' +
        '</div>';

      }

    }
  );

}


/* CHAT ID */

function makeChatId(
  a,
  b
){

  return [
    a,
    b
  ]
  .sort()
  .join("_");

}


/* OPEN CHAT */

function openChat(
  uid,
  name
){

  currentChatUser =
  uid;


  $("chatUsername")
  .textContent =
  "@" + name;


  $("chatAvatar")
  .innerHTML =

  '<div class="avatarText">' +
  escapeHtml(
    name
    .charAt(0)
    .toUpperCase()
  ) +
  '</div>';


  $("chatWindow")
  .style
  .display =
  "block";


  loadMessages();

}


/* CLOSE CHAT */

$("closeChat")
.addEventListener(
  "click",
  function(){

    $("chatWindow")
    .style
    .display =
    "none";


    if(unsubscribeMessages){

      unsubscribeMessages();

      unsubscribeMessages =
      null;

    }

  }
);


/* MESSAGES */

function loadMessages(){

  if(unsubscribeMessages){

    unsubscribeMessages();

  }


  const chatId =
  makeChatId(
    currentUser.uid,
    currentChatUser
  );


  const q =
  query(
    collection(
      db,
      "chats",
      chatId,
      "messages"
    ),
    orderBy(
      "createdAt",
      "asc"
    )
  );


  unsubscribeMessages =
  onSnapshot(
    q,
    function(snapshot){

      $("messages")
      .innerHTML = "";


      snapshot.forEach(
        function(item){

          const data =
          item.data();


          const bubble =
          document.createElement(
            "div"
          );


          bubble.className =
          "bubble " +
          (
            data.senderId ===
            currentUser.uid
            ?
            "mine"
            :
            ""
          );


          bubble.textContent =
          data.text ||
          "";


          $("messages")
          .appendChild(
            bubble
          );

        }
      );


      $("messages")
      .scrollTop =
      $("messages")
      .scrollHeight;

    }
  );

}


/* SEND MESSAGE */

$("sendMessage")
.addEventListener(
  "click",
  sendMessage
);


$("messageInput")
.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "Enter"
    ){

      sendMessage();

    }

  }
);


async function sendMessage(){

  const text =
  $("messageInput")
  .value
  .trim();


  if(
    !text ||
    !currentChatUser
  ){

    return;

  }


  const chatId =
  makeChatId(
    currentUser.uid,
    currentChatUser
  );


  try{

    await addDoc(
      collection(
        db,
        "chats",
        chatId,
        "messages"
      ),
      {

        text:
        text,

        senderId:
        currentUser.uid,

        createdAt:
        serverTimestamp()

      }
    );


    $("messageInput")
    .value = "";


  }catch(error){

    console.error(error);

    alert(
      error.code +
      " — " +
      error.message
    );

  }

}

/* NAVIGATION */

function showPage(
  pageId,
  navId
){

  document
  .querySelectorAll(
    ".page"
  )
  .forEach(
    function(page){

      page.classList
      .remove("active");

    }
  );


  $(pageId)
  .classList
  .add("active");


  document
  .querySelectorAll(
    ".nav button"
  )
  .forEach(
    function(button){

      button.classList
      .remove("active");

    }
  );


  $(navId)
  .classList
  .add("active");

}
