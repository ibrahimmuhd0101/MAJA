/* =====================================================

}

collection,

}

const firebaseConfig={

apiKey:
"AIzaSyAUQm-3ullzFDRwn5Iu0Hg_7u0Mfiz688o",

authDomain:

projectId:
"maja-1fa6a",

messagingSenderId:
"877281790124",

appId:

};


const firebaseApp=
initializeApp(firebaseConfig);

const auth=
getAuth(firebaseApp);

let currentUser=null;
let activeChat=null;

/* =====================================================
   HELPERS
===================================================== */

const $=id=>
document.getElementById(id);


function safe(value){

return String(value||"")
.replace(/[&<>"']/g,x=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[x]));

}


function formatTime(date){

if(!date)return "";

return date.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

}


function formatDate(date){

if(!date)return "";

return date.toLocaleDateString(
[],
{
day:"numeric",
month:"short",
year:"numeric"
}
);

}


async function getMe(){

if(!currentUser)return {};

const snap=
await getDoc(
doc(
db,
"users",
currentUser.uid
)
);

return snap.exists()
?snap.data()
:{};

}


/* =====================================================
   IMAGE COMPRESSION
   Profile/Banner suna zama daban
===================================================== */

function compressImage(file,maxWidth=900,quality=.72){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=e=>{

const img=new Image();

img.onload=()=>{

let width=img.width;
let height=img.height;

if(width>maxWidth){

height=
height*
(maxWidth/width);

width=maxWidth;

}

const canvas=
document.createElement("canvas");

canvas.width=width;
canvas.height=height;

const ctx=
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
width,
height
);

resolve(
canvas.toDataURL(
"image/jpeg",
quality
)
);

};

img.onerror=reject;

img.src=e.target.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}


/* =====================================================
   AUTH
===================================================== */

let signUpMode=false;


$("switchBtn").onclick=()=>{

signUpMode=!signUpMode;

$("signupFields")
.classList
.toggle(
"hidden",
!signUpMode
);

$("authBtn").textContent=
signUpMode
?"Create Account"
:"Sign In";

$("switchBtn").textContent=
signUpMode
?"Already have an account? Sign In"
:"Create a new account";

};


$("authBtn").onclick=
async()=>{

const email=
$("email").value.trim();

const password=
$("password").value;

$("authError").textContent="";

if(!email||!password){

$("authError").textContent=
"Enter email and password.";

return;

}

try{

if(signUpMode){

const username=
$("username").value.trim();

const gender=
$("gender").value;

if(username.length<3){

$("authError").textContent=
"Username must be at least 3 characters.";

return;

}

if(!gender){

$("authError").textContent=
"Select your gender.";

return;

}

const result=
await createUserWithEmailAndPassword(
auth,
email,
password
);

await setDoc(
doc(
db,
"users",
result.user.uid
),
{

username,
gender,
email,

photo:"",
banner:"",

online:true,

followersCount:0,
followingCount:0,

createdAt:
serverTimestamp(),

lastSeen:
serverTimestamp()

}
);

}else{

await signInWithEmailAndPassword(
auth,
email,
password
);

}

}catch(error){

console.error(error);

$("authError").textContent=
error.message;

}

};


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
auth,
async user=>{

if(!user){

currentUser=null;

$("login").style.display="flex";
$("app").style.display="none";

if(notificationsUnsubscribe){

notificationsUnsubscribe();
notificationsUnsubscribe=null;

}

return;

}

currentUser=user;

$("login").style.display="none";
$("app").style.display="block";

await createUserDocument();

await setOnline(true);

loadThreads();
loadMoments();
loadUsers();
loadNotifications();
await loadProfile();

}
);


async function createUserDocument(){

const ref=
doc(
db,
"users",
currentUser.uid
);

const snap=
await getDoc(ref);

if(!snap.exists()){

await setDoc(
ref,
{

username:"MajaUser",
email:
currentUser.email||"",

gender:"",
photo:"",
banner:"",

online:true,

followersCount:0,
followingCount:0,

createdAt:
serverTimestamp(),

lastSeen:
serverTimestamp()

}
);

}

}


async function setOnline(value){

if(!currentUser)return;

try{

await setDoc(
doc(
db,
"users",
currentUser.uid
),
{

online:value,
lastSeen:
serverTimestamp()

},
{merge:true}
);

}catch(error){

console.log(error);

}

}


setInterval(
()=>{
setOnline(true);
},
60000
);


/* =====================================================
   NAVIGATION
===================================================== */

function showPage(page,button){

document
.querySelectorAll(".page")
.forEach(
x=>x.classList.remove("active")
);

$(page).classList.add("active");

document
.querySelectorAll(".nav button")
.forEach(
x=>x.classList.remove("active")
);

$(button).classList.add("active");

}


$("navThreads").onclick=()=>
showPage(
"threads",
"navThreads"
);

$("navMoments").onclick=()=>
showPage(
"moments",
"navMoments"
);

$("navChat").onclick=()=>
showPage(

"navChat"
);

$("navNotifications").onclick=async()=>{

showPage(
"notifications",
"navNotifications"

/* =====================================================
   THREAD PHOTO
===================================================== */

$("threadPhotoBtn").onclick=()=>
$("threadPhoto").click();


$("postBtn").onclick=
async()=>{

const text=
$("threadText")
.value
.trim();

const file=
$("threadPhoto")
.files[0];

if(!text&&!file)return;

try{

const user=
await getMe();

let image="";

if(file){

image=
await compressImage(file);

}

await addDoc(
collection(
db,
"threads"
),
{

userId:
currentUser.uid,

username:
user.username||"user",

text,
image,

likesCount:0,
commentCount:0,
repostsCount:0,

createdAt:
serverTimestamp()

}
);

$("threadText").value="";

async function createNotification(

type,
relatedId
){

if(
!targetUid||

currentUser.uid
)return;

try{

const me=
await getMe();

await addDoc(
collection(
db,
"notifications"
),
{

fromUserId:
currentUser.uid,

me.username||"user",

type,

relatedId,

read:false,

createdAt:
serverTimestamp()

}
);

}catch(error){

console.log(
"Notification error:",
error
);

}

}


function notificationText(data){

const name=
"@"+
(
data.fromUsername||
"user"
);

if(data.type==="follow")
return `${name} followed you.`;

if(data.type==="followBack")
return `${name} followed you back.`;

if(data.type==="like")
return `${name} liked your thread.`;

if(data.type==="comment")
return `${name} commented on your thread.`;

if(data.type==="repost")
return `${name} reposted your thread.`;

return `${name} interacted with you.`;

}

notificationsUnsubscribe();

where(

)
);

notificationsUnsubscribe=
onSnapshot(
q,
snapshot=>{

snapshot.forEach(
item=>{

const d=item.data();

unread++;

const el=
document.createElement("div");

"notification"+
(
d.read
?""
:" unread"
);

let date="";

if(d.createdAt){

try{

d.createdAt.toDate()
);

}

el.innerHTML=`

${safe(
(d.fromUsername||"U")
.charAt(0)
.toUpperCase()
)}
</div>

<div class="notificationText">

<div>
${safe(
notificationText(d)
)}
</div>

<div class="notificationTime">
${date}
</div>

</div>

`;

$("notificationList")
.appendChild(el);

}
);

if(!snapshot.size){

$("notificationList").innerHTML=
`<div class="empty">
No notifications yet.

}

   EDIT PROFILE
===================================================== */

$("editBtn").onclick=
async()=>{

const user=
await getMe();

$("editUsername").value=
user.username||
"";

$("editGender").value=
user.gender||
"";

$("editModal")
.classList
.add("open");

};


$("closeEdit").onclick=
()=>
$("editModal")
.classList
.remove("open");


$("saveEdit").onclick=
async()=>{

const username=
$("editUsername")
.value
.trim();

const gender=
$("editGender")
.value;

if(username.length<3){

alert(
"Username must be at least 3 characters."
);

return;

}

try{

await setDoc(
doc(
db,
"users",
currentUser.uid
),
{

username,
gender

},
{
merge:true
}
);

$("editModal")
.classList
.remove("open");

await loadProfile();

}catch(error){

alert(error.message);

}

};


/* =====================================================
   PROFILE BUTTONS
===================================================== */

$("threadsBtn").onclick=()=>
showPage(
"threads",
"navThreads"
);


$("likesBtn").onclick=
()=>{

alert(
"Likes section coming soon."
);

};


$("settingsBtn").onclick=
()=>
$("editBtn").click();


/* =====================================================
   LOGOUT
===================================================== */

$("logoutBtn").onclick=
async()=>{

try{

await setOnline(false);

await signOut(auth);

}catch(error){

alert(error.message);

}

};

</script>

</body>
</html>
