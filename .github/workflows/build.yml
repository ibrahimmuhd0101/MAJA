name: Build MAJA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          mkdir -p www
          cp index.html www/index.html

          npx cap init MAJA com.maja.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin dependencies
        working-directory: android
        run: |
          sed -i '/dependencies {/a\    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.9.25")' app/build.gradle
          echo 'configurations.all { resolutionStrategy.force "org.jetbrains.kotlin:kotlin-stdlib:1.9.25" }' >> app/build.gradle
          ./gradlew --stop
          ./gradlew clean

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload MAJA APK
        uses: actions/upload-artifact@v4
        with:
          name: MAJA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
